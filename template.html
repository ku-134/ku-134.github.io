<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模板页 · Kukuz</title>
    <link rel="preload" as="image" href="background.webp">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== 模板页专属样式 ===== */
        .click-hint {
            font-size: 0.7rem;
            opacity: 0.15;
            text-align: center;
            margin-top: 1.5rem;
            user-select: none;
            transition: opacity 0.3s;
            cursor: default;
        }
        .click-hint:hover {
            opacity: 0.3;
        }

        /* ===== 编码工具弹窗 ===== */
        .tool-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            animation: overlayIn 0.3s ease-out;
        }
        .tool-overlay.active {
            display: flex;
        }
        @keyframes overlayIn {
            0% { opacity: 0; backdrop-filter: blur(0px); }
            100% { opacity: 1; backdrop-filter: blur(8px); }
        }

        .tool-modal {
            max-width: 560px;
            width: 92%;
            padding: 2rem 2rem 1.8rem;
            border-radius: 1.8rem;
            background: var(--modal-bg, rgba(12, 22, 12, 0.92));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes modalPop {
            0% { transform: scale(0.92) translateY(16px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        @media (prefers-color-scheme: light) {
            .tool-modal { --modal-bg: rgba(245, 250, 245, 0.94); border-color: rgba(0, 0, 0, 0.06); }
        }

        .tool-modal .modal-icon {
            font-size: 2.4rem;
            text-align: center;
            margin-bottom: 0.2rem;
        }
        .tool-modal .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.2rem;
        }
        .tool-modal .modal-sub {
            font-size: 0.85rem;
            opacity: 0.4;
            text-align: center;
            margin-bottom: 1.2rem;
        }

        .tool-modal .field {
            margin-bottom: 0.8rem;
        }
        .tool-modal .field label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0.5;
            margin-bottom: 0.2rem;
        }
        .tool-modal .field textarea {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border-radius: 0.8rem;
            border: 1px solid rgba(128, 128, 128, 0.12);
            background: rgba(128, 128, 128, 0.04);
            color: inherit;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            outline: none;
            resize: vertical;
            box-sizing: border-box;
            min-height: 100px;
            transition: border-color 0.3s;
        }
        .tool-modal .field textarea:focus {
            border-color: currentColor;
        }

        .tool-modal .result-box {
            padding: 0.6rem 0.8rem;
            border-radius: 0.8rem;
            background: rgba(128, 128, 128, 0.04);
            border: 1px solid rgba(128, 128, 128, 0.06);
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            word-break: break-all;
            max-height: 120px;
            overflow-y: auto;
            opacity: 0.8;
            margin-bottom: 0.8rem;
            min-height: 40px;
        }
        .tool-modal .result-box.empty {
            opacity: 0.2;
            font-style: italic;
        }

        .tool-modal .btn-row {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .tool-modal .btn-row .btn {
            flex: 1;
            min-width: 80px;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            text-align: center;
        }
        .tool-modal .btn-row .btn-primary {
            background: #66bb6a;
            color: #1a2e1a;
        }
        .tool-modal .btn-row .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 187, 106, 0.25);
        }
        .tool-modal .btn-row .btn-secondary {
            background: transparent;
            border: 1px solid rgba(128, 128, 128, 0.15);
            color: inherit;
        }
        .tool-modal .btn-row .btn-secondary:hover {
            background: rgba(128, 128, 128, 0.06);
        }
        .tool-modal .btn-row .btn-danger {
            background: #e74c3c;
            color: #fff;
        }
        .tool-modal .btn-row .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.25);
        }
        .tool-modal .btn-row .btn-close {
            background: transparent;
            border: none;
            color: inherit;
            opacity: 0.3;
            flex: 0 0 auto;
            padding: 0.5rem 1.2rem;
        }
        .tool-modal .btn-row .btn-close:hover {
            opacity: 0.8;
        }

        .tool-modal .status-msg {
            padding: 0.4rem 0.8rem;
            border-radius: 0.6rem;
            font-size: 0.8rem;
            margin-top: 0.6rem;
            text-align: center;
        }
        .tool-modal .status-msg.success {
            background: rgba(102, 187, 106, 0.08);
            color: #a5d6a7;
        }
        .tool-modal .status-msg.error {
            background: rgba(231, 76, 60, 0.08);
            color: #e74c3c;
        }
        @media (prefers-color-scheme: light) {
            .tool-modal .status-msg.success { color: #1b5e20; }
            .tool-modal .status-msg.error { color: #c0392b; }
        }

        .tool-modal .hint-text {
            font-size: 0.7rem;
            opacity: 0.25;
            text-align: center;
            margin-top: 0.6rem;
        }

        /* 滚动条美化 */
        .tool-modal::-webkit-scrollbar {
            width: 4px;
        }
        .tool-modal::-webkit-scrollbar-track {
            background: transparent;
        }
        .tool-modal::-webkit-scrollbar-thumb {
            background: rgba(128, 128, 128, 0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- ===== 主卡片 ===== -->
    <div class="card card-narrow" style="opacity:1;transform:none;animation:none;">
        <h1 class="typing-title" id="clickableTitle">测试文本</h1>
        <div class="sub fade-in-up delay-2" style="animation-delay:0.3s;">— Template —</div>
        <div class="divider fade-in-up delay-3" style="animation-delay:0.5s;"></div>

        <div class="nav-menu fade-in-up delay-4" style="animation-delay:0.7s;">
            <a href="index.html" class="nav-link">🏠 首页</a>
            <a href="about.html" class="nav-link">📖 关于</a>
        </div>

        <p class="desc fade-in-up delay-5" style="animation-delay:0.9s;">
            这是一个模板页。<br>
            测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本
        </p>

        <div class="footer fade-in-up delay-6" style="animation-delay:1.1s;">
            ✦ 测试 · 无实际内容 ✦
        </div>

        <div class="click-hint" id="clickHint">测试文本</div>
    </div>

    <!-- ===== 弹窗 ===== -->
    <div class="tool-overlay" id="toolOverlay">
        <div class="tool-modal">
            <div class="modal-icon">🔐</div>
            <div class="modal-title">编码工具</div>
            <div class="modal-sub">将 category.txt 内容编码为 Base64</div>

            <div class="field">
                <label>📄 粘贴 category.txt 内容</label>
                <textarea id="inputText" placeholder="## 分类名称&#10;- 资源名 | 描述 | 链接 | 类型"></textarea>
            </div>

            <div class="btn-row">
                <button class="btn btn-primary" id="encodeBtn">🔐 编码</button>
                <button class="btn btn-secondary" id="clearBtn">清空</button>
                <button class="btn btn-secondary" id="decodeBtn">🔓 解码</button>
                <button class="btn btn-close" id="closeToolBtn">✕ 关闭</button>
            </div>

            <div class="field" style="margin-top:0.8rem;">
                <label>📦 编码结果（复制到 category.dat）</label>
                <div class="result-box empty" id="resultBox">等待编码...</div>
            </div>

            <div class="btn-row">
                <button class="btn btn-primary" id="copyBtn" style="flex:1;">📋 复制结果</button>
            </div>

            <div id="statusMsg"></div>
            <div class="hint-text">按 Ctrl+Enter 快速编码 · 编码后替换仓库中的 category.dat</div>
        </div>
    </div>

    <!-- ===== 全局脚本 ===== -->
    <script src="script.js"></script>
    <script>
        (function() {
            'use strict';

            // ---------- DOM 引用 ----------
            const title = document.getElementById('clickableTitle');
            const overlay = document.getElementById('toolOverlay');
            const input = document.getElementById('inputText');
            const resultBox = document.getElementById('resultBox');
            const encodeBtn = document.getElementById('encodeBtn');
            const decodeBtn = document.getElementById('decodeBtn');
            const clearBtn = document.getElementById('clearBtn');
            const copyBtn = document.getElementById('copyBtn');
            const closeBtn = document.getElementById('closeToolBtn');
            const statusMsg = document.getElementById('statusMsg');

            // ---------- 点击计数 ----------
            let clickCount = 0;
            let clickTimer = null;

            title.addEventListener('click', function() {
                clickCount++;
                // 点击 5 次后触发
                if (clickCount >= 5) {
                    clickCount = 0;
                    clearTimeout(clickTimer);
                    openTool();
                    return;
                }
                // 3 秒内没有继续点击则重置计数
                clearTimeout(clickTimer);
                clickTimer = setTimeout(function() {
                    clickCount = 0;
                }, 3000);
            });

            // ---------- 弹窗控制 ----------
            function openTool() {
                overlay.classList.add('active');
                document.body.classList.add('modal-open');
                // 清空之前的状态
                input.value = '';
                resultBox.textContent = '等待编码...';
                resultBox.className = 'result-box empty';
                statusMsg.textContent = '';
                statusMsg.className = '';
            }

            function closeTool() {
                overlay.classList.remove('active');
                document.body.classList.remove('modal-open');
            }

            // ---------- 状态提示 ----------
            function showStatus(msg, type) {
                statusMsg.textContent = msg;
                statusMsg.className = 'status-msg ' + type;
                clearTimeout(statusMsg._timer);
                statusMsg._timer = setTimeout(function() {
                    statusMsg.textContent = '';
                    statusMsg.className = '';
                }, 4000);
            }

            // ---------- 编码 ----------
            function encode() {
                const raw = input.value;
                if (!raw.trim()) {
                    showStatus('⚠️ 请先粘贴内容', 'error');
                    return;
                }
                try {
                    const encoded = btoa(unescape(encodeURIComponent(raw)));
                    resultBox.textContent = encoded;
                    resultBox.className = 'result-box';
                    showStatus('✅ 编码成功！共 ' + encoded.length + ' 个字符', 'success');
                } catch (e) {
                    showStatus('❌ 编码失败：' + e.message, 'error');
                }
            }

            // ---------- 解码 ----------
            function decode() {
                const raw = input.value.trim();
                if (!raw) {
                    showStatus('⚠️ 请粘贴要解码的内容', 'error');
                    return;
                }
                try {
                    const decoded = decodeURIComponent(escape(atob(raw)));
                    input.value = decoded;
                    showStatus('✅ 解码成功！', 'success');
                } catch (e) {
                    showStatus('❌ 解码失败：内容可能不是有效的 Base64 编码', 'error');
                }
            }

            // ---------- 清空 ----------
            function clearAll() {
                input.value = '';
                resultBox.textContent = '等待编码...';
                resultBox.className = 'result-box empty';
                statusMsg.textContent = '';
                statusMsg.className = '';
            }

            // ---------- 复制 ----------
            function copyResult() {
                const text = resultBox.textContent;
                if (!text || text === '等待编码...') {
                    showStatus('⚠️ 没有可复制的内容', 'error');
                    return;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(function() {
                        showStatus('✅ 已复制到剪贴板！', 'success');
                    }).catch(function() {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            }

            function fallbackCopy(text) {
                const area = document.createElement('textarea');
                area.value = text;
                area.style.position = 'fixed';
                area.style.opacity = '0';
                document.body.appendChild(area);
                area.select();
                try {
                    document.execCommand('copy');
                    showStatus('✅ 已复制到剪贴板！', 'success');
                } catch (e) {
                    showStatus('⚠️ 复制失败，请手动选择复制', 'error');
                }
                document.body.removeChild(area);
            }

            // ---------- 键盘快捷键 ----------
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    encode();
                }
                if (e.key === 'Escape') {
                    closeTool();
                }
            });

            // ---------- 点击外部关闭 ----------
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) closeTool();
            });

            // ---------- ESC 关闭 ----------
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && overlay.classList.contains('active')) {
                    closeTool();
                }
            });

            // ---------- 绑定按钮事件 ----------
            encodeBtn.addEventListener('click', encode);
            decodeBtn.addEventListener('click', decode);
            clearBtn.addEventListener('click', clearAll);
            copyBtn.addEventListener('click', copyResult);
            closeBtn.addEventListener('click', closeTool);

        })();
    </script>

</body>
</html>
