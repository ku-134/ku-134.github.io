<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -120 240 240" width="100%" height="100%">
  <defs>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.15" />
    </filter>
    
    <!-- 背景光晕渐变 -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A5D6A7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#A5D6A7" stop-opacity="0" />
    </radialGradient>
    
    <!-- 叶片渐变 -->
    <radialGradient id="leafGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#81C784" />
      <stop offset="100%" stop-color="#2E7D32" />
    </radialGradient>
    
    <!-- 单片叶子的路径（心形） -->
    <path id="leaf" d="M 0 0 
             C -25 -10, -45 -30, -45 -55 
             C -45 -75, -25 -85, 0 -70 
             C 25 -85, 45 -75, 45 -55 
             C 45 -30, 25 -10, 0 0 Z" 
          fill="url(#leafGrad)" />
  </defs>

  <!-- 背景光晕 -->
  <circle cx="0" cy="0" r="100" fill="url(#glow)" />

  <!-- 主图形组合（带阴影和旋转动画） -->
  <g filter="url(#shadow)">
    <!-- 缓慢旋转动画 -->
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite" />

    <!-- 叶茎 -->
    <path d="M 0 0 Q 15 50, 5 110" fill="none" stroke="#2E7D32" stroke-width="12" stroke-linecap="round" />

    <!-- 四片叶子（分别旋转 0度、90度、180度、270度） -->
    <use href="#leaf" />
    <use href="#leaf" transform="rotate(90)" />
    <use href="#leaf" transform="rotate(180)" />
    <use href="#leaf" transform="rotate(270)" />

    <!-- 花心细节 -->
    <circle cx="0" cy="0" r="10" fill="#1B5E20" />
    <circle cx="0" cy="0" r="6" fill="#81C784" />
    <!-- 花心高光 -->
    <circle cx="-2" cy="-2" r="2" fill="#C8E6C9" opacity="0.8" />
  </g>
</svg>
