<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏发布页 · Kukuz</title>
    <link rel="preload" as="image" href="background.webp">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== 游戏页专属样式 ===== */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
            margin: 1.5rem 0 1.2rem;
            min-height: 200px;
        }

        .game-card {
            background: rgba(128, 128, 128, 0.04);
            border: 1px solid rgba(128, 128, 128, 0.08);
            border-radius: 1.2rem;
            padding: 1.2rem 1rem 1rem;
            transition: transform 0.3s ease, border-color 0.3s, box-shadow 0.3s;
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
        }
        .game-card:hover {
            transform: translateY(-6px);
            border-color: rgba(128, 128, 128, 0.2);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }

        .game-card .game-name {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 0.4rem;
            color: inherit;
        }

        .game-card .game-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 0.5rem;
            margin-bottom: 0.6rem;
        }
        .game-card .game-tag {
            font-size: 0.7rem;
            padding: 0.1rem 0.7rem;
            border-radius: 2rem;
            background: rgba(128, 128, 128, 0.08);
            border: 1px solid rgba(128, 128, 128, 0.08);
            opacity: 0.7;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .game-card .game-desc {
            font-size: 0.9rem;
            opacity: 0.65;
            line-height: 1.6;
            margin-bottom: 0.8rem;
            flex: 1;
        }

        .game-card .game-images {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 0.8rem;
            min-height: 0;
        }
        .game-card .game-images:not(.has-images) {
            min-height: 0;
        }
        .game-card .game-screenshot {
            width: calc(50% - 0.2rem);
            max-width: 100%;
            border-radius: 0.6rem;
            border: 1px solid rgba(128, 128, 128, 0.06);
            object-fit: cover;
            aspect-ratio: 16 / 9;
            background: rgba(128, 128, 128, 0.03);
            transition: transform 0.2s;
        }
        .game-card .game-screenshot:hover {
            transform: scale(1.02);
        }
        /* 单张图片占满 */
        .game-card .game-images.has-images .game-screenshot:only-child {
            width: 100%;
        }
        /* 三张图片时第一张占满，其余两列 */
        .game-card .game-images.has-images .game-screenshot:first-child:nth-last-child(3) {
            width: 100%;
        }
        .game-card .game-images.has-images .game-screenshot:first-child:nth-last-child(3) ~ .game-screenshot {
            width: calc(50% - 0.2rem);
        }

        .game-card .game-play-btn {
            display: inline-block;
            padding: 0.4rem 1.8rem;
            border-radius: 2rem;
            border: 2px solid currentColor;
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            opacity: 0.5;
            align-self: flex-start;
            margin-top: 0.2rem;
        }
        .game-card .game-play-btn:hover {
            opacity: 1;
            background: currentColor;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }
        @media (prefers-color-scheme: dark) {
            .game-card .game-play-btn:hover { color: #1a2e1a; }
        }

        .game-empty {
            text-align: center;
            padding: 3rem 1rem;
            opacity: 0.5;
            font-size: 1.1rem;
            grid-column: 1 / -1;
        }
        .game-empty .big-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        /* 拉取区域 */
        .fetch-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 240px;
            text-align: center;
            grid-column: 1 / -1;
        }
        .fetch-btn {
            font-size: 1.6rem;
            padding: 1.2rem 3.5rem;
            border-radius: 3rem;
            border: 3px dashed currentColor;
            background: transparent;
            color: inherit;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.6;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .fetch-btn:hover {
            opacity: 1;
            transform: scale(1.03);
            border-style: solid;
        }
        .fetch-btn:active {
            transform: scale(0.96);
        }
        .fetch-btn.loading {
            opacity: 0.8;
            cursor: wait;
            border-style: solid;
            animation: pulse 1.2s ease-in-out infinite;
        }
        .fetch-btn .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
            font-size: 1.4rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .fetch-hint {
            margin-top: 0.8rem;
            font-size: 0.85rem;
            opacity: 0.3;
        }

        /* 统计 */
        .game-stats {
            text-align: center;
            font-size: 0.95rem;
            opacity: 0.5;
            margin-bottom: 0.2rem;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .game-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.8rem;
            }
            .game-card .game-name { font-size: 1.2rem; }
            .game-card .game-desc { font-size: 0.8rem; }
            .game-card .game-tag { font-size: 0.6rem; padding: 0 0.5rem; }
            .game-card .game-screenshot { aspect-ratio: 16 / 10; }
            .fetch-btn { font-size: 1.2rem; padding: 0.9rem 2rem; flex-direction: column; gap: 0.4rem; }
        }
        @media (max-width: 400px) {
            .game-grid { grid-template-columns: 1fr; }
        }

        @media (prefers-color-scheme: light) {
            .game-card { background: rgba(255, 255, 255, 0.4); }
            .game-card .game-tag { background: rgba(0, 0, 0, 0.04); }
            .fetch-btn { border-color: rgba(0, 0, 0, 0.2); }
        }
        @media (prefers-color-scheme: dark) {
            .game-card { background: rgba(255, 255, 255, 0.03); }
            .game-card .game-tag { background: rgba(255, 255, 255, 0.04); }
            .fetch-btn { border-color: rgba(255, 255, 255, 0.15); }
        }
    </style>
</head>
<body>
    <div class="card card-narrow">
        <h1 class="typing-title">🎮 游戏发布页</h1>
        <div class="sub fade-in-up delay-2">— 来自小站的游戏 —</div>
        <div class="divider fade-in-up delay-3"></div>

        <div class="nav-menu fade-in-up delay-4">
            <a href="index.html" class="nav-link">🏠 首页</a>
            <a href="#" class="nav-link active">🎮 游戏</a>
            <a href="RP.html" class="nav-link">📦 看点资源？</a>
        </div>

        <div class="game-stats fade-in-up delay-5" id="stats"></div>

        <div class="game-grid fade-in-up delay-6" id="gameGrid">
            <!-- 拉取区域 -->
            <div class="fetch-area" id="fetchArea">
                <button class="fetch-btn" id="fetchBtn">
                    📂 加载游戏
                </button>
                <div class="fetch-hint">读取 Gamecurrently/Hexenzirkel.txt</div>
            </div>
        </div>

        <div class="footer fade-in-up delay-7">
            🎮 游戏列表持续更新 · 欢迎推荐
        </div>
    </div>

    <!-- ===== 不蒜子统计（仅采集） ===== -->
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
    <script src="script.js"></script>

    <!-- ===== 游戏页核心逻辑 ===== -->
    <script src="GG-magic.js"></script>
</body>
</html>
