<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肉鸽！贪吃！蛇！ · Kukuz</title>
    <link rel="preload" as="image" href="../background.webp">
    <link rel="stylesheet" href="../style.css">
    <style>
        /* ===== 游戏页专用样式 ===== */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            max-width: 820px;
            width: 100%;
            padding: 2rem 2rem 2rem;
            border-radius: 2rem;
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }
        @media (prefers-color-scheme: light) {
            .game-container {
                background: rgba(255, 255, 255, 0.68);
                color: #1a3b1a;
                border-color: rgba(80, 160, 80, 0.25);
            }
        }
        @media (prefers-color-scheme: dark) {
            .game-container {
                background: rgba(10, 20, 10, 0.72);
                color: #c8e6c9;
                border-color: rgba(60, 140, 60, 0.3);
            }
        }

        /* ----- 顶部导航栏 ----- */
        .game-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.8rem;
            border-bottom: 2px solid rgba(128, 128, 128, 0.08);
            margin-bottom: 1.2rem;
        }
        .game-nav .nav-btn {
            padding: 0.3rem 1.2rem;
            border-radius: 2rem;
            border: 1px solid currentColor;
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            opacity: 0.6;
            text-decoration: none;
            display: inline-block;
        }
        .game-nav .nav-btn:hover {
            opacity: 1;
            background: currentColor;
            color: #fff;
            transform: translateY(-2px);
        }
        @media (prefers-color-scheme: dark) {
            .game-nav .nav-btn:hover { color: #1a2e1a; }
        }
        .game-nav .game-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: center;
            flex: 1;
            margin: 0 1rem;
            white-space: nowrap;
        }

        /* ----- 游戏画面框 ----- */
        .game-screen {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 1.2rem;
            border: 2px solid rgba(128, 128, 128, 0.15);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.15);
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            user-select: none;
            transition: border-color 0.3s;
            position: relative;
            overflow: hidden;
        }
        .game-screen .placeholder-text {
            opacity: 0.3;
            font-size: 1.4rem;
        }
        /* 未来游戏画布会放在这里 */

        /* ----- 游戏操作框（手柄布局） ----- */
        .game-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0.5rem 0.2rem;
            border-top: 1px solid rgba(128, 128, 128, 0.08);
            flex-wrap: wrap;
            gap: 1rem;
        }

        /* 左侧十字键 */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 3rem);
            grid-template-rows: repeat(3, 3rem);
            gap: 0.2rem;
            flex-shrink: 0;
        }
        .dpad-btn {
            background: rgba(128, 128, 128, 0.08);
            border: 1px solid rgba(128, 128, 128, 0.12);
            border-radius: 0.6rem;
            color: inherit;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            font-family: inherit;
        }
        .dpad-btn:hover {
            background: rgba(128, 128, 128, 0.18);
            transform: scale(0.96);
        }
        .dpad-btn:active {
            transform: scale(0.88);
            background: rgba(128, 128, 128, 0.25);
        }
        .dpad-center {
            background: transparent !important;
            border: none !important;
            cursor: default;
            pointer-events: none;
        }

        /* 右侧按钮组 */
        .action-buttons {
            display: flex;
            gap: 0.8rem;
            flex-shrink: 0;
        }
        .action-btn {
            width: 3.8rem;
            height: 3.8rem;
            border-radius: 50%;
            border: 2px solid currentColor;
            background: transparent;
            color: inherit;
            font-size: 1.2rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.5;
        }
        .action-btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }
        .action-btn:active {
            transform: scale(0.9);
            background: currentColor;
            color: #fff;
        }
        .action-btn.a {
            border-color: #f5a623;
            color: #f5a623;
        }
        .action-btn.b {
            border-color: #e74c3c;
            color: #e74c3c;
        }
        .action-btn.start {
            width: 3rem;
            height: 2rem;
            border-radius: 1rem;
            font-size: 0.8rem;
            border-color: rgba(128, 128, 128, 0.3);
            color: inherit;
            opacity: 0.4;
        }
        .action-btn.start:hover {
            opacity: 0.7;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .game-container { padding: 1.2rem 1rem; }
            .game-nav .game-title { font-size: 1.2rem; margin: 0 0.5rem; }
            .game-nav .nav-btn { font-size: 0.8rem; padding: 0.2rem 0.8rem; }
            .dpad { grid-template-columns: repeat(3, 2.4rem); grid-template-rows: repeat(3, 2.4rem); gap: 0.15rem; }
            .dpad-btn { font-size: 0.9rem; }
            .action-btn { width: 3rem; height: 3rem; font-size: 1rem; }
            .action-btn.start { width: 2.4rem; height: 1.6rem; font-size: 0.6rem; }
            .game-controls { justify-content: center; gap: 1.2rem; }
        }
        @media (max-width: 400px) {
            .game-nav { flex-wrap: wrap; justify-content: center; gap: 0.3rem; }
            .game-nav .game-title { order: 3; flex-basis: 100%; margin: 0.2rem 0; font-size: 1.1rem; }
            .dpad { grid-template-columns: repeat(3, 2rem); grid-template-rows: repeat(3, 2rem); }
            .action-btn { width: 2.6rem; height: 2.6rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- 导航栏 -->
        <div class="game-nav">
            <a href="../GG.html" class="nav-btn">← 返回</a>
            <span class="game-title">🐍 肉鸽！贪吃！蛇！</span>
            <button class="nav-btn" id="refreshBtn">⟳ 刷新</button>
        </div>

        <!-- 游戏画面框 -->
        <div class="game-screen" id="gameScreen">
            <span class="placeholder-text">🎮 游戏画面</span>
        </div>

        <!-- 游戏操作框 -->
        <div class="game-controls">
            <!-- 十字键 -->
            <div class="dpad">
                <div class="dpad-btn"></div>
                <div class="dpad-btn">↑</div>
                <div class="dpad-btn"></div>
                <div class="dpad-btn">←</div>
                <div class="dpad-btn dpad-center">•</div>
                <div class="dpad-btn">→</div>
                <div class="dpad-btn"></div>
                <div class="dpad-btn">↓</div>
                <div class="dpad-btn"></div>
            </div>

            <!-- 右侧按钮 -->
            <div class="action-buttons">
                <button class="action-btn a">A</button>
                <button class="action-btn b">B</button>
                <button class="action-btn start">START</button>
            </div>
        </div>
    </div>

    <!-- ===== 全局打字机特效（本页无打字机，但保留引用以防后续） ===== -->
    <script src="../script.js"></script>

    <script>
        // 刷新按钮：重新加载页面
        document.getElementById('refreshBtn').addEventListener('click', function() {
            location.reload();
        });

        // 控制按钮占位反馈（无实际功能）
        document.querySelectorAll('.dpad-btn, .action-btn').forEach(function(btn) {
            btn.addEventListener('click', function(e) {
                // 阻止点击十字键空白区域触发
                if (this.classList.contains('dpad-center')) return;
                if (this.textContent.trim() === '' || this.textContent.trim() === '•') return;
                // 简单震动反馈
                this.style.transform = 'scale(0.85)';
                setTimeout(function() {
                    this.style.transform = '';
                }.bind(this), 150);
            });
        });
    </script>

</body>
</html>
