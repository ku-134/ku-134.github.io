<!DOCTYPE html>
<html lang="zh-CN" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏发布页 · Kukuz</title>
    <link rel="preload" as="image" href="background.webp">
    <link rel="preload" as="image" href="background1.webp">
    <link rel="preload" as="image" href="background2.webp">
    <link rel="preload" as="image" href="background3.webp">
    <link rel="preload" as="image" href="background4.webp">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== 游戏页专属样式 ===== */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem 1.8rem;
            margin: 1.5rem 0 1.2rem;
            min-height: 200px;
        }

        .game-card {
            background: rgba(128, 128, 128, 0.04);
            border: 1px solid rgba(128, 128, 128, 0.08);
            border-radius: 1.4rem;
            padding: 1.6rem 1.4rem 1.2rem;
            transition: transform 0.3s ease, border-color 0.3s, box-shadow 0.3s;
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
        }
        .game-card:hover {
            transform: translateY(-6px);
            border-color: rgba(128, 128, 128, 0.25);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.1);
        }

        .game-card .game-name {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
            color: inherit;
            line-height: 1.2;
        }

        .game-card .game-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 0.6rem;
            margin-bottom: 0.6rem;
        }
        .game-card .game-tag {
            font-size: 0.75rem;
            padding: 0.15rem 0.9rem;
            border-radius: 2rem;
            background: rgba(128, 128, 128, 0.08);
            border: 1px solid rgba(128, 128, 128, 0.08);
            opacity: 0.75;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .game-card .game-desc {
            font-size: 0.95rem;
            opacity: 0.6;
            line-height: 1.7;
            margin-bottom: 1rem;
            flex: 1;
        }

        .game-card .game-images {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
            min-height: 0;
        }
        .game-card .game-images:not(.has-images) {
            min-height: 0;
        }
        .game-card .game-screenshot {
            width: calc(50% - 0.25rem);
            max-width: 100%;
            border-radius: 0.7rem;
            border: 1px solid rgba(128, 128, 128, 0.06);
            object-fit: cover;
            aspect-ratio: 16 / 9;
            background: rgba(128, 128, 128, 0.03);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
        }
        .game-card .game-screenshot:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        }
        .game-card .game-images.has-images .game-screenshot:only-child {
            width: 100%;
        }
        .game-card .game-images.has-images .game-screenshot:first-child:nth-last-child(3) {
            width: 100%;
        }
        .game-card .game-images.has-images .game-screenshot:first-child:nth-last-child(3) ~ .game-screenshot {
            width: calc(50% - 0.25rem);
        }

        .game-card .game-play-btn {
            display: inline-block;
            padding: 0.5rem 2rem;
            border-radius: 2.4rem;
            border: 2px solid currentColor;
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            opacity: 0.5;
            align-self: flex-start;
            margin-top: 0.2rem;
        }
        .game-card .game-play-btn:hover {
            opacity: 1;
            background: currentColor;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }
        @media (prefers-color-scheme: dark) {
            .game-card .game-play-btn:hover { color: #1a2e1a; }
        }

        .game-empty {
            text-align: center;
            padding: 3rem 1rem;
            opacity: 0.5;
            font-size: 1.1rem;
            grid-column: 1 / -1;
        }

        .fetch-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 240px;
            text-align: center;
            grid-column: 1 / -1;
        }
        .fetch-btn {
            font-size: 1.6rem;
            padding: 1.2rem 3.5rem;
            border-radius: 3rem;
            border: 3px dashed currentColor;
            background: transparent;
            color: inherit;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.6;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .fetch-btn:hover {
            opacity: 1;
            transform: scale(1.03);
            border-style: solid;
        }
        .fetch-btn:active {
            transform: scale(0.96);
        }
        .fetch-btn.loading {
            opacity: 0.8;
            cursor: wait;
            border-style: solid;
            animation: pulse 1.2s ease-in-out infinite;
        }
        .fetch-btn .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
            font-size: 1.4rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .fetch-hint {
            margin-top: 0.8rem;
            font-size: 0.85rem;
            opacity: 0.3;
        }

        .game-stats {
            text-align: center;
            font-size: 0.95rem;
            opacity: 0.5;
            margin-bottom: 0.2rem;
        }
        .game-search-bar {
            display: flex;
            gap: 0.6rem;
            margin: 0.8rem 0 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .game-search-bar input {
            flex: 1;
            min-width: 160px;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            border: 1px solid rgba(128, 128, 128, 0.2);
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .game-search-bar input:focus {
            border-color: currentColor;
        }
        .game-search-bar input::placeholder {
            opacity: 0.4;
        }
        .game-search-bar .clear-btn {
            cursor: pointer;
            opacity: 0.4;
            font-size: 1.2rem;
            padding: 0 0.3rem;
            transition: opacity 0.2s;
        }
        .game-search-bar .clear-btn:hover {
            opacity: 0.8;
        }

        /* ===== 图片浏览弹窗 ===== */
        .image-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            animation: overlayFade 0.25s ease-out;
        }
        .image-overlay.active {
            display: flex;
        }
        @keyframes overlayFade {
            0% { opacity: 0; backdrop-filter: blur(0px); }
            100% { opacity: 1; backdrop-filter: blur(8px); }
        }

        .image-modal {
            display: flex;
            gap: 1.2rem;
            max-width: 92vw;
            max-height: 92vh;
            width: auto;
            height: auto;
            background: rgba(10, 20, 10, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.8rem;
            padding: 1.2rem 1.4rem 1.2rem 1.2rem;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }
        @keyframes modalPop {
            0% { transform: scale(0.92) translateY(16px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        @media (prefers-color-scheme: light) {
            .image-modal {
                background: rgba(245, 250, 245, 0.7);
                border-color: rgba(0, 0, 0, 0.06);
            }
        }

        .image-modal-close {
            position: absolute;
            top: -0.8rem;
            left: -0.8rem;
            z-index: 10;
            width: 2.6rem;
            height: 2.6rem;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(10, 20, 10, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: inherit;
            font-size: 1.3rem;
            font-weight: 300;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            opacity: 0.6;
            font-family: 'Georgia', serif;
            line-height: 1;
            padding: 0;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        .image-modal-close:hover {
            opacity: 1;
            transform: scale(1.08);
            background: rgba(200, 60, 60, 0.7);
            border-color: rgba(255, 255, 255, 0.2);
        }
        @media (prefers-color-scheme: light) {
            .image-modal-close {
                background: rgba(245, 250, 245, 0.8);
                border-color: rgba(0, 0, 0, 0.08);
            }
            .image-modal-close:hover {
                background: rgba(200, 60, 60, 0.8);
            }
        }

        .image-thumbnails {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            justify-content: center;
            flex-shrink: 0;
            padding-right: 0.4rem;
            border-right: 1px solid rgba(128, 128, 128, 0.1);
        }
        .image-thumb {
            width: 3.6rem;
            height: 3.6rem;
            border-radius: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'Georgia', serif;
            background: rgba(128, 128, 128, 0.06);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(128, 128, 128, 0.08);
            cursor: pointer;
            transition: all 0.2s;
            color: inherit;
            opacity: 0.4;
            user-select: none;
        }
        .image-thumb:hover {
            opacity: 0.7;
            transform: scale(1.05);
        }
        .image-thumb.active {
            opacity: 1;
            border-color: currentColor;
            background: rgba(128, 128, 128, 0.12);
            box-shadow: 0 0 20px rgba(128, 128, 128, 0.08);
        }

        .image-display {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            min-height: 0;
            max-width: calc(90vw - 8rem);
            max-height: calc(90vh - 3rem);
        }
        .image-display img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 0.8rem;
            object-fit: contain;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            background: rgba(0, 0, 0, 0.1);
        }

        /* ===== 底部控制栏 ===== */
        .bottom-controls {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1500;
            display: flex;
            gap: 0.6rem;
            align-items: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        .bottom-controls.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .ctrl-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            opacity: 0.6;
            font-family: inherit;
            line-height: 1;
            padding: 0;
            background: var(--settings-bg, rgba(10,20,10,0.6));
            color: var(--text-color, #c8e6c9);
            border-color: var(--border-color, rgba(255,255,255,0.15));
        }
        .ctrl-btn:hover {
            opacity: 1;
            transform: scale(1.08);
        }
        .ctrl-btn.hide-btn:hover {
            transform: scale(1.08) rotate(0deg);
        }
        .ctrl-btn.settings-btn:hover {
            transform: scale(1.08) rotate(60deg);
        }
        .ctrl-btn.hide-btn.active {
            background: rgba(231, 76, 60, 0.3);
            border-color: #e74c3c;
            opacity: 0.8;
        }

        body.ui-hidden .game-grid,
        body.ui-hidden .card,
        body.ui-hidden .game-stats,
        body.ui-hidden .game-search-bar,
        body.ui-hidden .footer,
        body.ui-hidden #toast,
        body.ui-hidden #visitToast {
            opacity: 0 !important;
            pointer-events: none !important;
        }
        body.ui-hidden .settings-overlay:not(.active) {
            opacity: 0 !important;
            pointer-events: none !important;
        }
        body.ui-hidden .settings-overlay.active {
            opacity: 1 !important;
            pointer-events: auto !important;
        }
        body.ui-hidden .bottom-controls {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        .settings-overlay {
            position: fixed;
            inset: 0;
            z-index: 1600;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            animation: overlayIn 0.25s ease-out;
        }
        .settings-overlay.active {
            display: flex;
        }
        @keyframes overlayIn {
            0% { opacity: 0; backdrop-filter: blur(0px); }
            100% { opacity: 1; backdrop-filter: blur(6px); }
        }

        .settings-panel {
            max-width: 420px;
            width: 90%;
            padding: 2rem 2rem 1.8rem;
            border-radius: 1.8rem;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 90vh;
            overflow-y: auto;
            text-align: center;
            background: var(--settings-panel-bg, rgba(12,22,12,0.92));
            border-color: var(--settings-panel-border, rgba(255,255,255,0.06));
        }
        @keyframes modalPop {
            0% { transform: scale(0.92) translateY(16px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .settings-panel .panel-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
            color: var(--text-color, #c8e6c9);
        }
        .settings-panel .panel-sub {
            font-size: 0.85rem;
            opacity: 0.4;
            margin-bottom: 1.2rem;
            color: var(--text-color, #c8e6c9);
        }

        .settings-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }
        .settings-group label {
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0.6;
            display: block;
            margin-bottom: 0.4rem;
            color: var(--text-color, #c8e6c9);
        }
        .settings-group .options {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .settings-group .options .opt-btn {
            padding: 0.3rem 1.2rem;
            border-radius: 2rem;
            border: 1px solid rgba(128,128,128,0.15);
            background: transparent;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0.5;
            color: var(--text-color, #c8e6c9);
        }
        .settings-group .options .opt-btn:hover {
            opacity: 0.8;
            background: rgba(128,128,128,0.05);
        }
        .settings-group .options .opt-btn.active {
            opacity: 1;
            border-color: currentColor;
            background: rgba(128,128,128,0.08);
        }
        .settings-panel .panel-actions {
            display: flex;
            gap: 0.6rem;
            justify-content: flex-end;
            margin-top: 0.8rem;
        }
        .settings-panel .panel-actions .btn {
            padding: 0.4rem 1.4rem;
            border-radius: 2rem;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .settings-panel .panel-actions .btn-secondary {
            background: transparent;
            border: 1px solid rgba(128,128,128,0.15);
            color: var(--text-color, #c8e6c9);
        }
        .settings-panel .panel-actions .btn-secondary:hover {
            background: rgba(128,128,128,0.06);
        }

        html[data-bg="food"] { --bg-image: url('background1.webp'); }
        html[data-bg="trip"] { --bg-image: url('background2.webp'); }
        html[data-bg="electric1"] { --bg-image: url('background3.webp'); }
        html[data-bg="electric2"] { --bg-image: url('background4.webp'); }

        /* 响应式 */
        @media (max-width: 700px) {
            .game-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 1.2rem;
            }
            .game-card .game-name { font-size: 1.4rem; }
            .game-card .game-desc { font-size: 0.85rem; }
            .game-card { padding: 1.2rem 1rem 1rem; }

            .image-modal {
                flex-direction: column-reverse;
                padding: 0.8rem 0.8rem 0.6rem;
                max-width: 96vw;
                max-height: 96vh;
                border-radius: 1.2rem;
            }
            .image-modal-close {
                top: -0.6rem;
                left: -0.6rem;
                width: 2.2rem;
                height: 2.2rem;
                font-size: 1.1rem;
            }
            .image-thumbnails {
                flex-direction: row;
                justify-content: center;
                padding-right: 0;
                border-right: none;
                border-top: 1px solid rgba(128, 128, 128, 0.1);
                padding-top: 0.6rem;
                gap: 0.4rem;
                flex-wrap: wrap;
            }
            .image-thumb {
                width: 2.6rem;
                height: 2.6rem;
                font-size: 0.85rem;
            }
            .image-display {
                max-width: calc(96vw - 1.2rem);
                max-height: calc(96vh - 6rem);
            }
            .game-card .game-screenshot { aspect-ratio: 16 / 10; }
            .fetch-btn { font-size: 1.2rem; padding: 0.9rem 2rem; flex-direction: column; gap: 0.4rem; }
        }
        @media (max-width: 600px) {
            .game-grid { grid-template-columns: 1fr 1fr; gap: 0.8rem; }
            .game-card .game-name { font-size: 1.2rem; }
            .game-card .game-desc { font-size: 0.8rem; }
            .game-card .game-tag { font-size: 0.6rem; padding: 0 0.5rem; }
            .game-card .game-screenshot { aspect-ratio: 16 / 10; }
            .fetch-btn { font-size: 1.2rem; padding: 0.9rem 2rem; flex-direction: column; gap: 0.4rem; }
        }
        @media (max-width: 400px) {
            .game-grid { grid-template-columns: 1fr; gap: 1rem; }
            .image-thumb { width: 2.2rem; height: 2.2rem; font-size: 0.75rem; }
            .game-card .game-name { font-size: 1.3rem; }
        }
        @media (max-width: 480px) {
            .bottom-controls { bottom: 15px; right: 15px; gap: 0.4rem; }
            .ctrl-btn { width: 38px; height: 38px; font-size: 0.9rem; }
            .settings-panel { padding: 1.5rem; }
        }

        @media (prefers-color-scheme: light) {
            .game-card { background: rgba(255, 255, 255, 0.4); }
            .game-card .game-tag { background: rgba(0, 0, 0, 0.04); }
            .fetch-btn { border-color: rgba(0, 0, 0, 0.2); }
            .image-thumb { background: rgba(0, 0, 0, 0.04); }
        }
        @media (prefers-color-scheme: dark) {
            .game-card { background: rgba(255, 255, 255, 0.03); }
            .game-card .game-tag { background: rgba(255, 255, 255, 0.04); }
            .fetch-btn { border-color: rgba(255, 255, 255, 0.15); }
            .image-thumb { background: rgba(255, 255, 255, 0.04); }
        }
    </style>
</head>
<body>
    <div class="card card-narrow" style="max-width: 820px; margin: 0 auto; padding: 2rem 2rem 1.8rem;">
        <h1 class="typing-title">🎮 游戏发布页</h1>
        <div class="sub fade-in-up delay-2">— 来自小站的游戏 —</div>
        <div class="divider fade-in-up delay-3"></div>

        <div class="nav-menu fade-in-up delay-4">
            <a href="index.html" class="nav-link">🏠 首页</a>
            <a href="#" class="nav-link active">🎮 游戏</a>
            <a href="RP.html" class="nav-link">📦 看点资源？</a>
        </div>

        <div class="game-stats fade-in-up delay-5" id="stats"></div>

        <div class="game-search-bar fade-in-up delay-5">
            <input type="text" id="gameSearchInput" placeholder="🔍 搜索游戏..." autocomplete="off">
            <span class="clear-btn" id="gameClearSearch" style="display:none;">✕</span>
        </div>

        <div class="game-grid fade-in-up delay-6" id="gameGrid">
            <div class="fetch-area" id="fetchArea">
                <button class="fetch-btn" id="fetchBtn">
                    📂 加载游戏
                </button>
                <div class="fetch-hint">读取 Gamecurrently/Hexenzirkel.txt</div>
            </div>
        </div>

        <div class="footer fade-in-up delay-7">
            🎮 游戏列表持续更新 · 欢迎推荐
        </div>
    </div>

    <!-- ===== 图片浏览弹窗 ===== -->
    <div class="image-overlay" id="imageOverlay">
        <div class="image-modal" id="imageModal">
            <button class="image-modal-close" id="imageModalClose" title="关闭">✕</button>
            <div class="image-thumbnails" id="imageThumbnails"></div>
            <div class="image-display" id="imageDisplay">
                <img id="imageViewer" src="" alt="游戏截图">
            </div>
        </div>
    </div>

    <!-- ===== 底部控制栏 ===== -->
    <div class="bottom-controls" id="bottomControls">
        <button class="ctrl-btn hide-btn" id="hideToggle" title="隐藏所有UI，只看背景">👁️</button>
        <button class="ctrl-btn settings-btn" id="settingsToggle" title="全局样式设置">⚙️</button>
    </div>

    <!-- ===== 设置面板 ===== -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-panel">
            <div class="panel-title">⚙️ 样式设置</div>
            <div class="panel-sub">自定义你的浏览体验</div>

            <div class="settings-group">
                <label>🎨 主题模式</label>
                <div class="options" id="themeOptions">
                    <button class="opt-btn" data-theme="default">默认</button>
                    <button class="opt-btn" data-theme="light">亮色</button>
                    <button class="opt-btn" data-theme="dark">暗色</button>
                </div>
            </div>

            <div class="settings-group">
                <label>🖼️ 背景图片</label>
                <div class="options" id="bgOptions">
                    <button class="opt-btn" data-bg="default">默认</button>
                    <button class="opt-btn" data-bg="food">海边</button>
                    <button class="opt-btn" data-bg="trip">旅途</button>
                    <button class="opt-btn" data-bg="electric1">！？电电？！（1）</button>
                    <button class="opt-btn" data-bg="electric2">！？电电？！（2）</button>
                </div>
            </div>

            <div class="panel-actions">
                <button class="btn btn-secondary" id="settingsClose">关闭</button>
            </div>
        </div>
    </div>

    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
    <script src="script.js"></script>
    <script src="GG-magic.js"></script>
    <script>
        (function() {
            // 入场动画：控制栏与卡片同步
            const bottomControls = document.getElementById('bottomControls');
            setTimeout(function() {
                bottomControls.classList.add('show');
            }, 800);

            // 全局样式设置
            const htmlRoot = document.getElementById('htmlRoot') || document.documentElement;
            const settingsToggle = document.getElementById('settingsToggle');
            const settingsOverlay = document.getElementById('settingsOverlay');
            const settingsClose = document.getElementById('settingsClose');
            const themeOptions = document.getElementById('themeOptions');
            const bgOptions = document.getElementById('bgOptions');

            function loadSettings() {
                try {
                    const saved = localStorage.getItem('siteSettings');
                    if (saved) return JSON.parse(saved);
                } catch (e) {}
                return { theme: 'default', bg: 'default' };
            }

            function saveSettings(settings) {
                try { localStorage.setItem('siteSettings', JSON.stringify(settings)); } catch (e) {}
            }

            function applySettings(settings) {
                const theme = settings.theme || 'default';
                htmlRoot.removeAttribute('data-theme');
                if (theme !== 'default') {
                    htmlRoot.setAttribute('data-theme', theme);
                }
                document.querySelectorAll('#themeOptions .opt-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.theme === theme);
                });

                const bg = settings.bg || 'default';
                htmlRoot.removeAttribute('data-bg');
                if (bg !== 'default') {
                    htmlRoot.setAttribute('data-bg', bg);
                }
                document.querySelectorAll('#bgOptions .opt-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.bg === bg);
                });
            }

            function openSettings() {
                applySettings(loadSettings());
                settingsOverlay.classList.add('active');
                document.body.classList.add('modal-open');
            }

            function closeSettings() {
                settingsOverlay.classList.remove('active');
                document.body.classList.remove('modal-open');
            }

            settingsToggle.addEventListener('click', openSettings);
            settingsClose.addEventListener('click', closeSettings);
            settingsOverlay.addEventListener('click', function(e) {
                if (e.target === settingsOverlay) closeSettings();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && settingsOverlay.classList.contains('active')) {
                    closeSettings();
                }
            });

            themeOptions.addEventListener('click', function(e) {
                const btn = e.target.closest('.opt-btn');
                if (!btn) return;
                const settings = loadSettings();
                settings.theme = btn.dataset.theme;
                saveSettings(settings);
                applySettings(settings);
            });

            bgOptions.addEventListener('click', function(e) {
                const btn = e.target.closest('.opt-btn');
                if (!btn) return;
                const settings = loadSettings();
                settings.bg = btn.dataset.bg;
                saveSettings(settings);
                applySettings(settings);
            });

            applySettings(loadSettings());

            // 隐藏/显示 UI
            const hideToggle = document.getElementById('hideToggle');
            let isHidden = false;
            hideToggle.addEventListener('click', function() {
                isHidden = !isHidden;
                document.body.classList.toggle('ui-hidden', isHidden);
                if (isHidden) {
                    this.textContent = '👁️‍🗨️';
                    this.classList.add('active');
                    this.title = '显示所有UI';
                } else {
                    this.textContent = '👁️';
                    this.classList.remove('active');
                    this.title = '隐藏所有UI，只看背景';
                }
            });
        })();
    </script>
</body>
</html>
