<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VoidOS · 虚空终端</title>

    <!-- 预加载占位（项目资源留空） -->
    <!-- <link rel="stylesheet" href="assets/css/main.css" /> -->
    <!-- <script src="assets/js/core.js" defer></script> -->

    <style>
        /* ============================================================
               0. 全局重置 & 绿色主题变量
               ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 绿色系主色 */
            --void-primary: #8FB991;
            --void-dark: #314015;
            --void-accent: #58A25C;
            --void-light: #A7C0A6;

            /* 半透明衍生 */
            --void-primary-dim: rgba(143, 185, 145, 0.15);
            --void-primary-glow: rgba(143, 185, 145, 0.45);
            --void-accent-dim: rgba(88, 162, 92, 0.25);

            /* 背景深绿黑 */
            --void-bg: #0f160f;
            --void-bg-green: #1a2a1a;

            /* 字体 */
            --font-display: 'Segoe UI', system-ui, -apple-system, sans-serif;

            /* 过渡 */
            --t-micro: 0.15s;
            --t-fast: 0.25s;
            --t-smooth: 0.4s;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--void-bg);
            font-family: var(--font-display);
            color: var(--void-primary);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ============================================================
               1. 背景层 — 黑绿渐变 · 时隐时现
               ============================================================ */
        #bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 120% 80% at 20% 30%, rgba(49, 64, 21, 0.6) 0%, transparent 70%),
                radial-gradient(ellipse 100% 100% at 80% 70%, rgba(88, 162, 92, 0.25) 0%, transparent 60%),
                radial-gradient(ellipse 60% 60% at 50% 50%, rgba(15, 22, 15, 0.9) 0%, transparent 80%),
                var(--void-bg);
            animation: breatheGradient 8s ease-in-out infinite alternate;
            will-change: transform, opacity;
        }

        #bg-layer::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 40% 60%, var(--void-primary-dim) 0%, transparent 70%);
            animation: glowPulse 6s ease-in-out infinite alternate;
            will-change: opacity;
            mix-blend-mode: screen;
            pointer-events: none;
        }

        @keyframes breatheGradient {
            0% {
                opacity: 0.7;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.03);
            }
            100% {
                opacity: 0.75;
                transform: scale(0.98);
            }
        }

        @keyframes glowPulse {
            0% {
                opacity: 0.2;
                transform: translate(0, 0) scale(1);
            }
            40% {
                opacity: 0.6;
                transform: translate(3%, -2%) scale(1.1);
            }
            80% {
                opacity: 0.3;
                transform: translate(-2%, 4%) scale(0.95);
            }
            100% {
                opacity: 0.5;
                transform: translate(1%, -1%) scale(1.05);
            }
        }

        /* ============================================================
               2. Canvas 粒子层 (绿色调)
               ============================================================ */
        #particle-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        /* ============================================================
               3. 内容层
               ============================================================ */
        #container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        /* ---- 3-a. 虚空之眼 (SVG) 绿色版 ---- */
        #eye-wrapper {
            flex-shrink: 0;
            width: 80px;
            height: 80px;
            margin-bottom: 2.2rem;
            animation: eyeFloat 4s ease-in-out infinite alternate;
            will-change: transform;
        }

        #eye-wrapper svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 0 18px var(--void-primary-glow));
        }

        .eye-ring {
            animation: ringSpin 20s linear infinite;
            transform-origin: center;
            will-change: transform;
        }

        @keyframes ringSpin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .eye-diamond {
            animation: diamondPulse 3s ease-in-out infinite alternate;
            transform-origin: center;
            will-change: transform, opacity;
        }

        @keyframes diamondPulse {
            0% {
                transform: scale(0.85) rotate(0deg);
                opacity: 0.6;
            }
            100% {
                transform: scale(1.05) rotate(12deg);
                opacity: 1;
            }
        }

        .eye-dot {
            animation: dotBreathe 2.4s ease-in-out infinite alternate;
            transform-origin: center;
            will-change: opacity, r;
        }

        @keyframes dotBreathe {
            0% {
                opacity: 0.4;
                r: 2.5;
            }
            100% {
                opacity: 1;
                r: 4.5;
            }
        }

        @keyframes eyeFloat {
            0% {
                transform: translateY(-4px) scale(1);
            }
            100% {
                transform: translateY(8px) scale(1.02);
            }
        }

        /* ---- 3-b. 标题容器 ---- */
        #title-container {
            position: relative;
            flex-shrink: 0;
            width: 100%;
            max-width: 600px;
            text-align: center;
            min-height: 6rem;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 800px;
        }

        /* 共用标题样式 */
        .title-main {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.04em;
            transition: opacity 0.7s ease;
            pointer-events: none;
            font-size: clamp(2.2rem, 10vw, 4.2rem);
            font-weight: 300;
            letter-spacing: 0.12em;
            text-shadow:
                0 0 20px var(--void-primary-glow),
                0 0 60px var(--void-primary-dim);
            line-height: 1.2;
        }

        #title-connecting {
            opacity: 1;
            pointer-events: none;
        }

        #title-login {
            opacity: 0;
            pointer-events: none;
            text-decoration: none;
            color: var(--void-primary);
            cursor: pointer;
        }
        #title-login.clickable {
            pointer-events: auto;
        }
        #title-login.clickable:hover {
            text-shadow:
                0 0 30px var(--void-primary-glow),
                0 0 80px var(--void-primary-dim);
        }

        /* 每个字符的推出动画（默认暂停，由父级 .animate-char 触发） */
        .char {
            display: inline-block;
            opacity: 0;
            transform: translateZ(-280px) scale(0.4) rotateX(12deg);
            filter: blur(8px);
            transition: none;
            /* 动画由父级控制 */
        }

        .animate-char .char {
            animation: charReveal 0.9s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        /* 每个字不同的延迟 (间隔不一) */
        #title-connecting .char:nth-child(1) { animation-delay: 0.00s; }
        #title-connecting .char:nth-child(2) { animation-delay: 0.22s; }
        #title-connecting .char:nth-child(3) { animation-delay: 0.48s; }
        #title-connecting .char:nth-child(4) { animation-delay: 0.65s; }
        #title-connecting .char:nth-child(5) { animation-delay: 0.88s; }

        #title-login .char:nth-child(1) { animation-delay: 0.00s; }
        #title-login .char:nth-child(2) { animation-delay: 0.20s; }
        #title-login .char:nth-child(3) { animation-delay: 0.45s; }
        #title-login .char:nth-child(4) { animation-delay: 0.60s; }
        #title-login .char:nth-child(5) { animation-delay: 0.80s; }
        #title-login .char:nth-child(6) { animation-delay: 1.00s; }
        #title-login .char:nth-child(7) { animation-delay: 1.15s; }

        @keyframes charReveal {
            0% {
                opacity: 0;
                transform: translateZ(-280px) scale(0.4) rotateX(12deg);
                filter: blur(8px);
            }
            60% {
                opacity: 0.9;
                filter: blur(0px);
            }
            100% {
                opacity: 1;
                transform: translateZ(0) scale(1) rotateX(0deg);
                filter: blur(0px);
            }
        }

        /* ---- 3-c. 下划线装饰 ---- */
        #title-underline {
            flex-shrink: 0;
            width: clamp(60px, 20vw, 160px);
            height: 1px;
            margin-top: 1.2rem;
            background: linear-gradient(90deg, transparent, var(--void-primary), transparent);
            opacity: 0;
            animation: lineFadeIn 1.2s ease-out 1.2s forwards;
            box-shadow: 0 0 12px var(--void-primary-glow);
        }

        @keyframes lineFadeIn {
            0% {
                opacity: 0;
                transform: scaleX(0.3);
            }
            100% {
                opacity: 0.6;
                transform: scaleX(1);
            }
        }

        /* ---- 3-d. 底部角落版本 ---- */
        #corner-deco {
            position: fixed;
            bottom: 1.2rem;
            right: 1.5rem;
            z-index: 3;
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            color: rgba(143, 185, 145, 0.15);
            font-weight: 300;
            pointer-events: none;
            animation: cornerFade 3s ease-out 2s forwards;
            opacity: 0;
        }

        @keyframes cornerFade {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        /* ============================================================
               4. 响应式兼容
               ============================================================ */
        @media (max-width: 480px) {
            #eye-wrapper {
                width: 60px;
                height: 60px;
                margin-bottom: 1.6rem;
            }
            .title-main {
                font-size: clamp(1.8rem, 12vw, 2.6rem);
                letter-spacing: 0.06em;
            }
            #title-container {
                min-height: 4.5rem;
            }
        }

        @media (min-width: 768px) {
            #eye-wrapper {
                width: 100px;
                height: 100px;
                margin-bottom: 2.8rem;
            }
            .title-main {
                font-size: clamp(3rem, 6vw, 5rem);
            }
            #title-container {
                min-height: 7rem;
            }
        }

        /* 安全区域适配 */
        @supports (padding: max(0px)) {
            #corner-deco {
                bottom: max(1.2rem, env(safe-area-inset-bottom, 0.5rem));
            }
        }

        /* 减少动画偏好 */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .char {
                opacity: 1 !important;
                transform: none !important;
                filter: none !important;
                animation: none !important;
            }
            #title-connecting,
            #title-login {
                opacity: 1 !important;
                pointer-events: auto !important;
            }
            #title-login {
                display: block !important;
                opacity: 1 !important;
            }
            #title-connecting {
                display: none !important;
            }
            #title-underline {
                opacity: 0.6;
                animation: none;
            }
            #corner-deco {
                opacity: 1;
                animation: none;
            }
        }
    </style>
</head>
<body>

    <!-- ====== 背景 ====== -->
    <div id="bg-layer" aria-hidden="true"></div>

    <!-- ====== Canvas 粒子 ====== -->
    <canvas id="particle-canvas" aria-hidden="true"></canvas>

    <!-- ====== 主内容 ====== -->
    <div id="container">

        <!-- 虚空之眼 (绿色) -->
        <div id="eye-wrapper" aria-hidden="true">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle class="eye-ring" cx="50" cy="50" r="42"
                stroke="var(--void-primary)" stroke-width="0.8"
                stroke-dasharray="4 8" opacity="0.5" />
                <circle class="eye-ring" cx="50" cy="50" r="36"
                stroke="var(--void-primary)" stroke-width="0.5"
                stroke-dasharray="2 12" opacity="0.3" />

                <polygon class="eye-diamond" points="50,18 74,50 50,82 26,50"
                stroke="var(--void-primary)" stroke-width="1.2"
                stroke-linejoin="round" opacity="0.7" />

                <polygon class="eye-diamond" points="50,26 66,50 50,74 34,50"
                stroke="var(--void-primary)" stroke-width="0.5"
                stroke-linejoin="round" opacity="0.3"
                style="animation-direction: reverse; animation-duration: 4s;" />

                <circle class="eye-dot" cx="50" cy="50" r="3.5"
                fill="var(--void-primary)" opacity="0.9" />

                <circle cx="50" cy="12" r="1.2" fill="var(--void-primary)" opacity="0.25" />
                <circle cx="88" cy="50" r="1.2" fill="var(--void-primary)" opacity="0.25" />
                <circle cx="50" cy="88" r="1.2" fill="var(--void-primary)" opacity="0.25" />
                <circle cx="12" cy="50" r="1.2" fill="var(--void-primary)" opacity="0.25" />
            </svg>
        </div>

        <!-- 标题容器 (两个标题叠加) -->
        <div id="title-container">
            <!-- “虚空连接中” -->
            <h1 id="title-connecting" class="title-main animate-char" aria-label="虚空连接中">
                <span class="char">虚</span>
                <span class="char">空</span>
                <span class="char">连</span>
                <span class="char">接</span>
                <span class="char">中</span>
            </h1>

            <!-- “强行登录虚空？”(可点击) -->
            <a id="title-login" class="title-main" href="TableTop.html" aria-label="点击强行登录">
                <span class="char">点</span>
                <span class="char">击</span>
                <span class="char">强</span>
                <span class="char">行</span>
                <span class="char">登</span>
                <span class="char">录</span>
                
            </a>
        </div>

        <!-- 下划线 -->
        <div id="title-underline" aria-hidden="true"></div>

        <!-- 版本号 -->
        <div id="corner-deco" aria-hidden="true">VOID · 0.1</div>
    </div>

    <!-- ============================================================
    JavaScript — 粒子系统 & 标题切换
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ---------- 粒子系统 (绿色调) ----------
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            const PARTICLE_COUNT = 48;
            const MAX_SPEED = 0.25;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }

            function createParticles() {
                particles = [];
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    particles.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: (Math.random() - 0.5) * MAX_SPEED * 2,
                        vy: (Math.random() - 0.5) * MAX_SPEED * 2,
                        radius: 0.8 + Math.random() * 1.6,
                        alpha: 0.08 + Math.random() * 0.25,
                        pulse: Math.random() * Math.PI * 2,
                        pulseSpeed: 0.008 + Math.random() * 0.015,
                    });
                }
            }

            function drawParticles() {
                ctx.clearRect(0, 0, width, height);
                const primary = getComputedStyle(document.documentElement).getPropertyValue('--void-primary').trim();
                // 转为RGB，因为我们是绿色，直接用 rgba(143,185,145,)
                for (const p of particles) {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.pulse += p.pulseSpeed;

                    if (p.x < 0) p.x = width;
                    if (p.x > width) p.x = 0;
                    if (p.y < 0) p.y = height;
                    if (p.y > height) p.y = 0;

                    const pulseAlpha = p.alpha * (0.6 + 0.4 * Math.sin(p.pulse));
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(143, 185, 145, ${pulseAlpha})`;
                    ctx.shadowColor = 'rgba(143, 185, 145, 0.15)';
                    ctx.shadowBlur = 12;
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    if (p.radius > 1.6) {
                        ctx.beginPath();
                        ctx.arc(p.x - p.vx * 3, p.y - p.vy * 3, p.radius * 0.4, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(143, 185, 145, ${pulseAlpha * 0.2})`;
                        ctx.fill();
                    }
                }
                requestAnimationFrame(drawParticles);
            }

            function initParticles() {
                resize();
                createParticles();
                drawParticles();
            }

            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function() {
                    resize();
                    createParticles();
                }, 200);
            });

            // ---------- 标题切换 (5秒后) ----------
            const connecting = document.getElementById('title-connecting');
            const login = document.getElementById('title-login');

            function switchTitle() {
                // 1. 旧标题渐隐
                connecting.style.opacity = '0';
                // 2. 新标题渐显并触发动画
                login.style.opacity = '1';
                login.classList.add('clickable');
                // 添加动画类触发字符推出
                login.classList.add('animate-char');
                // 移除旧标题的动画类（可选）
                connecting.classList.remove('animate-char');
            }

            // 页面加载后5秒执行切换
            setTimeout(switchTitle, 5000);

            // ---------- 启动粒子 ----------
            if (document.readyState === 'complete') {
                initParticles();
            } else {
                window.addEventListener('load', initParticles);
            }

            // 点击新标题时触感反馈
            login.addEventListener('click', function(e) {
                if (navigator.vibrate) navigator.vibrate(12);
                // 正常跳转
            });

            console.log('🟢 VoidOS · 虚空终端 (绿色版) 已启动');
        })();
    </script>

</body>
</html>
