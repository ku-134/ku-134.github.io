<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模板页 · Kukuz</title>
    <link rel="preload" as="image" href="background.webp">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== 模板页专属样式 ===== */
        .click-hint {
            font-size: 0.7rem;
            opacity: 0.15;
            text-align: center;
            margin-top: 1.5rem;
            user-select: none;
            transition: opacity 0.3s;
            cursor: default;
        }
        .click-hint:hover {
            opacity: 0.3;
        }

        /* ===== 编码工具弹窗 ===== */
        .tool-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            animation: overlayIn 0.3s ease-out;
        }
        .tool-overlay.active {
            display: flex;
        }
        @keyframes overlayIn {
            0% { opacity: 0; backdrop-filter: blur(0px); }
            100% { opacity: 1; backdrop-filter: blur(8px); }
        }

        .tool-modal {
            max-width: 560px;
            width: 92%;
            padding: 2rem 2rem 1.8rem;
            border-radius: 1.8rem;
            background: var(--modal-bg, rgba(12, 22, 12, 0.92));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes modalPop {
            0% { transform: scale(0.92) translateY(16px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        @media (prefers-color-scheme: light) {
            .tool-modal { --modal-bg: rgba(245, 250, 245, 0.94); border-color: rgba(0, 0, 0, 0.06); }
        }

        .tool-modal .modal-icon {
            font-size: 2.4rem;
            text-align: center;
            margin-bottom: 0.2rem;
        }
        .tool-modal .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.2rem;
        }
        .tool-modal .modal-sub {
            font-size: 0.85rem;
            opacity: 0.4;
            text-align: center;
            margin-bottom: 1.2rem;
        }

        .tool-modal .field {
            margin-bottom: 0.8rem;
        }
        .tool-modal .field label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0.5;
            margin-bottom: 0.2rem;
        }
        .tool-modal .field textarea {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border-radius: 0.8rem;
            border: 1px solid rgba(128, 128, 128, 0.12);
            background: rgba(128, 128, 128, 0.04);
            color: inherit;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            outline: none;
            resize: vertical;
            box-sizing: border-box;
            min-height: 100px;
            transition: border-color 0.3s;
        }
        .tool-modal .field textarea:focus {
            border-color: currentColor;
        }

        .tool-modal .result-box {
            padding: 0.6rem 0.8rem;
            border-radius: 0.8rem;
            background: rgba(128, 128, 128, 0.04);
            border: 1px solid rgba(128, 128, 128, 0.06);
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            word-break: break-all;
            max-height: 120px;
            overflow-y: auto;
            opacity: 0.8;
            margin-bottom: 0.8rem;
            min-height: 40px;
        }
        .tool-modal .result-box.empty {
            opacity: 0.2;
            font-style: italic;
        }

        .tool-modal .btn-row {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .tool-modal .btn-row .btn {
            flex: 1;
            min-width: 80px;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            text-align: center;
        }
        .tool-modal .btn-row .btn-primary {
            background: #66bb6a;
            color: #1a2e1a;
        }
        .tool-modal .btn-row .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 187, 106, 0.25);
        }
        .tool-modal .btn-row .btn-secondary {
            background: transparent;
            border: 1px solid rgba(128, 128, 128, 0.15);
            color: inherit;
        }
        .tool-modal .btn-row .btn-secondary:hover {
            background: rgba(128, 128, 128, 0.06);
        }
        .tool-modal .btn-row .btn-danger {
            background: #e74c3c;
            color: #fff;
        }
        .tool-modal .btn-row .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.25);
        }
        .tool-modal .btn-row .btn-close {
            background: transparent;
            border: none;
            color: inherit;
            opacity: 0.3;
            flex: 0 0 auto;
            padding: 0.5rem 1.2rem;
        }
        .tool-modal .btn-row .btn-close:hover {
            opacity: 0.8;
        }

        .tool-modal .status-msg {
            padding: 0.4rem 0.8rem;
            border-radius: 0.6rem;
            font-size: 0.8rem;
            margin-top: 0.6rem;
            text-align: center;
        }
        .tool-modal .status-msg.success {
            background: rgba(102, 187, 106, 0.08);
            color: #a5d6a7;
        }
        .tool-modal .status-msg.error {
            background: rgba(231, 76, 60, 0.08);
            color: #e74c3c;
        }
        @media (prefers-color-scheme: light) {
            .tool-modal .status-msg.success { color: #1b5e20; }
            .tool-modal .status-msg.error { color: #c0392b; }
        }

        .tool-modal .hint-text {
            font-size: 0.7rem;
            opacity: 0.25;
            text-align: center;
            margin-top: 0.6rem;
        }

        /* ===== 缓存查看/修改工具（展示所有 LS 数据） ===== */
        .cache-overlay {
            position: fixed;
            inset: 0;
            z-index: 1100;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            animation: overlayIn 0.3s ease-out;
        }
        .cache-overlay.active {
            display: flex;
        }
        .cache-modal {
            max-width: 580px;
            width: 94%;
            padding: 2rem 2rem 1.8rem;
            border-radius: 1.8rem;
            background: var(--modal-bg, rgba(12, 22, 12, 0.92));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 90vh;
            overflow-y: auto;
        }
        @media (prefers-color-scheme: light) {
            .cache-modal { --modal-bg: rgba(245, 250, 245, 0.94); border-color: rgba(0, 0, 0, 0.06); }
        }
        .cache-modal .modal-icon {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 0.2rem;
        }
        .cache-modal .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.2rem;
        }
        .cache-modal .modal-sub {
            font-size: 0.85rem;
            opacity: 0.4;
            text-align: center;
            margin-bottom: 1.2rem;
        }
        .cache-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.4rem 0;
            border-bottom: 1px solid rgba(128, 128, 128, 0.06);
            gap: 0.5rem;
        }
        .cache-item:last-child {
            border-bottom: none;
        }
        .cache-item .key {
            font-weight: 600;
            font-size: 0.85rem;
            opacity: 0.7;
            flex-shrink: 0;
            min-width: 120px;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .cache-item .value-wrap {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex: 1;
            min-width: 0;
        }
        .cache-item input {
            flex: 1;
            min-width: 60px;
            padding: 0.3rem 0.6rem;
            border-radius: 0.6rem;
            border: 1px solid rgba(128, 128, 128, 0.15);
            background: transparent;
            color: inherit;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            transition: border-color 0.2s;
        }
        .cache-item input:focus {
            border-color: currentColor;
            outline: none;
        }
        .cache-item .del-btn {
            background: transparent;
            border: 1px solid rgba(231, 76, 60, 0.2);
            border-radius: 0.4rem;
            padding: 0.1rem 0.5rem;
            font-size: 0.7rem;
            cursor: pointer;
            opacity: 0.2;
            transition: opacity 0.2s;
            color: #e74c3c;
            flex-shrink: 0;
        }
        .cache-item .del-btn:hover {
            opacity: 0.7;
        }
        .cache-modal .btn-row {
            display: flex;
            gap: 0.6rem;
            margin-top: 1rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .cache-modal .btn-row .btn {
            padding: 0.4rem 1.2rem;
            border-radius: 2rem;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .cache-modal .btn-row .btn-primary {
            background: #66bb6a;
            color: #1a2e1a;
        }
        .cache-modal .btn-row .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 187, 106, 0.25);
        }
        .cache-modal .btn-row .btn-secondary {
            background: transparent;
            border: 1px solid rgba(128, 128, 128, 0.15);
            color: inherit;
        }
        .cache-modal .btn-row .btn-secondary:hover {
            background: rgba(128, 128, 128, 0.06);
        }
        .cache-modal .btn-row .btn-danger {
            background: #e74c3c;
            color: #fff;
        }
        .cache-modal .btn-row .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.25);
        }
        .cache-modal .count-badge {
            font-size: 0.7rem;
            opacity: 0.3;
            margin-left: 0.3rem;
        }
        .cache-modal .empty-hint {
            text-align: center;
            opacity: 0.3;
            padding: 1rem 0;
            font-size: 0.9rem;
        }

        .cache-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 10px 24px;
            border-radius: 2rem;
            font-size: 0.95rem;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            z-index: 1200;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .cache-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        @media (prefers-color-scheme: light) {
            .cache-toast { background: rgba(255,255,255,0.9); color: #1a3b1a; }
        }

        /* 滚动条 */
        .cache-modal::-webkit-scrollbar,
        .tool-modal::-webkit-scrollbar {
            width: 4px;
        }
        .cache-modal::-webkit-scrollbar-track,
        .tool-modal::-webkit-scrollbar-track {
            background: transparent;
        }
        .cache-modal::-webkit-scrollbar-thumb,
        .tool-modal::-webkit-scrollbar-thumb {
            background: rgba(128, 128, 128, 0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- ===== 主卡片 ===== -->
    <div class="card card-narrow" style="opacity:1;transform:none;animation:none;">
        <h1 class="typing-title" id="clickableTitle">测试文本</h1>
        <div class="sub fade-in-up delay-2" style="animation-delay:0.3s;">— Template —</div>
        <div class="divider fade-in-up delay-3" style="animation-delay:0.5s;"></div>

        <div class="nav-menu fade-in-up delay-4" style="animation-delay:0.7s;">
            <a href="index.html" class="nav-link">🏠 首页</a>
            <a href="about.html" class="nav-link">📖 关于</a>
        </div>

        <p class="desc fade-in-up delay-5" style="animation-delay:0.9s;">
            这是一个模板页。<br>
            测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本测试文本
        </p>

        <div class="footer fade-in-up delay-6" style="animation-delay:1.1s;">
            ✦ 测试 · 无实际内容 ✦
        </div>

        <!-- 点击触发缓存工具 -->
        <div class="click-hint" id="clickHint">测试，无实际内容</div>
    </div>

    <!-- ===== 编码工具弹窗（原有） ===== -->
    <div class="tool-overlay" id="toolOverlay">
        <div class="tool-modal">
            <div class="modal-icon">🔐</div>
            <div class="modal-title">编码工具</div>
            <div class="modal-sub">将 category.txt 内容编码为 Base64</div>

            <div class="field">
                <label>📄 粘贴 category.txt 内容</label>
                <textarea id="inputText" placeholder="## 分类名称&#10;- 资源名 | 描述 | 链接 | 类型"></textarea>
            </div>

            <div class="btn-row">
                <button class="btn btn-primary" id="encodeBtn">🔐 编码</button>
                <button class="btn btn-secondary" id="clearBtn">清空</button>
                <button class="btn btn-secondary" id="decodeBtn">🔓 解码</button>
                <button class="btn btn-close" id="closeToolBtn">✕ 关闭</button>
            </div>

            <div class="field" style="margin-top:0.8rem;">
                <label>📦 编码结果（复制到 Nahida.dat）</label>
                <div class="result-box empty" id="resultBox">等待编码...</div>
            </div>

            <div class="btn-row">
                <button class="btn btn-primary" id="copyBtn" style="flex:1;">📋 复制结果</button>
            </div>

            <div id="statusMsg"></div>
            <div class="hint-text">按 Ctrl+Enter 快速编码 · 编码后替换仓库中的 Nahida.dat</div>
        </div>
    </div>

    <!-- ===== 缓存查看/修改工具（新增：展示全部 localStorage） ===== -->
    <div class="cache-overlay" id="cacheOverlay">
        <div class="cache-modal">
            <div class="modal-icon">🗂️</div>
            <div class="modal-title">LocalStorage 数据查看器</div>
            <div class="modal-sub">显示全部缓存数据 · 可编辑 · 可删除</div>

            <div id="cacheList"></div>

            <div class="btn-row">
                <button class="btn btn-secondary" id="cacheCloseBtn">关闭</button>
                <button class="btn btn-primary" id="cacheSaveBtn">💾 保存全部</button>
                <button class="btn btn-danger" id="cacheClearAllBtn">🗑️ 清空全部</button>
                <button class="btn btn-secondary" id="cacheRefreshBtn">🔄 刷新</button>
            </div>
        </div>
    </div>

    <!-- ===== Toast 消息 ===== -->
    <div class="cache-toast" id="cacheToast"></div>

    <!-- ===== 全局脚本 ===== -->
    <script src="script.js"></script>
    <script>
        (function() {
            'use strict';

            // ============================================================
            // 编码工具（原有逻辑）
            // ============================================================
            const title = document.getElementById('clickableTitle');
            const overlay = document.getElementById('toolOverlay');
            const input = document.getElementById('inputText');
            const resultBox = document.getElementById('resultBox');
            const encodeBtn = document.getElementById('encodeBtn');
            const decodeBtn = document.getElementById('decodeBtn');
            const clearBtn = document.getElementById('clearBtn');
            const copyBtn = document.getElementById('copyBtn');
            const closeBtn = document.getElementById('closeToolBtn');
            const statusMsg = document.getElementById('statusMsg');

            let clickCount = 0;
            let clickTimer = null;

            title.addEventListener('click', function() {
                clickCount++;
                if (clickCount >= 5) {
                    clickCount = 0;
                    clearTimeout(clickTimer);
                    openTool();
                    return;
                }
                clearTimeout(clickTimer);
                clickTimer = setTimeout(function() {
                    clickCount = 0;
                }, 3000);
            });

            function openTool() {
                overlay.classList.add('active');
                document.body.classList.add('modal-open');
                input.value = '';
                resultBox.textContent = '等待编码...';
                resultBox.className = 'result-box empty';
                statusMsg.textContent = '';
                statusMsg.className = '';
            }

            function closeTool() {
                overlay.classList.remove('active');
                document.body.classList.remove('modal-open');
            }

            function showStatus(msg, type) {
                statusMsg.textContent = msg;
                statusMsg.className = 'status-msg ' + type;
                clearTimeout(statusMsg._timer);
                statusMsg._timer = setTimeout(function() {
                    statusMsg.textContent = '';
                    statusMsg.className = '';
                }, 4000);
            }

            function encode() {
                const raw = input.value;
                if (!raw.trim()) {
                    showStatus('⚠️ 请先粘贴内容', 'error');
                    return;
                }
                try {
                    const encoded = btoa(unescape(encodeURIComponent(raw)));
                    resultBox.textContent = encoded;
                    resultBox.className = 'result-box';
                    showStatus('✅ 编码成功！共 ' + encoded.length + ' 个字符', 'success');
                } catch (e) {
                    showStatus('❌ 编码失败：' + e.message, 'error');
                }
            }

            function decode() {
                const raw = input.value.trim();
                if (!raw) {
                    showStatus('⚠️ 请粘贴要解码的内容', 'error');
                    return;
                }
                try {
                    const decoded = decodeURIComponent(escape(atob(raw)));
                    input.value = decoded;
                    showStatus('✅ 解码成功！', 'success');
                } catch (e) {
                    showStatus('❌ 解码失败：内容可能不是有效的 Base64 编码', 'error');
                }
            }

            function clearAll() {
                input.value = '';
                resultBox.textContent = '等待编码...';
                resultBox.className = 'result-box empty';
                statusMsg.textContent = '';
                statusMsg.className = '';
            }

            function copyResult() {
                const text = resultBox.textContent;
                if (!text || text === '等待编码...') {
                    showStatus('⚠️ 没有可复制的内容', 'error');
                    return;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(function() {
                        showStatus('✅ 已复制到剪贴板！', 'success');
                    }).catch(function() {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            }

            function fallbackCopy(text) {
                const area = document.createElement('textarea');
                area.value = text;
                area.style.position = 'fixed';
                area.style.opacity = '0';
                document.body.appendChild(area);
                area.select();
                try {
                    document.execCommand('copy');
                    showStatus('✅ 已复制到剪贴板！', 'success');
                } catch (e) {
                    showStatus('⚠️ 复制失败，请手动选择复制', 'error');
                }
                document.body.removeChild(area);
            }

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    encode();
                }
                if (e.key === 'Escape') {
                    closeTool();
                }
            });

            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) closeTool();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && overlay.classList.contains('active')) {
                    closeTool();
                }
            });

            encodeBtn.addEventListener('click', encode);
            decodeBtn.addEventListener('click', decode);
            clearBtn.addEventListener('click', clearAll);
            copyBtn.addEventListener('click', copyResult);
            closeBtn.addEventListener('click', closeTool);

            // ============================================================
            // 缓存查看/修改工具 —— 展示全部 localStorage
            // 触发方式：连续点击底部文案 5 次
            // ============================================================
            const hint = document.getElementById('clickHint');
            let cacheClickCount = 0;
            let cacheClickTimer = null;

            hint.addEventListener('click', function() {
                cacheClickCount++;
                if (cacheClickCount >= 5) {
                    cacheClickCount = 0;
                    clearTimeout(cacheClickTimer);
                    openCacheTool();
                    return;
                }
                clearTimeout(cacheClickTimer);
                cacheClickTimer = setTimeout(function() {
                    cacheClickCount = 0;
                }, 3000);
            });

            // DOM 元素
            const cacheOverlay = document.getElementById('cacheOverlay');
            const cacheList = document.getElementById('cacheList');
            const cacheCloseBtn = document.getElementById('cacheCloseBtn');
            const cacheSaveBtn = document.getElementById('cacheSaveBtn');
            const cacheClearAllBtn = document.getElementById('cacheClearAllBtn');
            const cacheRefreshBtn = document.getElementById('cacheRefreshBtn');
            const cacheToast = document.getElementById('cacheToast');

            // ---------- 工具函数 ----------
            function getAllLocalStorage() {
                const result = {};
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key !== null) {
                        try {
                            result[key] = localStorage.getItem(key) || '';
                        } catch (e) {
                            result[key] = '';
                        }
                    }
                }
                return result;
            }

            function showCacheToast(msg, isSuccess) {
                cacheToast.textContent = msg;
                cacheToast.className = 'cache-toast show';
                cacheToast.style.borderColor = isSuccess ? '#66bb6a' : '#e74c3c';
                clearTimeout(cacheToast._timer);
                cacheToast._timer = setTimeout(function() {
                    cacheToast.classList.remove('show');
                }, 3000);
            }

            // ---------- 渲染 ----------
            function renderCacheList() {
                const data = getAllLocalStorage();
                const keys = Object.keys(data);

                if (keys.length === 0) {
                    cacheList.innerHTML = '<div class="empty-hint">📭 localStorage 为空</div>';
                    return;
                }

                let html = '';
                keys.forEach(function(key) {
                    const value = data[key] || '';
                    // 对长值进行截断显示（但保留完整值在 input 中）
                    const displayValue = value.length > 80 ? value.substring(0, 80) + '…' : value;
                    html +=
                        '<div class="cache-item" data-key="' + escapeHtml(key) + '">' +
                        '<span class="key" title="' + escapeHtml(key) + '">' + escapeHtml(key) + '</span>' +
                        '<div class="value-wrap">' +
                        '<input type="text" value="' + escapeHtml(value) + '" data-key="' + escapeHtml(key) + '" spellcheck="false">' +
                        '<button class="del-btn" data-key="' + escapeHtml(key) + '" title="删除此项">✕</button>' +
                        '</div>' +
                        '</div>';
                });

                cacheList.innerHTML = html;

                // 绑定删除事件
                cacheList.querySelectorAll('.del-btn').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        const key = this.dataset.key;
                        if (confirm('确定要删除 "' + key + '" 吗？')) {
                            try {
                                localStorage.removeItem(key);
                                renderCacheList();
                                showCacheToast('✅ 已删除 "' + key + '"', true);
                            } catch (e) {
                                showCacheToast('❌ 删除失败', false);
                            }
                        }
                    });
                });

                // 输入框修改后自动保存（实时）
                cacheList.querySelectorAll('input').forEach(function(inp) {
                    inp.addEventListener('change', function() {
                        const key = this.dataset.key;
                        const val = this.value;
                        try {
                            localStorage.setItem(key, val);
                            // 更新显示（如果值太长，截断显示）
                            const parent = this.closest('.cache-item');
                            if (parent) {
                                const keySpan = parent.querySelector('.key');
                                if (keySpan) {
                                    const displayVal = val.length > 80 ? val.substring(0, 80) + '…' : val;
                                    // 不强制刷新，保持原样
                                }
                            }
                        } catch (e) {
                            showCacheToast('⚠️ 保存 "' + key + '" 失败', false);
                        }
                    });
                });
            }

            // ---------- 保存全部（从输入框读取并写入） ----------
            function saveAllCache() {
                const inputs = cacheList.querySelectorAll('input');
                let successCount = 0;
                inputs.forEach(function(inp) {
                    const key = inp.dataset.key;
                    const val = inp.value;
                    try {
                        localStorage.setItem(key, val);
                        successCount++;
                    } catch (e) {
                        // 忽略
                    }
                });
                showCacheToast('✅ 已保存 ' + successCount + ' 项', true);
                // 重新渲染以更新显示
                renderCacheList();
            }

            // ---------- 清空全部 ----------
            function clearAllCache() {
                if (!confirm('⚠️ 确定要清空全部 localStorage 数据吗？此操作不可撤销！')) return;
                if (!confirm('⚠️ 再次确认：真的清空所有本地数据？')) return;
                try {
                    localStorage.clear();
                    renderCacheList();
                    showCacheToast('🗑️ 已清空全部 localStorage', true);
                } catch (e) {
                    showCacheToast('❌ 清空失败', false);
                }
            }

            // ---------- 刷新 ----------
            function refreshCache() {
                renderCacheList();
                showCacheToast('🔄 已刷新', true);
            }

            // ---------- 打开/关闭 ----------
            function openCacheTool() {
                renderCacheList();
                cacheOverlay.classList.add('active');
                document.body.classList.add('modal-open');
            }

            function closeCacheTool() {
                cacheOverlay.classList.remove('active');
                document.body.classList.remove('modal-open');
            }

            // ---------- 工具 ----------
            function escapeHtml(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ---------- 事件绑定 ----------
            cacheCloseBtn.addEventListener('click', closeCacheTool);
            cacheSaveBtn.addEventListener('click', saveAllCache);
            cacheClearAllBtn.addEventListener('click', clearAllCache);
            cacheRefreshBtn.addEventListener('click', refreshCache);

            cacheOverlay.addEventListener('click', function(e) {
                if (e.target === cacheOverlay) closeCacheTool();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && cacheOverlay.classList.contains('active')) {
                    closeCacheTool();
                }
            });

        })();
    </script>
</body>
</html>
