<!DOCTYPE html>
<html lang="zh-CN" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章阅读 · 虚空终端</title>
    <link rel="preload" as="image" href="background.webp">
    <link rel="preload" as="image" href="background1.webp">
    <link rel="preload" as="image" href="background2.webp">
    <link rel="preload" as="image" href="background3.webp">
    <link rel="preload" as="image" href="background4.webp">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ===== 文章阅读页专属样式 ===== */
        .article-container {
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
        }
        .article-card {
            padding: 2.2rem 2.2rem 2rem;
            border-radius: 2rem;
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }
        .article-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.2rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid rgba(128, 128, 128, 0.1);
        }
        .article-header .brand {
            font-size: 2rem;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
            letter-spacing: 0.02em;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .article-header .brand .typing-title {
            display: inline-block;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .article-header .nav-links {
            display: flex;
            gap: 1.5rem;
            font-size: 1.05rem;
        }
        .article-header .nav-links a {
            text-decoration: none;
            color: inherit;
            opacity: 0.7;
            transition: 0.25s;
            border-bottom: 2px solid transparent;
            padding-bottom: 2px;
        }
        .article-header .nav-links a:hover,
        .article-header .nav-links a.active {
            opacity: 1;
            border-bottom-color: currentColor;
        }

        /* ===== 正文区 ===== */
        .article-body {
            line-height: 1.8;
            font-size: 1rem;
            min-height: 200px;
        }
        .article-body h1,
        .article-body h2,
        .article-body h3 {
            margin-top: 1.4em;
            margin-bottom: 0.6em;
            line-height: 1.3;
        }
        .article-body h1 { font-size: 1.8rem; }
        .article-body h2 { font-size: 1.45rem; }
        .article-body h3 { font-size: 1.2rem; }
        .article-body p { margin: 0.8em 0; }
        .article-body blockquote {
            margin: 1em 0;
            padding: 0.6em 1.2em;
            border-left: 3px solid rgba(102, 187, 106, 0.5);
            background: rgba(128, 128, 128, 0.05);
            border-radius: 0 0.8rem 0.8rem 0;
            opacity: 0.9;
        }
        .article-body code {
            background: rgba(128, 128, 128, 0.12);
            padding: 0.1em 0.4em;
            border-radius: 0.4em;
            font-size: 0.92em;
        }
        .article-body pre {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(128, 128, 128, 0.12);
            border-radius: 1rem;
            padding: 1rem 1.2rem;
            overflow-x: auto;
            margin: 1em 0;
        }
        .article-body pre code {
            background: transparent;
            padding: 0;
        }
        .article-body table {
            border-collapse: collapse;
            margin: 1em 0;
            width: 100%;
        }
        .article-body th,
        .article-body td {
            border: 1px solid rgba(128, 128, 128, 0.2);
            padding: 0.5rem 0.9rem;
            text-align: left;
        }
        .article-body th {
            background: rgba(128, 128, 128, 0.08);
            font-weight: 600;
        }
        .article-body ul,
        .article-body ol {
            padding-left: 1.6em;
            margin: 0.8em 0;
        }
        .article-body li { margin: 0.3em 0; }
        .article-body hr {
            border: none;
            border-top: 1px dashed rgba(128, 128, 128, 0.25);
            margin: 1.6em 0;
        }
        .article-body a {
            color: #66bb6a;
        }

        .article-empty {
            text-align: center;
            padding: 3rem 0;
            opacity: 0.5;
            width: 100%;
        }

        /* ===== 底部控制栏 ===== */
        .bottom-controls {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1500;
            display: flex;
            gap: 0.6rem;
            align-items: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        .bottom-controls.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .ctrl-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            opacity: 0.6;
            font-family: inherit;
            line-height: 1;
            padding: 0;
            background: var(--settings-bg, rgba(10, 20, 10, 0.6));
            color: var(--text-color, #c8e6c9);
            border-color: var(--border-color, rgba(255, 255, 255, 0.15));
        }
        .ctrl-btn:hover {
            opacity: 1;
            transform: scale(1.08);
        }
        .ctrl-btn.hide-btn:hover {
            transform: scale(1.08) rotate(0deg);
        }
        .ctrl-btn.settings-btn:hover {
            transform: scale(1.08) rotate(60deg);
        }
        .ctrl-btn.hide-btn.active {
            background: rgba(231, 76, 60, 0.3);
            border-color: #e74c3c;
            opacity: 0.8;
        }

        /* ===== 样式设置弹窗（完整内联样式） ===== */
        .settings-overlay {
            position: fixed;
            inset: 0;
            z-index: 1600;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            animation: overlayIn 0.25s ease-out;
        }
        .settings-overlay.active { display: flex; }
        .settings-panel {
            max-width: 420px;
            width: 90%;
            padding: 2rem 2rem 1.8rem;
            border-radius: 1.8rem;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 90vh;
            overflow-y: auto;
            text-align: center;
            background: var(--settings-panel-bg, var(--card-bg));
            color: var(--text-color);
        }
        .settings-panel .panel-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
        }
        .settings-panel .panel-sub {
            font-size: 0.85rem;
            opacity: 0.4;
            margin-bottom: 1.2rem;
        }
        .settings-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }
        .settings-group label {
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0.6;
            display: block;
            margin-bottom: 0.4rem;
        }
        .settings-group .options {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .settings-group .options .opt-btn {
            padding: 0.3rem 1.2rem;
            border-radius: 2rem;
            border: 1px solid rgba(128, 128, 128, 0.15);
            background: transparent;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0.5;
            color: inherit;
        }
        .settings-group .options .opt-btn:hover {
            opacity: 0.8;
            background: rgba(128, 128, 128, 0.05);
        }
        .settings-group .options .opt-btn.active {
            opacity: 1;
            border-color: currentColor;
            background: rgba(128, 128, 128, 0.08);
        }
        .settings-panel .panel-actions {
            display: flex;
            gap: 0.6rem;
            justify-content: flex-end;
            margin-top: 0.8rem;
        }
        .settings-panel .panel-actions .btn {
            padding: 0.4rem 1.4rem;
            border-radius: 2rem;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .settings-panel .panel-actions .btn-secondary {
            background: transparent;
            border: 1px solid rgba(128, 128, 128, 0.15);
            color: inherit;
        }
        .settings-panel .panel-actions .btn-secondary:hover {
            background: rgba(128, 128, 128, 0.06);
        }

        /* ===== Toast ===== */
        #voidToast {
            position: fixed;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            bottom: 30px;
            z-index: 2000;
            padding: 12px 28px;
            border-radius: 2rem;
            font-size: 1rem;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: var(--toast-bg, rgba(0, 0, 0, 0.8));
            color: var(--toast-color, #fff);
        }
        #voidToast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== 隐藏 UI 适配 ===== */
        body.ui-hidden .article-container,
        body.ui-hidden .article-card,
        body.ui-hidden .article-header,
        body.ui-hidden .article-body,
        body.ui-hidden #voidToast {
            opacity: 0 !important;
            pointer-events: none !important;
            transition: opacity 0.3s ease;
        }
        body.ui-hidden .settings-overlay.active {
            opacity: 1 !important;
            pointer-events: auto !important;
        }
        body.ui-hidden .bottom-controls {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        @media (max-width: 600px) {
            .article-card { padding: 1.5rem 1rem; }
            .article-header { flex-direction: column; align-items: stretch; }
        }
        @media (max-width: 400px) {
            .article-card { padding: 1rem 0.8rem; }
        }

        @keyframes overlayIn {
            0% { opacity: 0; backdrop-filter: blur(0px); }
            100% { opacity: 1; backdrop-filter: blur(6px); }
        }
        @keyframes modalPop {
            0% { transform: scale(0.92) translateY(16px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="article-container">
        <div class="article-card">
            <header class="article-header">
                <div class="brand" id="brandTitle">
                    <span class="typing-title">📖 文章阅读</span>
                </div>
                <div class="nav-links">
                    <a href="index.html">🏠 首页</a>
                    <a href="VOID.html">📝 文章列表</a>
                </div>
            </header>
            <div id="articleBody" class="article-body">
                <div class="article-empty">⏳ 加载中...</div>
            </div>
        </div>
    </div>

    <!-- ===== Toast ===== -->
    <div id="voidToast"></div>

    <!-- ===== 底部控制栏 ===== -->
    <div class="bottom-controls" id="bottomControls">
        <button class="ctrl-btn hide-btn" id="hideToggle" title="隐藏所有UI，只看背景">👁️</button>
        <button class="ctrl-btn settings-btn" id="settingsToggle" title="全局样式设置">⚙️</button>
    </div>

    <!-- ===== 设置面板（样式完整 + 功能完整） ===== -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-panel">
            <div class="panel-title">⚙️ 样式设置</div>
            <div class="panel-sub">自定义你的浏览体验</div>
            <div class="settings-group">
                <label>🎨 主题模式</label>
                <div class="options" id="themeOptions">
                    <button class="opt-btn" data-theme="default">默认</button>
                    <button class="opt-btn" data-theme="light">亮色</button>
                    <button class="opt-btn" data-theme="dark">暗色</button>
                </div>
            </div>
            <div class="settings-group">
                <label>🖼️ 背景图片</label>
                <div class="options" id="bgOptions">
                    <button class="opt-btn" data-bg="default">默认</button>
                    <button class="opt-btn" data-bg="food">海边</button>
                    <button class="opt-btn" data-bg="trip">旅途</button>
                    <button class="opt-btn" data-bg="electric1">！？电电？！（1）</button>
                    <button class="opt-btn" data-bg="electric2">！？电电？！（2）</button>
                </div>
            </div>
            <div class="panel-actions">
                <button class="btn btn-secondary" id="settingsClose">关闭</button>
            </div>
        </div>
    </div>

    <!-- ===== 全局脚本 ===== -->
    <script src="script.js"></script>
    <script>
        (function() {
            // ===== 全局样式设置（完整功能） =====
            const htmlRoot = document.getElementById('htmlRoot') || document.documentElement;
            const settingsToggle = document.getElementById('settingsToggle');
            const settingsOverlay = document.getElementById('settingsOverlay');
            const settingsClose = document.getElementById('settingsClose');
            const themeOptions = document.getElementById('themeOptions');
            const bgOptions = document.getElementById('bgOptions');

            function loadSettings() {
                try {
                    const saved = localStorage.getItem('siteSettings');
                    if (saved) return JSON.parse(saved);
                } catch (e) {}
                return { theme: 'default', bg: 'default' };
            }
            function saveSettings(settings) {
                try { localStorage.setItem('siteSettings', JSON.stringify(settings)); } catch (e) {}
            }
            function applySettings(settings) {
                const theme = settings.theme || 'default';
                htmlRoot.removeAttribute('data-theme');
                if (theme !== 'default') htmlRoot.setAttribute('data-theme', theme);
                document.querySelectorAll('#themeOptions .opt-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.theme === theme);
                });
                const bg = settings.bg || 'default';
                htmlRoot.removeAttribute('data-bg');
                if (bg !== 'default') htmlRoot.setAttribute('data-bg', bg);
                document.querySelectorAll('#bgOptions .opt-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.bg === bg);
                });
            }
            function openSettings() {
                applySettings(loadSettings());
                settingsOverlay.classList.add('active');
                document.body.classList.add('modal-open');
            }
            function closeSettings() {
                settingsOverlay.classList.remove('active');
                document.body.classList.remove('modal-open');
            }
            settingsToggle.addEventListener('click', openSettings);
            settingsClose.addEventListener('click', closeSettings);
            settingsOverlay.addEventListener('click', function(e) {
                if (e.target === settingsOverlay) closeSettings();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && settingsOverlay.classList.contains('active')) closeSettings();
            });
            themeOptions.addEventListener('click', function(e) {
                const btn = e.target.closest('.opt-btn');
                if (!btn) return;
                const settings = loadSettings();
                settings.theme = btn.dataset.theme;
                saveSettings(settings);
                applySettings(settings);
            });
            bgOptions.addEventListener('click', function(e) {
                const btn = e.target.closest('.opt-btn');
                if (!btn) return;
                const settings = loadSettings();
                settings.bg = btn.dataset.bg;
                saveSettings(settings);
                applySettings(settings);
            });
            applySettings(loadSettings());

            // ===== 隐藏 UI =====
            const hideToggle = document.getElementById('hideToggle');
            let isHidden = false;
            hideToggle.addEventListener('click', function() {
                isHidden = !isHidden;
                document.body.classList.toggle('ui-hidden', isHidden);
                this.textContent = isHidden ? '👁️‍🗨️' : '👁️';
                this.classList.toggle('active', isHidden);
                this.title = isHidden ? '显示所有UI' : '隐藏所有UI，只看背景';
            });

            // ===== 显示控制栏 =====
            const bottomControls = document.getElementById('bottomControls');
            setTimeout(function() {
                bottomControls.classList.add('show');
            }, 800);

            // ===== Toast =====
            window.showVoidToast = function(msg, duration) {
                duration = duration || 4000;
                const el = document.getElementById('voidToast');
                el.textContent = msg;
                el.classList.add('show');
                clearTimeout(el._hideTimer);
                el._hideTimer = setTimeout(function() {
                    el.classList.remove('show');
                }, duration);
            };

            // ===== 加载文章（?file=xxx.md 或 ?file=VOID/xxx.md） =====
            const articleBody = document.getElementById('articleBody');
            const params = new URLSearchParams(location.search);
            let file = params.get('file');
            if (!file) {
                articleBody.innerHTML = '<div class="article-empty">📭 未指定文章<br>请在链接后添加 <code>?file=VOID/测试文本.md</code></div>';
                return;
            }
            // 兼容纯文件名（自动补 VOID/ 前缀）与完整路径
            if (!file.includes('/')) file = 'VOID/' + file;
            fetch(file)
                .then(function(res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.text();
                })
                .then(function(text) {
                    articleBody.innerHTML = marked.parse(text);
                    document.title = file.split('/').pop() + ' · 虚空终端';
                })
                .catch(function(err) {
                    articleBody.innerHTML = '<div class="article-empty">❌ 文章加载失败：' + err.message + '</div>';
                });
        })();
    </script>
</body>
</html>
