<!DOCTYPE html>
<html lang="zh-CN" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具 · 虚空终端</title>
    <link rel="preload" as="image" href="background.webp">
    <link rel="preload" as="image" href="background1.webp">
    <link rel="preload" as="image" href="background2.webp">
    <link rel="preload" as="image" href="background3.webp">
    <link rel="preload" as="image" href="background4.webp">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== 工具页专属：容器 ===== */
        .tool-container { max-width: 980px; width: 100%; margin: 0 auto; min-width: 0; }
        .tool-card {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 2.2rem 2.2rem 2rem;
            border-radius: 2rem;
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            min-width: 0;
        }
        /* ===== 工具栏：搜索 + 模式切换 + 分类过滤 ===== */
        .tool-toolbar { display: flex; align-items: center; gap: 0.55rem; margin-bottom: 1.3rem; min-width: 0; flex-wrap: wrap; }
        .tool-toolbar input {
            flex: 1 1 200px; min-width: 0; padding: 0.55rem 1rem; border-radius: 2rem;
            border: 1px solid rgba(128,128,128,0.2); background: rgba(128,128,128,0.06);
            color: inherit; font-family: inherit; outline: none; font-size: 0.9rem;
        }
        .tool-toolbar input:focus { border-color: #66bb6a; }
        .tb-btn {
            flex-shrink: 0; cursor: pointer; font-family: inherit; font-size: 0.85rem;
            padding: 0.5rem 1rem; border-radius: 2rem; white-space: nowrap;
            border: 1px solid rgba(128,128,128,0.24); background: rgba(128,128,128,0.06);
            color: inherit; transition: all 0.2s;
        }
        .tb-btn:hover { border-color: #66bb6a; color: #66bb6a; background: rgba(102,187,106,0.1); }
        .tb-btn.filtering {
            border-color: #ef5350; color: #fff; background: rgba(239,83,80,0.85); font-weight: 600;
        }
        .tb-btn.filtering:hover { background: rgba(239,83,80,1); color: #fff; border-color: #ef5350; }
        .tool-count { font-size: 0.83rem; opacity: 0.5; white-space: nowrap; flex-basis: 100%; }
        /* ===== 收藏区 ===== */
        .tool-fav-sec { margin-bottom: 1.3rem; }
        .tool-fav-sec .tool-grid { margin-top: 0.75rem; }
        .tool-fav-sec.closed .tool-grid { display: none; }
        .tool-fav-sec.closed .arrow { transform: rotate(-90deg); }
        /* ===== 分类分组（模式 3） ===== */
        .mt-catbox { margin-bottom: 0.7rem; }
        .mt-catbox .tool-grid { margin-top: 0.75rem; }
        .mt-catbox.closed .tool-grid { display: none; }
        .mt-catbox.closed .arrow { transform: rotate(-90deg); }
        /* ===== 模式 1：瀑布式 ===== */
        .mt-waterfall { columns: 2; column-gap: 1rem; }
        .mt-waterfall .tool-item { break-inside: avoid; margin-bottom: 1rem; width: 100%; }
        @media (max-width: 640px) { .mt-waterfall { columns: 1; } }
        /* ===== 模式 2：时间线 ===== */
        .mt-timeline { display: flex; flex-direction: column; gap: 0.55rem; }
        .mt-line { display: flex; align-items: stretch; gap: 0.7rem; min-width: 0; }
        .mt-side {
            flex-shrink: 0; width: 2.6rem; display: flex; flex-direction: column;
            align-items: center; gap: 0.2rem; padding-top: 0.85rem;
        }
        .mt-rank {
            font-size: 0.82rem; font-weight: 700; font-family: 'Courier New', monospace;
            opacity: 0.45; line-height: 1;
        }
        .mt-line:nth-child(1) .mt-rank, .mt-line:nth-child(2) .mt-rank, .mt-line:nth-child(3) .mt-rank {
            color: #66bb6a; opacity: 1;
        }
        .mt-heat {
            font-size: 0.68rem; font-family: 'Courier New', monospace; line-height: 1;
            color: #66bb6a; opacity: 0.85; white-space: nowrap;
        }
        .mt-node { position: relative; flex-shrink: 0; width: 0.9rem; }
        .mt-node::before {
            content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px;
            background: rgba(128,128,128,0.18); transform: translateX(-50%);
        }
        .mt-node::after {
            content: ''; position: absolute; left: 50%; top: 1.4rem; width: 0.55rem; height: 0.55rem;
            border-radius: 50%; background: #66bb6a; transform: translate(-50%, -50%);
            box-shadow: 0 0 0 3px rgba(102,187,106,0.16);
        }
        .mt-line:last-child .mt-node::before { bottom: 50%; }
        .mt-line .tool-item { flex: 1; min-width: 0; }
        /* ===== 内置弹窗（分类过滤） ===== */
        .mt-modal { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
        .mt-modal.show { display: flex; }
        .mt-modal-panel {
            width: 420px; max-width: 92vw; max-height: 80vh; display: flex; flex-direction: column;
            border-radius: 1.1rem; background: var(--card-bg, rgba(15,20,32,0.97)); color: var(--text-color);
            border: 1px solid var(--border-color, rgba(255,255,255,0.1));
            box-shadow: 0 20px 60px rgba(0,0,0,0.5); overflow: hidden;
            animation: mtPop 0.24s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes mtPop { 0% { transform: scale(0.93) translateY(12px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        .mt-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 0.85rem 1.05rem; border-bottom: 1px solid rgba(128,128,128,0.18); font-weight: 600; }
        .mt-modal-head button { background: none; border: none; color: inherit; opacity: 0.6; cursor: pointer; font-size: 1rem; }
        .mt-modal-head button:hover { opacity: 1; }
        .mt-modal-body { padding: 1rem; overflow-y: auto; }
        .ap-grid { display: flex; flex-direction: column; gap: 0.4rem; }
        .ap-item {
            display: flex; align-items: center; gap: 0.55rem; padding: 0.5rem 0.6rem;
            border-radius: 0.7rem; border: 1px solid rgba(128,128,128,0.18);
            background: rgba(128,128,128,0.05); cursor: pointer; transition: all 0.15s;
        }
        .ap-item:hover { border-color: #66bb6a; background: rgba(102,187,106,0.08); }
        .ap-item.on { border-color: #66bb6a; background: rgba(102,187,106,0.14); }
        .ap-check {
            flex-shrink: 0; width: 1.15rem; height: 1.15rem; border-radius: 0.32rem;
            border: 1px solid rgba(128,128,128,0.4); display: flex; align-items: center; justify-content: center;
            font-size: 0.72rem; color: transparent; transition: all 0.15s;
        }
        .ap-item.on .ap-check { border-color: #66bb6a; background: #66bb6a; color: #fff; }
        .mt-modal-foot {
            display: flex; gap: 0.6rem; justify-content: flex-end;
            padding: 0.75rem 1.05rem; border-top: 1px solid rgba(128,128,128,0.18);
        }
        .mt-modal-foot button {
            cursor: pointer; font-family: inherit; font-size: 0.86rem;
            padding: 0.45rem 1.2rem; border-radius: 2rem; transition: all 0.2s;
            border: 1px solid rgba(128,128,128,0.26); background: rgba(128,128,128,0.06); color: inherit;
        }
        .mt-modal-foot button:hover { border-color: rgba(128,128,128,0.5); }
        .mt-modal-foot button.primary {
            border-color: #66bb6a; color: #66bb6a; background: rgba(102,187,106,0.12); font-weight: 600;
        }
        .mt-modal-foot button.primary:hover { background: rgba(102,187,106,0.22); }
        .ap-tip { font-size: 0.75rem; opacity: 0.5; padding: 0 0.2rem 0.6rem; line-height: 1.5; }
        .ap-thumb { flex-shrink: 0; width: 1.6rem; text-align: center; }
        .ap-name { flex: 1; min-width: 0; font-size: 0.86rem; }
        .sec-num { flex-shrink: 0; font-size: 0.76rem; opacity: 0.6; background: rgba(128,128,128,0.14); border-radius: 2rem; padding: 0.1rem 0.55rem; }
    </style>
</head>
<body>
    <div class="tool-container">
        <div class="tool-card">
            <header class="tool-pagehead">
                <div class="brand"><span class="typing-title">🛠️ 工具</span></div>
                <nav class="nav-menu">
                    <a class="nav-link" href="index.html">🏠 首页</a>
                    <a class="nav-link active" href="MT.html">🛠️ 工具</a>
                </nav>
            </header>

            <div class="tool-toolbar">
                <input type="text" id="searchInput" placeholder="🔍 搜索工具..." />
                <button class="tb-btn" id="modeBtn" title="切换展示方式">🌊 瀑布式</button>
                <button class="tb-btn" id="filterBtn" title="选择要看哪些分类">🗂️ 看分类</button>
                <span class="tool-count" id="toolCount"></span>
            </div>

            <div class="tool-fav-sec" id="favSec" style="display:none;">
                <div class="tool-sec-title" data-sec="fav">
                    <span class="arrow">▾</span>
                    <span class="sec-name">⭐ 我的收藏</span>
                    <span class="sec-num" id="favNum">0</span>
                </div>
                <div class="tool-grid" id="favGrid"></div>
            </div>

            <div id="mtBody" class="mt-view mt-waterfall">
                <div class="tool-empty">⏳ 加载中...</div>
            </div>
        </div>
    </div>

    <!-- 分类过滤弹窗 -->
    <div class="mt-modal" id="mtModal">
        <div class="mt-modal-panel">
            <div class="mt-modal-head"><span id="mtModalTitle">分类</span><button id="mtModalX">✕</button></div>
            <div class="mt-modal-body" id="mtModalBody"></div>
            <div class="mt-modal-foot" id="mtModalFoot" style="display:none;">
                <button id="mtModalCancel">取消</button>
                <button class="primary" id="mtModalOk">确定</button>
            </div>
        </div>
    </div>

    <script src="MTbox.js"></script>
    <script src="global-ui.js"></script>
</body>
</html>
