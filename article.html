<!DOCTYPE html>
<html lang="zh-CN" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阅读 · 虚空终端</title>
    <link rel="preload" as="image" href="background.webp">
    <link rel="preload" as="image" href="background1.webp">
    <link rel="preload" as="image" href="background2.webp">
    <link rel="preload" as="image" href="background3.webp">
    <link rel="preload" as="image" href="background4.webp">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .article-reader {
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
        }
        .reader-card {
            padding: 2.2rem 2.5rem 2.5rem;
            border-radius: 2rem;
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s, border-color 0.3s;
            min-height: 60vh;
        }
        .reader-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid rgba(128, 128, 128, 0.1);
        }
        .reader-header .back-link {
            text-decoration: none;
            color: inherit;
            opacity: 0.6;
            transition: 0.25s;
            font-size: 1rem;
        }
        .reader-header .back-link:hover {
            opacity: 1;
        }
        .reader-header .title {
            font-size: 1.6rem;
            font-weight: 700;
            flex: 1;
            text-align: center;
            margin: 0 1rem;
            word-break: break-all;
        }
        .reader-body {
            line-height: 1.9;
            font-size: 1.05rem;
            padding: 0.2rem 0;
        }
        .reader-body h1, .reader-body h2, .reader-body h3 {
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .reader-body p { margin-bottom: 0.9rem; }
        .reader-body img { max-width: 100%; border-radius: 0.8rem; }
        .reader-body pre {
            background: rgba(0,0,0,0.3);
            padding: 1rem;
            border-radius: 0.8rem;
            overflow-x: auto;
        }
        .reader-body code {
            background: rgba(0,0,0,0.2);
            padding: 0.1rem 0.4rem;
            border-radius: 0.3rem;
            font-size: 0.9rem;
        }
        .reader-body blockquote {
            border-left: 4px solid rgba(128,128,128,0.3);
            padding-left: 1rem;
            opacity: 0.7;
            margin: 0.5rem 0;
        }
        .reader-empty {
            text-align: center;
            padding: 4rem 0;
            opacity: 0.5;
        }
        .reader-loading {
            text-align: center;
            padding: 4rem 0;
            opacity: 0.4;
        }
        #readerToast {
            position: fixed;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            bottom: 30px;
            z-index: 2000;
            padding: 12px 28px;
            border-radius: 2rem;
            font-size: 1rem;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--toast-bg, rgba(0,0,0,0.8));
            color: var(--toast-color, #fff);
        }
        #readerToast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        body.ui-hidden .article-reader,
        body.ui-hidden .reader-card,
        body.ui-hidden .reader-header,
        body.ui-hidden .reader-body,
        body.ui-hidden #readerToast {
            opacity: 0 !important;
            pointer-events: none !important;
            transition: opacity 0.3s ease;
        }
        body.ui-hidden .settings-overlay.active {
            opacity: 1 !important;
            pointer-events: auto !important;
        }
        body.ui-hidden .bottom-controls {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        @media (max-width: 600px) {
            .reader-card { padding: 1.5rem 1rem; }
            .reader-header .title { font-size: 1.2rem; margin: 0 0.5rem; }
            .reader-body { font-size: 0.98rem; }
        }
        @media (max-width: 400px) {
            .reader-card { padding: 1rem 0.8rem; }
        }
    </style>
</head>
<body>

    <div class="article-reader">
        <div class="reader-card">
            <header class="reader-header">
                <a href="VOID.html" class="back-link">← 返回列表</a>
                <span class="title" id="readerTitle">📖 加载中...</span>
                <span style="width:5rem;"></span> <!-- 占位保持居中 -->
            </header>
            <div id="readerContent" class="reader-body">
                <div class="reader-loading">⏳ 加载文章...</div>
            </div>
        </div>
    </div>

    <div id="readerToast"></div>

    <!-- ===== 底部控制栏 ===== -->
    <div class="bottom-controls" id="bottomControls">
        <button class="ctrl-btn hide-btn" id="hideToggle" title="隐藏所有UI，只看背景">👁️</button>
        <button class="ctrl-btn settings-btn" id="settingsToggle" title="全局样式设置">⚙️</button>
    </div>

    <!-- ===== 设置面板 ===== -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-panel">
            <div class="panel-title">⚙️ 样式设置</div>
            <div class="panel-sub">自定义你的浏览体验</div>
            <div class="settings-group">
                <label>🎨 主题模式</label>
                <div class="options" id="themeOptions">
                    <button class="opt-btn" data-theme="default">默认</button>
                    <button class="opt-btn" data-theme="light">亮色</button>
                    <button class="opt-btn" data-theme="dark">暗色</button>
                </div>
            </div>
            <div class="settings-group">
                <label>🖼️ 背景图片</label>
                <div class="options" id="bgOptions">
                    <button class="opt-btn" data-bg="default">默认</button>
                    <button class="opt-btn" data-bg="food">海边</button>
                    <button class="opt-btn" data-bg="trip">旅途</button>
                    <button class="opt-btn" data-bg="electric1">！？电电？！（1）</button>
                    <button class="opt-btn" data-bg="electric2">！？电电？！（2）</button>
                </div>
            </div>
            <div class="panel-actions">
                <button class="btn btn-secondary" id="settingsClose">关闭</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        (function() {
            // ===== 全局设置 =====
            const htmlRoot = document.getElementById('htmlRoot') || document.documentElement;
            const settingsToggle = document.getElementById('settingsToggle');
            const settingsOverlay = document.getElementById('settingsOverlay');
            const settingsClose = document.getElementById('settingsClose');
            const themeOptions = document.getElementById('themeOptions');
            const bgOptions = document.getElementById('bgOptions');

            function loadSettings() {
                try {
                    const saved = localStorage.getItem('siteSettings');
                    if (saved) return JSON.parse(saved);
                } catch (e) {}
                return { theme: 'default', bg: 'default' };
            }
            function saveSettings(settings) {
                try { localStorage.setItem('siteSettings', JSON.stringify(settings)); } catch (e) {}
            }
            function applySettings(settings) {
                const theme = settings.theme || 'default';
                htmlRoot.removeAttribute('data-theme');
                if (theme !== 'default') htmlRoot.setAttribute('data-theme', theme);
                document.querySelectorAll('#themeOptions .opt-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.theme === theme);
                });
                const bg = settings.bg || 'default';
                htmlRoot.removeAttribute('data-bg');
                if (bg !== 'default') htmlRoot.setAttribute('data-bg', bg);
                document.querySelectorAll('#bgOptions .opt-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.bg === bg);
                });
            }
            function openSettings() {
                applySettings(loadSettings());
                settingsOverlay.classList.add('active');
                document.body.classList.add('modal-open');
            }
            function closeSettings() {
                settingsOverlay.classList.remove('active');
                document.body.classList.remove('modal-open');
            }
            settingsToggle.addEventListener('click', openSettings);
            settingsClose.addEventListener('click', closeSettings);
            settingsOverlay.addEventListener('click', function(e) {
                if (e.target === settingsOverlay) closeSettings();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && settingsOverlay.classList.contains('active')) closeSettings();
            });
            themeOptions.addEventListener('click', function(e) {
                const btn = e.target.closest('.opt-btn');
                if (!btn) return;
                const settings = loadSettings();
                settings.theme = btn.dataset.theme;
                saveSettings(settings);
                applySettings(settings);
            });
            bgOptions.addEventListener('click', function(e) {
                const btn = e.target.closest('.opt-btn');
                if (!btn) return;
                const settings = loadSettings();
                settings.bg = btn.dataset.bg;
                saveSettings(settings);
                applySettings(settings);
            });
            applySettings(loadSettings());

            // ===== 隐藏 UI =====
            const hideToggle = document.getElementById('hideToggle');
            let isHidden = false;
            hideToggle.addEventListener('click', function() {
                isHidden = !isHidden;
                document.body.classList.toggle('ui-hidden', isHidden);
                this.textContent = isHidden ? '👁️‍🗨️' : '👁️';
                this.classList.toggle('active', isHidden);
                this.title = isHidden ? '显示所有UI' : '隐藏所有UI，只看背景';
            });

            const bottomControls = document.getElementById('bottomControls');
            setTimeout(function() {
                bottomControls.classList.add('show');
            }, 800);

            function showReaderToast(msg, duration) {
                duration = duration || 4000;
                const el = document.getElementById('readerToast');
                el.textContent = msg;
                el.classList.add('show');
                clearTimeout(el._hideTimer);
                el._hideTimer = setTimeout(function() {
                    el.classList.remove('show');
                }, duration);
            }

            // ===== 核心：加载文章 =====
            function getUrlParam(name) {
                const params = new URLSearchParams(window.location.search);
                return params.get(name);
            }

            function getHiddenToken() {
                try {
                    const token = localStorage.getItem('voidHiddenToken');
                    const expire = localStorage.getItem('voidHiddenExpire');
                    if (!token || !expire) return false;
                    if (Date.now() > parseInt(expire)) {
                        localStorage.removeItem('voidHiddenToken');
                        localStorage.removeItem('voidHiddenExpire');
                        return false;
                    }
                    return token === 'true';
                } catch { return false; }
            }

            function loadArticle() {
                const file = getUrlParam('file');
                const titleEl = document.getElementById('readerTitle');
                const contentEl = document.getElementById('readerContent');

                if (!file) {
                    titleEl.textContent = '❌ 参数错误';
                    contentEl.innerHTML = '<div class="reader-empty">未指定文章文件</div>';
                    return;
                }

                // 检查扩展名
                if (!file.toLowerCase().endsWith('.md')) {
                    titleEl.textContent = '❌ 无效文件';
                    contentEl.innerHTML = '<div class="reader-empty">不支持的文件类型</div>';
                    return;
                }

                titleEl.textContent = file.replace(/\.md$/i, '');

                // 1. 加载索引检查隐藏状态
                fetch('VOID/index.txt?t=' + Date.now())
                    .then(res => {
                        if (!res.ok) throw new Error('无法获取索引');
                        return res.text();
                    })
                    .then(text => {
                        const lines = text.split('\n');
                        let isHidden = false;
                        let found = false;
                        for (let raw of lines) {
                            raw = raw.trim();
                            if (!raw) continue;
                            let fname = raw;
                            if (raw.startsWith('#')) {
                                fname = raw.substring(1).trim();
                                if (fname === file) {
                                    isHidden = true;
                                    found = true;
                                    break;
                                }
                            } else {
                                if (fname === file) {
                                    found = true;
                                    break;
                                }
                            }
                        }

                        if (!found) {
                            titleEl.textContent = '❌ 未找到';
                            contentEl.innerHTML = '<div class="reader-empty">文章不存在</div>';
                            return;
                        }

                        if (isHidden && !getHiddenToken()) {
                            titleEl.textContent = '🔒 隐藏文章';
                            contentEl.innerHTML = '<div class="reader-empty">此文章已隐藏，请返回列表页解锁后查看</div>';
                            return;
                        }

                        // 2. 加载正文
                        return fetch('VOID/' + encodeURIComponent(file) + '?t=' + Date.now());
                    })
                    .then(res => {
                        if (!res) return;
                        if (!res.ok) throw new Error('加载正文失败 (HTTP ' + res.status + ')');
                        return res.text();
                    })
                    .then(md => {
                        if (!md) return;
                        const html = marked.parse(md);
                        contentEl.innerHTML = html;
                    })
                    .catch(err => {
                        showReaderToast('❌ ' + err.message);
                        contentEl.innerHTML = '<div class="reader-empty">加载失败：' + err.message + '</div>';
                    });
            }

            loadArticle();
        })();
    </script>
</body>
</html>
