<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚空终端 · Kukuz分享页</title>
    <style>
        /* ---------- 全局重置 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, -apple-system, sans-serif;
            /* 背景图片：居中，cover 裁剪（横屏显示完整，竖屏显示中间） */
            background: url('background.webp') no-repeat center center / cover;
            /* 固定背景，防止滚动时拉伸 */
            background-attachment: fixed;
            /* 当图片加载失败时的后备色（深绿） */
            background-color: #1a2e1a;
            padding: 20px;
        }

        /* ---------- UI 卡片（覆盖在背景之上） ---------- */
        .card {
            max-width: 720px;
            width: 100%;
            padding: 3rem 2.5rem;
            border-radius: 2rem;
            text-align: center;
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }

        /* ---------- 亮色模式（白绿） ---------- */
        @media (prefers-color-scheme: light) {
            .card {
                background: rgba(255, 255, 255, 0.65);
                color: #1a3b1a;
                border-color: rgba(80, 160, 80, 0.25);
                box-shadow: 0 20px 60px rgba(0, 40, 0, 0.15);
            }
            .card h1 {
                color: #1a4f1a;
            }
            .card .sub {
                color: #2d5e2d;
            }
            .card .divider {
                background: rgba(60, 140, 60, 0.2);
            }
            .card .footer {
                color: #3d6b3d;
            }
        }

        /* ---------- 深色模式（黑与深绿） ---------- */
        @media (prefers-color-scheme: dark) {
            .card {
                background: rgba(10, 20, 10, 0.7);
                color: #c8e6c9;
                border-color: rgba(60, 140, 60, 0.3);
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            }
            .card h1 {
                color: #a5d6a7;
            }
            .card .sub {
                color: #81c784;
            }
            .card .divider {
                background: rgba(100, 200, 100, 0.15);
            }
            .card .footer {
                color: #6f9e76;
            }
        }

        /* ---------- 卡片内部元素 ---------- */
        .card h1 {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            margin-bottom: 0.4rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .card .sub {
            font-size: 1.1rem;
            font-weight: 400;
            opacity: 0.9;
            margin-bottom: 1.2rem;
        }

        .card .divider {
            width: 80px;
            height: 3px;
            border-radius: 4px;
            margin: 0.8rem auto 1.2rem;
        }

        .card .desc {
            font-size: 1rem;
            line-height: 1.7;
            max-width: 500px;
            margin: 0 auto 1.8rem;
            opacity: 0.85;
        }

        .card .footer {
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            opacity: 0.7;
        }

        /* ---------- 响应式：手机屏幕优化 ---------- */
        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.5rem;
                border-radius: 1.5rem;
                backdrop-filter: blur(8px) saturate(160%);
                -webkit-backdrop-filter: blur(8px) saturate(160%);
            }
            .card h1 {
                font-size: 2rem;
            }
            .card .sub {
                font-size: 1rem;
            }
            .card .desc {
                font-size: 0.95rem;
            }
        }

        /* 极窄屏幕（<360px）进一步缩小 */
        @media (max-width: 359px) {
            .card h1 {
                font-size: 1.6rem;
            }
            .card {
                padding: 1.5rem 1rem;
            }
        }

        /* ---------- 可选：优雅的加载过渡 ---------- */
        .card {
            animation: fadeUp 0.8s ease-out both;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(24px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🌿 虚空终端</h1>
        <div class="sub">— Kukuz 分享页 —</div>
        <div class="divider"></div>
        <p class="desc">
            万物虚寂，终有回响。<br>
            在这里，分享灵感、技术与我眼中的世界。
        </p>
        <div class="footer">✦ 随时更新 · 欢迎来访 ✦</div>
    </div>
</body>
</html>
