<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VoidOS · 虚空终端</title>

    <style>
        /* ============================================================
           0. 全局重置 & 绿色主题变量
           ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --void-primary: #8FB991;
            --void-dark: #314015;
            --void-accent: #58A25C;
            --void-light: #A7C0A6;
            --void-primary-dim: rgba(143, 185, 145, 0.15);
            --void-primary-glow: rgba(143, 185, 145, 0.45);
            --void-accent-dim: rgba(88, 162, 92, 0.25);
            --void-bg: #0f160f;
            --void-bg-green: #1a2a1a;
            --font-display: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-mono: 'Courier New', 'Fira Code', monospace;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--void-bg);
            font-family: var(--font-display);
            color: var(--void-primary);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ============================================================
           1. 背景层 — 黑绿渐变 · 时隐时现
           ============================================================ */
        #bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 120% 80% at 20% 30%, rgba(49, 64, 21, 0.6) 0%, transparent 70%),
                radial-gradient(ellipse 100% 100% at 80% 70%, rgba(88, 162, 92, 0.25) 0%, transparent 60%),
                radial-gradient(ellipse 60% 60% at 50% 50%, rgba(15, 22, 15, 0.9) 0%, transparent 80%),
                var(--void-bg);
            animation: breatheGradient 8s ease-in-out infinite alternate;
            will-change: transform, opacity;
        }

        #bg-layer::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 40% 60%, var(--void-primary-dim) 0%, transparent 70%);
            animation: glowPulse 6s ease-in-out infinite alternate;
            will-change: opacity;
            mix-blend-mode: screen;
            pointer-events: none;
        }

        @keyframes breatheGradient {
            0% {
                opacity: 0.7;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.03);
            }
            100% {
                opacity: 0.75;
                transform: scale(0.98);
            }
        }

        @keyframes glowPulse {
            0% {
                opacity: 0.2;
                transform: translate(0, 0) scale(1);
            }
            40% {
                opacity: 0.6;
                transform: translate(3%, -2%) scale(1.1);
            }
            80% {
                opacity: 0.3;
                transform: translate(-2%, 4%) scale(0.95);
            }
            100% {
                opacity: 0.5;
                transform: translate(1%, -1%) scale(1.05);
            }
        }

        /* ============================================================
           2. Canvas 粒子层
           ============================================================ */
        #particle-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        /* ============================================================
           3. 终端输出特效 (左下角, 半透明)
           ============================================================ */
        #terminal-overlay {
            position: fixed;
            left: 1.2rem;
            bottom: 1.2rem;
            z-index: 1;
            max-width: 70vw;
            max-height: 60vh;
            pointer-events: none;
            font-family: var(--font-mono);
            font-size: 10px;
            line-height: 1.25;
            color: rgba(143, 185, 145, 0.45);
            text-shadow: none;
            white-space: pre-wrap;
            word-break: break-all;
            overflow: hidden;
            letter-spacing: 0.02em;
            opacity: 0;
            animation: terminalFadeIn 2s ease 1s forwards;
            transition: opacity 0.3s ease;
        }

        #terminal-overlay.hidden {
            opacity: 0 !important;
            animation: none;
            transition: opacity 0.3s ease;
        }

        @keyframes terminalFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* 终端每一行 */
        .line {
            display: block;
            opacity: 0;
            transform: translateX(-20px);
            transition: none;
            will-change: transform, opacity;
        }
        .line-enter {
            animation: lineEnter 0.4s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }
        .line-exit {
            animation: lineExit 0.35s cubic-bezier(0.55, 0, 0.55, 0.2) forwards !important;
        }

        @keyframes lineEnter {
            0% { opacity: 0; transform: translateX(-20px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes lineExit {
            0% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(-20px); }
        }

        #terminal-output .ascii-art {
            white-space: pre;
            font-size: 9px;
            line-height: 1.1;
            letter-spacing: 0.05em;
            color: rgba(143, 185, 145, 0.5);
        }

        /* ============================================================
           4. 主内容层 (文案)
           ============================================================ */
        #container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        /* 虚空之眼 */
        #eye-wrapper {
            flex-shrink: 0;
            width: 80px;
            height: 80px;
            margin-bottom: 2.2rem;
            animation: eyeFloat 4s ease-in-out infinite alternate;
            will-change: transform;
        }

        #eye-wrapper svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 0 18px var(--void-primary-glow));
        }

        .eye-ring {
            animation: ringSpin 20s linear infinite;
            transform-origin: center;
            will-change: transform;
        }
        @keyframes ringSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .eye-diamond {
            animation: diamondPulse 3s ease-in-out infinite alternate;
            transform-origin: center;
            will-change: transform, opacity;
        }
        @keyframes diamondPulse {
            0% { transform: scale(0.85) rotate(0deg); opacity: 0.6; }
            100% { transform: scale(1.05) rotate(12deg); opacity: 1; }
        }

        .eye-dot {
            animation: dotBreathe 2.4s ease-in-out infinite alternate;
            transform-origin: center;
            will-change: opacity, r;
        }
        @keyframes dotBreathe {
            0% { opacity: 0.4; r: 2.5; }
            100% { opacity: 1; r: 4.5; }
        }

        @keyframes eyeFloat {
            0% { transform: translateY(-4px) scale(1); }
            100% { transform: translateY(8px) scale(1.02); }
        }

        /* 文案容器 */
        #title-container {
            position: relative;
            flex-shrink: 0;
            width: 100%;
            max-width: 700px;
            text-align: center;
            min-height: 6rem;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 800px;
        }

        .title-stage {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.04em;
            font-size: clamp(2.2rem, 10vw, 4.2rem);
            font-weight: 300;
            letter-spacing: 0.12em;
            text-shadow:
                0 0 20px var(--void-primary-glow),
                0 0 60px var(--void-primary-dim);
            line-height: 1.2;
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }

        .title-stage.active {
            opacity: 1;
            pointer-events: none;
        }

        .title-stage.clickable {
            pointer-events: auto;
            cursor: pointer;
            text-decoration: none;
            color: var(--void-primary);
        }
        .title-stage.clickable:hover {
            text-shadow:
                0 0 30px var(--void-primary-glow),
                0 0 80px var(--void-primary-dim);
        }

        /* 字符推出动画 */
        .char {
            display: inline-block;
            opacity: 0;
            transform: translateZ(-280px) scale(0.4) rotateX(12deg);
            filter: blur(8px);
            transition: none;
        }

        .animate-char .char {
            animation: charReveal 0.9s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        #stage1 .char:nth-child(1) { animation-delay: 0.00s; }
        #stage1 .char:nth-child(2) { animation-delay: 0.15s; }
        #stage1 .char:nth-child(3) { animation-delay: 0.30s; }
        #stage1 .char:nth-child(4) { animation-delay: 0.45s; }
        #stage1 .char:nth-child(5) { animation-delay: 0.60s; }

        #stage2 .char:nth-child(1) { animation-delay: 0.00s; }
        #stage2 .char:nth-child(2) { animation-delay: 0.20s; }
        #stage2 .char:nth-child(3) { animation-delay: 0.40s; }
        #stage2 .char:nth-child(4) { animation-delay: 0.60s; }
        #stage2 .char:nth-child(5) { animation-delay: 0.80s; }

        #stage3 .char:nth-child(1) { animation-delay: 0.00s; }
        #stage3 .char:nth-child(2) { animation-delay: 0.18s; }
        #stage3 .char:nth-child(3) { animation-delay: 0.36s; }
        #stage3 .char:nth-child(4) { animation-delay: 0.54s; }

        @keyframes charReveal {
            0% {
                opacity: 0;
                transform: translateZ(-280px) scale(0.4) rotateX(12deg);
                filter: blur(8px);
            }
            60% {
                opacity: 0.9;
                filter: blur(0px);
            }
            100% {
                opacity: 1;
                transform: translateZ(0) scale(1) rotateX(0deg);
                filter: blur(0px);
            }
        }

        /* 三个点独立跳动 */
        .dots-container {
            display: inline-block;
            opacity: 0;
            animation: dotsFadeIn 0.5s ease 0.8s forwards;
            margin-left: 0.1em;
        }
        @keyframes dotsFadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .dot {
            display: inline-block;
            animation: dotJump 0.8s ease-in-out infinite alternate;
            margin: 0 0.02em;
        }
        .dot:nth-child(1) { animation-delay: 0.0s; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotJump {
            0% { transform: translateY(0); opacity: 0.3; }
            100% { transform: translateY(-8px); opacity: 1; }
        }

        /* 下划线 */
        #title-underline {
            flex-shrink: 0;
            width: clamp(60px, 20vw, 160px);
            height: 1px;
            margin-top: 1.2rem;
            background: linear-gradient(90deg, transparent, var(--void-primary), transparent);
            opacity: 0;
            animation: lineFadeIn 1.2s ease-out 1.2s forwards;
            box-shadow: 0 0 12px var(--void-primary-glow);
        }
        @keyframes lineFadeIn {
            0% { opacity: 0; transform: scaleX(0.3); }
            100% { opacity: 0.6; transform: scaleX(1); }
        }

        /* 版本号 */
        #corner-deco {
            position: fixed;
            bottom: 1.2rem;
            right: 1.5rem;
            z-index: 3;
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            color: rgba(143, 185, 145, 0.15);
            font-weight: 300;
            pointer-events: none;
            animation: cornerFade 3s ease-out 2s forwards;
            opacity: 0;
        }
        @keyframes cornerFade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* ============================================================
           5. 黑屏遮罩（用于跳转过渡）
           ============================================================ */
        #blackout {
            position: fixed;
            inset: 0;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            transition: opacity 1s ease;
        }
        #blackout.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* ============================================================
           6. 响应式
           ============================================================ */
        @media (max-width: 480px) {
            #eye-wrapper { width: 60px; height: 60px; margin-bottom: 1.6rem; }
            .title-stage { font-size: clamp(1.8rem, 12vw, 2.6rem); letter-spacing: 0.06em; }
            #title-container { min-height: 4.5rem; }
            #terminal-overlay { font-size: 8px; max-width: 80vw; max-height: 50vh; }
            #terminal-overlay .ascii-art { font-size: 7px; }
        }
        @media (min-width: 768px) {
            #eye-wrapper { width: 100px; height: 100px; margin-bottom: 2.8rem; }
            .title-stage { font-size: clamp(3rem, 6vw, 5rem); }
            #title-container { min-height: 7rem; }
        }

        @supports (padding: max(0px)) {
            #corner-deco { bottom: max(1.2rem, env(safe-area-inset-bottom, 0.5rem)); }
            #terminal-overlay { bottom: max(1.2rem, env(safe-area-inset-bottom, 0.5rem)); }
        }

        /* 减少动画偏好 */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .char { opacity: 1 !important; transform: none !important; filter: none !important; animation: none !important; }
            .dot { animation: none !important; transform: none !important; opacity: 1 !important; }
            .dots-container { opacity: 1 !important; animation: none !important; }
            .title-stage { opacity: 1 !important; pointer-events: auto !important; }
            .title-stage:not(.active) { display: none; }
            .line { opacity: 1 !important; transform: none !important; }
            .line-enter, .line-exit { animation: none !important; }
            #terminal-overlay { opacity: 1; animation: none; }
            #terminal-overlay.hidden { opacity: 0 !important; }
            #title-underline { opacity: 0.6; animation: none; }
            #corner-deco { opacity: 1; animation: none; }
            #blackout { transition: none; }
            #blackout.active { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- 背景 -->
    <div id="bg-layer" aria-hidden="true"></div>

    <!-- Canvas 粒子 -->
    <canvas id="particle-canvas" aria-hidden="true"></canvas>

    <!-- 终端输出 -->
    <div id="terminal-overlay" aria-hidden="true">
        <div id="terminal-output"></div>
    </div>

    <!-- 主内容 -->
    <div id="container">

        <!-- 虚空之眼 -->
        <div id="eye-wrapper" aria-hidden="true">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle class="eye-ring" cx="50" cy="50" r="42"
                stroke="var(--void-primary)" stroke-width="0.8"
                stroke-dasharray="4 8" opacity="0.5" />
                <circle class="eye-ring" cx="50" cy="50" r="36"
                stroke="var(--void-primary)" stroke-width="0.5"
                stroke-dasharray="2 12" opacity="0.3" />
                <polygon class="eye-diamond" points="50,18 74,50 50,82 26,50"
                stroke="var(--void-primary)" stroke-width="1.2"
                stroke-linejoin="round" opacity="0.7" />
                <polygon class="eye-diamond" points="50,26 66,50 50,74 34,50"
                stroke="var(--void-primary)" stroke-width="0.5"
                stroke-linejoin="round" opacity="0.3"
                style="animation-direction: reverse; animation-duration: 4s;" />
                <circle class="eye-dot" cx="50" cy="50" r="3.5"
                fill="var(--void-primary)" opacity="0.9" />
                <circle cx="50" cy="12" r="1.2" fill="var(--void-primary)" opacity="0.25" />
                <circle cx="88" cy="50" r="1.2" fill="var(--void-primary)" opacity="0.25" />
                <circle cx="50" cy="88" r="1.2" fill="var(--void-primary)" opacity="0.25" />
                <circle cx="12" cy="50" r="1.2" fill="var(--void-primary)" opacity="0.25" />
            </svg>
        </div>

        <!-- 文案轮播 -->
        <div id="title-container">

            <!-- 阶段1 -->
            <div id="stage1" class="title-stage active animate-char">
                <span class="char">接</span>
                <span class="char">入</span>
                <span class="char">虚</span>
                <span class="char">空</span>
                <span class="char">中</span>
                <span class="dots-container">
                    <span class="dot">.</span>
                    <span class="dot">.</span>
                    <span class="dot">.</span>
                </span>
            </div>

            <!-- 阶段2 -->
            <div id="stage2" class="title-stage">
                <span class="char">连</span>
                <span class="char">接</span>
                <span class="char">已</span>
                <span class="char">确</span>
                <span class="char">认</span>
            </div>

            <!-- 阶段3 (改为不可直接跳转，由JS控制) -->
            <a id="stage3" class="title-stage" href="javascript:void(0)">
                <span class="char">点</span>
                <span class="char">击</span>
                <span class="char">登</span>
                <span class="char">录</span>
            </a>

        </div>

        <!-- 下划线 -->
        <div id="title-underline" aria-hidden="true"></div>

        <!-- 版本号 -->
        <div id="corner-deco" aria-hidden="true">VOID · 0.2</div>
    </div>

    <!-- 黑屏遮罩 -->
    <div id="blackout"></div>

    <!-- ============================================================
       JavaScript
       ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ---------- 粒子系统 ----------
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            const PARTICLE_COUNT = 48;
            const MAX_SPEED = 0.25;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }

            function createParticles() {
                particles = [];
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    particles.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: (Math.random() - 0.5) * MAX_SPEED * 2,
                        vy: (Math.random() - 0.5) * MAX_SPEED * 2,
                        radius: 0.8 + Math.random() * 1.6,
                        alpha: 0.08 + Math.random() * 0.25,
                        pulse: Math.random() * Math.PI * 2,
                        pulseSpeed: 0.008 + Math.random() * 0.015,
                    });
                }
            }

            function drawParticles() {
                ctx.clearRect(0, 0, width, height);
                for (const p of particles) {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.pulse += p.pulseSpeed;
                    if (p.x < 0) p.x = width;
                    if (p.x > width) p.x = 0;
                    if (p.y < 0) p.y = height;
                    if (p.y > height) p.y = 0;
                    const pulseAlpha = p.alpha * (0.6 + 0.4 * Math.sin(p.pulse));
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(143, 185, 145, ${pulseAlpha})`;
                    ctx.shadowColor = 'rgba(143, 185, 145, 0.15)';
                    ctx.shadowBlur = 12;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    if (p.radius > 1.6) {
                        ctx.beginPath();
                        ctx.arc(p.x - p.vx * 3, p.y - p.vy * 3, p.radius * 0.4, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(143, 185, 145, ${pulseAlpha * 0.2})`;
                        ctx.fill();
                    }
                }
                requestAnimationFrame(drawParticles);
            }

            function initParticles() {
                resize();
                createParticles();
                drawParticles();
            }

            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function() {
                    resize();
                    createParticles();
                }, 200);
            });

            // ---------- 文案轮播 ----------
            const stage1 = document.getElementById('stage1');
            const stage2 = document.getElementById('stage2');
            const stage3 = document.getElementById('stage3');
            const terminalOverlay = document.getElementById('terminal-overlay');
            const outputEl = document.getElementById('terminal-output');

            function showStage(stage) {
                [stage1, stage2, stage3].forEach(el => {
                    el.classList.remove('active');
                    el.classList.remove('animate-char');
                });
                stage.classList.add('active');
                void stage.offsetWidth;
                stage.classList.add('animate-char');
            }

            // ---------- 终端输出控制 ----------
            const logLines = [
                '██╗  ██╗     ██╗   ██╗    ██╗  ██╗     ██╗   ██╗    ███████╗',
                '██║ ██╔╝    ██║   ██║    ██║ ██╔╝    ██║   ██║    ╚══███╔╝',
                '█████╔╝     ██║   ██║    █████╔╝     ██║   ██║      ███╔╝ ',
                '██╔═██╗     ██║   ██║    ██╔═██╗     ██║   ██║     ███╔╝  ',
                '██║  ██╗    ╚██████║    ██║  ██╗    ╚██████║    ███████╗',
                '╚═╝  ╚═╝     ╚═════╝     ╚═╝  ╚═╝     ╚═════╝     ╚══════╝',
                '[SYSTEM] VoidOS kernel v0.2 initialized.',
                '[INFO]  Detected Void Terminal hardware interface.',
                '[INFO]  Memory self-test passed.',
                '[WARN]  High latency to Irminsul (World Tree) detected.',
                '[INFO]  Neural link handshake successful.',
                '[OK]    Environment variables loaded.',
                '[INFO]  Loading void mapping table...',
                '[OK]    Void identity loaded.',
                '[INFO]  System ready. Awaiting login command.'
            ];

            let lineIndex = 0;
            let stopOutput = false;
            let outputTimer = null;

            function appendNextLine() {
                if (stopOutput) return;
                if (lineIndex < logLines.length) {
                    const line = logLines[lineIndex];
                    const isAscii = line.includes('█') || line.includes('╔') || line.includes('╝') || line.includes('═');
                    const span = document.createElement('div');
                    span.textContent = line;
                    span.className = 'line';
                    if (isAscii) {
                        span.classList.add('ascii-art');
                    }
                    outputEl.appendChild(span);
                    requestAnimationFrame(() => {
                        span.classList.add('line-enter');
                    });
                    lineIndex++;
                    const delay = 150 + Math.random() * 300;
                    outputTimer = setTimeout(appendNextLine, delay);
                }
            }

            function hideTerminal() {
                stopOutput = true;
                if (outputTimer) {
                    clearTimeout(outputTimer);
                    outputTimer = null;
                }
                const lines = outputEl.querySelectorAll('.line');
                lines.forEach(line => {
                    line.classList.remove('line-enter');
                    line.classList.add('line-exit');
                });
                setTimeout(() => {
                    terminalOverlay.classList.add('hidden');
                }, 400);
            }

            // ---------- 跳转动画 (黑屏过渡) ----------
            const blackout = document.getElementById('blackout');
            let isNavigating = false; // 防止多次点击

            function navigateWithBlackout() {
                if (isNavigating) return;
                isNavigating = true;

                // 触发黑屏过渡 (1s 渐黑)
                blackout.classList.add('active');

                // 1s 过渡 + 0.5s 等待 = 1.5s 后跳转
                setTimeout(function() {
                    window.location.href = 'TableTop.html';
                }, 1500);
            }

            // ---------- 启动时间线 ----------
            // 阶段1：8s，然后阶段2 + 隐藏终端
            setTimeout(function() {
                showStage(stage2);
                hideTerminal();

                // 2s后显示阶段3
                setTimeout(function() {
                    showStage(stage3);
                    stage3.classList.add('clickable');
                }, 2000);
            }, 8000);

            // ---------- 阶段3点击事件 (使用自定义跳转) ----------
            stage3.addEventListener('click', function(e) {
                e.preventDefault(); // 阻止默认跳转 (href="javascript:void(0)")
                if (navigator.vibrate) navigator.vibrate(12);
                navigateWithBlackout();
            });

            // ---------- 启动粒子与终端输出 ----------
            if (document.readyState === 'complete') {
                initParticles();
            } else {
                window.addEventListener('load', initParticles);
            }

            setTimeout(appendNextLine, 1500);

            console.log('🟢 VoidOS · 虚空终端 (绿色版) 已启动');
        })();
    </script>

</body>
</html>
