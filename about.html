<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我 · Kukuz</title>
    <style>
        /* ---------- 全局重置 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, -apple-system, sans-serif;
            background: url('background.webp') no-repeat center center / cover;
            background-attachment: fixed;
            background-color: #1a2e1a;
            padding: 20px;
        }

        /* ---------- UI 卡片 ---------- */
        .card {
            max-width: 820px;
            width: 100%;
            padding: 2.8rem 2.8rem;
            border-radius: 2rem;
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: background 0.3s, color 0.3s, border-color 0.3s;
            animation: fadeUp 0.8s ease-out both;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(24px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ---------- 亮色模式（白绿） ---------- */
        @media (prefers-color-scheme: light) {
            .card {
                background: rgba(255, 255, 255, 0.68);
                color: #1a3b1a;
                border-color: rgba(80, 160, 80, 0.25);
                box-shadow: 0 20px 60px rgba(0, 40, 0, 0.15);
            }
            .card h1 { color: #1a4f1a; }
            .card .sub { color: #2d5e2d; }
            .card .divider { background: rgba(60, 140, 60, 0.2); }
            .tag { background: rgba(27, 94, 32, 0.10); color: #1a4f1a; }
            .greeting { color: #2d5e2d; }
            .highlight-big { color: #1a4f1a; }
            .footer-meta { color: #3d6b3d; }
        }

        /* ---------- 深色模式（黑与深绿） ---------- */
        @media (prefers-color-scheme: dark) {
            .card {
                background: rgba(10, 20, 10, 0.72);
                color: #c8e6c9;
                border-color: rgba(60, 140, 60, 0.3);
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            }
            .card h1 { color: #a5d6a7; }
            .card .sub { color: #81c784; }
            .card .divider { background: rgba(100, 200, 100, 0.15); }
            .tag { background: rgba(102, 187, 106, 0.15); color: #a5d6a7; }
            .greeting { color: #81c784; }
            .highlight-big { color: #a5d6a7; }
            .footer-meta { color: #6f9e76; }
        }

        /* ---------- 卡片头部 ---------- */
        .card h1 {
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            margin-bottom: 0.2rem;
            text-align: center;
        }
        .card .sub {
            font-size: 1.1rem;
            font-weight: 400;
            opacity: 0.9;
            text-align: center;
            margin-bottom: 0.2rem;
        }
        .card .divider {
            width: 80px;
            height: 3px;
            border-radius: 4px;
            margin: 0.8rem auto 1.8rem;
        }

        /* ---------- 导航菜单 ---------- */
        .nav-menu {
            display: flex;
            justify-content: center;
            gap: 1.8rem;
            margin: 0.2rem 0 1.6rem 0;
            flex-wrap: wrap;
        }
        .nav-link {
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            padding: 0.3rem 0.2rem;
            border-bottom: 2px solid transparent;
            transition: all 0.25s ease;
            color: inherit;
            opacity: 0.75;
        }
        .nav-link:hover {
            opacity: 1;
            border-bottom-color: currentColor;
            transform: translateY(-1px);
        }
        .nav-link.active {
            opacity: 1;
            border-bottom-color: currentColor;
            font-weight: 600;
        }

        /* ---------- 标签区 ---------- */
        .tags-wrap {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem 0.9rem;
            margin-bottom: 2rem;
        }
        .tag {
            display: inline-block;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.3rem 1.2rem;
            border-radius: 2rem;
            letter-spacing: 0.3px;
            border: 1px solid transparent;
            transition: transform 0.2s;
        }
        .tag:hover {
            transform: translateY(-2px);
        }

        /* ---------- 正文内容 ---------- */
        .content {
            text-align: left;
            line-height: 1.9;
            font-size: 1.05rem;
        }
        .content p {
            margin-bottom: 1.2rem;
        }
        .content p:last-child {
            margin-bottom: 0;
        }

        .greeting {
            font-weight: 500;
            font-size: 1.1rem;
        }

        /* 划掉 + 大字 特效 */
        .strikethrough {
            text-decoration: line-through;
            opacity: 0.5;
            margin-right: 0.3rem;
        }
        .highlight-big {
            font-size: 1.8rem;
            font-weight: 700;
            display: inline-block;
            line-height: 1.4;
            letter-spacing: 1px;
        }

        /* 底部寄语 */
        .footer-meta {
            margin-top: 1.8rem;
            text-align: center;
            font-size: 0.95rem;
            opacity: 0.75;
            border-top: 1px solid rgba(128, 128, 128, 0.12);
            padding-top: 1.4rem;
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 600px) {
            .card {
                padding: 2rem 1.5rem;
                border-radius: 1.5rem;
            }
            .card h1 { font-size: 2rem; }
            .content { font-size: 0.98rem; }
            .highlight-big { font-size: 1.4rem; }
            .nav-menu { gap: 1rem; }
            .nav-link { font-size: 0.9rem; }
            .tag { font-size: 0.8rem; padding: 0.2rem 0.9rem; }
        }

        @media (max-width: 400px) {
            .card { padding: 1.5rem 1rem; }
            .card h1 { font-size: 1.7rem; }
            .highlight-big { font-size: 1.2rem; }
            .content { font-size: 0.92rem; }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 标题 -->
        <h1>📖 关于我</h1>
        <div class="sub">— 最畜的贤者 —</div>
        <div class="divider"></div>

        <!-- 导航 -->
        <div class="nav-menu">
            <a href="index.html" class="nav-link">🏠 首页</a>
            <a href="#" class="nav-link active">📖 关于</a>
            <a href="contact.html" class="nav-link">📇 联系方式</a>
        </div>

        <!-- 标签区 -->
        <div class="tags-wrap">
            <span class="tag">📱 安卓搞机党</span>
            <span class="tag">👀 小书虫3k+h</span>
            <span class="tag">🗡️ 原神老登</span>
            <span class="tag">🌱 纳西妲狂热粉</span>
            <span class="tag">✍️ 同人小说作者</span>
        </div>

        <!-- 正文 -->
        <div class="content">
            <p class="greeting">👋 致来访者：</p>
            <p>
                欢迎来到我的个人站点。作为刚完成九年义务教育的毕业生，目前正在假期内
                <span class="strikethrough">打游戏</span>
                <span class="highlight-big">学习各种知识</span>。
            </p>
            <p>
                在这个互联网信息爆炸的时代，我们能找到各种各样<span style="opacity:0.6;">（？）</span>的资源。
                但我还是希望能通过这个小站，把我折腾过的东西、写过的文、玩过的冷门游戏分享给你。
            </p>
            <p>
                站内资源均免费分享，如果有帮到你，点个赞 / 加个星就是对我最大的鼓励。<br>
                愿我们都能在赛博世界里找到自己的快乐！ ✨
            </p>
        </div>

        <!-- 底部 -->
        <div class="footer-meta">
            🌟 保持好奇 · 保持热爱
        </div>
    </div>

</body>
</html>
