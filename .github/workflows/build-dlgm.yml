name: Build DLGM with WebGAL

on:
  push:
    branches: [main]
    paths:
      - 'Gamecurrently/DLGM/game/**'
      - 'Gamecurrently/DLGM/custom-icons/**'
      - '.github/workflows/build-dlgm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dlgm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WebGAL engine
        run: |
          curl -sL -o /tmp/webgal.zip https://github.com/OpenWebGAL/WebGAL/releases/download/4.6.4/WebGAL-4.6.4-web.zip
          unzip -q /tmp/webgal.zip -d /tmp/webgal

      - name: Clean demo assets
        run: |
          cd /tmp/webgal
          rm -rf game/vocal/* game/bgm/* game/figure/* game/background/* game/scene/* game/animation/*

      - name: Assemble game content
        run: |
          # 复制用户维护的游戏内容
          cp -r Gamecurrently/DLGM/game/* /tmp/webgal/game/
          # 兼容旧目录：把平铺在 DLGM 根目录的图片整理进 background（首次构建后建议直接放 game/background/）
          cp -n Gamecurrently/DLGM/*.webp /tmp/webgal/game/background/ 2>/dev/null || true
          cp -n Gamecurrently/DLGM/*.jpg /tmp/webgal/game/background/ 2>/dev/null || true
          cp -n Gamecurrently/DLGM/*.png /tmp/webgal/game/background/ 2>/dev/null || true

      - name: Deploy engine to repo
        run: |
          rm -rf Gamecurrently/DLGM/assets Gamecurrently/DLGM/icons Gamecurrently/DLGM/game
          cp -r /tmp/webgal/assets Gamecurrently/DLGM/assets
          cp -r /tmp/webgal/icons Gamecurrently/DLGM/icons
          cp -r /tmp/webgal/game Gamecurrently/DLGM/game
          cp -f /tmp/webgal/index.html Gamecurrently/DLGM/index.html
          cp -f /tmp/webgal/manifest.json Gamecurrently/DLGM/manifest.json
          cp -f /tmp/webgal/webgal-engine.json Gamecurrently/DLGM/webgal-engine.json
          cp -f /tmp/webgal/webgal-serviceworker.js Gamecurrently/DLGM/webgal-serviceworker.js

      - name: Generate icons from cover
        run: |
          SRC="Gamecurrently/DLGM/game/background/DLGM-start.webp"
          [ -f "$SRC" ] || SRC="Gamecurrently/DLGM/DLGM-start.webp"
          if [ -f "$SRC" ]; then
            python3 -m venv /tmp/venv
            /tmp/venv/bin/pip install -q pillow
            SRC="$SRC" /tmp/venv/bin/python3 << 'PYEOF'
import os
from PIL import Image
import statistics

src = os.environ['SRC']
im = Image.open(src).convert('RGB')
w, h = im.size
s = min(w, h)
im = im.crop(((w-s)//2, (h-s)//2, (w-s)//2+s, (h-s)//2+s))

# favicon.ico 多尺寸 (16/32/48)
im.resize((48,48), Image.LANCZOS).save('Gamecurrently/DLGM/icons/favicon.ico', sizes=[(16,16),(32,32),(48,48)])
# 常规图标
for size in (180, 192, 512):
    im.resize((size,size), Image.LANCZOS).save(f'Gamecurrently/DLGM/icons/icon-{size}.png')
im.resize((180,180), Image.LANCZOS).save('Gamecurrently/DLGM/icons/apple-touch-icon.png')
# maskable 图标（内容 60% 居中，背景取角落平均色）
corners = [im.getpixel((2,2)), im.getpixel((s-3,2)), im.getpixel((2,s-3)), im.getpixel((s-3,s-3))]
bg = tuple(int(statistics.mean(c[i] for c in corners)) for i in range(3))
for size in (192, 512):
    canvas = Image.new('RGBA', (size,size), bg+(255,))
    inner = im.resize((int(size*0.6), int(size*0.6)), Image.LANCZOS)
    canvas.paste(inner, ((size-inner.width)//2, (size-inner.height)//2))
    canvas.convert('RGB').save(f'Gamecurrently/DLGM/icons/icon-{size}-maskable.png')
print('icons generated from', src)
PYEOF
          fi
          # 全站根目录统一 favicon（若无自定义则沿用游戏图标）
          if [ -f Gamecurrently/DLGM/icons/favicon.ico ] && [ ! -f favicon.ico ]; then
            cp Gamecurrently/DLGM/icons/favicon.ico favicon.ico
            echo "root favicon set"
          fi

      - name: Apply custom icons (override)
        run: |
          # 若存在 custom-icons 目录，则用其中的文件覆盖同名图标
          if [ -d Gamecurrently/DLGM/custom-icons ]; then
            cp -f Gamecurrently/DLGM/custom-icons/* Gamecurrently/DLGM/icons/ 2>/dev/null || true
            echo "custom-icons applied"
          fi

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "[skip ci] build DLGM with WebGAL 4.6.4"
          fi
          if ! git push origin HEAD:main; then
            echo "push rejected, syncing with remote and retrying"
            git fetch origin
            git reset --hard origin/main
            rm -rf Gamecurrently/DLGM/assets Gamecurrently/DLGM/icons Gamecurrently/DLGM/game
            cp -r /tmp/webgal/assets Gamecurrently/DLGM/assets
            cp -r /tmp/webgal/icons Gamecurrently/DLGM/icons
            cp -r /tmp/webgal/game Gamecurrently/DLGM/game
            cp -f /tmp/webgal/index.html Gamecurrently/DLGM/index.html
            cp -f /tmp/webgal/manifest.json Gamecurrently/DLGM/manifest.json
            cp -f /tmp/webgal/webgal-engine.json Gamecurrently/DLGM/webgal-engine.json
            cp -f /tmp/webgal/webgal-serviceworker.js Gamecurrently/DLGM/webgal-serviceworker.js
            git add -A
            git commit -m "[skip ci] build DLGM with WebGAL 4.6.4" || true
            git push origin HEAD:main
          fi
