    <style>
        /* ===== 控制栏样式（同 about.html） ===== */
        .bottom-controls {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1500;
            display: flex;
            gap: 0.6rem;
            align-items: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        .bottom-controls.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .ctrl-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            opacity: 0.6;
            font-family: inherit;
            line-height: 1;
            padding: 0;
            background: var(--settings-bg, rgba(10,20,10,0.6));
            color: var(--text-color, #c8e6c9);
            border-color: var(--border-color, rgba(255,255,255,0.15));
        }
        .ctrl-btn:hover {
            opacity: 1;
            transform: scale(1.08);
        }
        .ctrl-btn.settings-btn:hover {
            transform: scale(1.08) rotate(60deg);
        }
        .ctrl-btn.hide-btn:hover {
            transform: scale(1.08) rotate(0deg);
        }
        .ctrl-btn.hide-btn.active {
            background: rgba(231, 76, 60, 0.3);
            border-color: #e74c3c;
            opacity: 0.8;
        }

        body.ui-hidden .card {
            opacity: 0 !important;
            pointer-events: none !important;
        }
        body.ui-hidden .settings-overlay:not(.active) {
            opacity: 0 !important;
            pointer-events: none !important;
        }
        body.ui-hidden .settings-overlay.active {
            opacity: 1 !important;
            pointer-events: auto !important;
        }
        body.ui-hidden .bottom-controls {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        .settings-overlay {
            position: fixed;
            inset: 0;
            z-index: 1600;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            animation: overlayIn 0.25s ease-out;
        }
        .settings-overlay.active {
            display: flex;
        }
        @keyframes overlayIn {
            0% { opacity: 0; backdrop-filter: blur(0px); }
            100% { opacity: 1; backdrop-filter: blur(6px); }
        }
        .settings-panel {
            max-width: 420px;
            width: 90%;
            padding: 2rem 2rem 1.8rem;
            border-radius: 1.8rem;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 90vh;
            overflow-y: auto;
            text-align: center;
            background: var(--settings-panel-bg, rgba(12,22,12,0.92));
            border-color: var(--settings-panel-border, rgba(255,255,255,0.06));
        }
        @keyframes modalPop {
            0% { transform: scale(0.92) translateY(16px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .settings-panel .panel-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
            color: var(--text-color, #c8e6c9);
        }
        .settings-panel .panel-sub {
            font-size: 0.85rem;
            opacity: 0.4;
            margin-bottom: 1.2rem;
            color: var(--text-color, #c8e6c9);
        }
        .settings-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }
        .settings-group label {
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0.6;
            display: block;
            margin-bottom: 0.4rem;
            color: var(--text-color, #c8e6c9);
        }
        .settings-group .options {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .settings-group .options .opt-btn {
            padding: 0.3rem 1.2rem;
            border-radius: 2rem;
            border: 1px solid rgba(128,128,128,0.15);
            background: transparent;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0.5;
            color: var(--text-color, #c8e6c9);
        }
        .settings-group .options .opt-btn:hover {
            opacity: 0.8;
            background: rgba(128,128,128,0.05);
        }
        .settings-group .options .opt-btn.active {
            opacity: 1;
            border-color: currentColor;
            background: rgba(128,128,128,0.08);
        }
        .settings-panel .panel-actions {
            display: flex;
            gap: 0.6rem;
            justify-content: flex-end;
            margin-top: 0.8rem;
        }
        .settings-panel .panel-actions .btn-secondary {
            background: transparent;
            border: 1px solid rgba(128,128,128,0.15);
            color: var(--text-color, #c8e6c9);
            padding: 0.4rem 1.4rem;
            border-radius: 2rem;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .settings-panel .panel-actions .btn-secondary:hover {
            background: rgba(128,128,128,0.06);
        }

        html[data-bg="food"] { --bg-image: url('background1.webp'); }

        html[data-bg="electric1"] { --bg-image: url('background3.webp'); }

        @media (max-width: 480px) {

            .ctrl-btn { width: 38px; height: 38px; font-size: 0.9rem; }
            .settings-panel { padding: 1.5rem; }
        }
    </style>
</head>

    <script src="script.js"></script>
    <script>
        (function() {
            const bottomControls = document.getElementById('bottomControls');
            setTimeout(function() { bottomControls.classList.add('show'); }, 800);

            const htmlRoot = document.getElementById('htmlRoot') || document.documentElement;
            const settingsToggle = document.getElementById('settingsToggle');
            const settingsOverlay = document.getElementById('settingsOverlay');
            const settingsClose = document.getElementById('settingsClose');
            const themeOptions = document.getElementById('themeOptions');
            const bgOptions = document.getElementById('bgOptions');

            function loadSettings() {
                try { const saved = localStorage.getItem('siteSettings'); if (saved) return JSON.parse(saved); } catch (e) {}
                return { theme: 'default', bg: 'default' };
            }

            function saveSettings(settings) {
                try { localStorage.setItem('siteSettings', JSON.stringify(settings)); } catch (e) {}
            }

            function applySettings(settings) {
                const theme = settings.theme || 'default';
                htmlRoot.removeAttribute('data-theme');
                if (theme !== 'default') htmlRoot.setAttribute('data-theme', theme);
                document.querySelectorAll('#themeOptions .opt-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.theme === theme);
                });
                const bg = settings.bg || 'default';
                htmlRoot.removeAttribute('data-bg');
                if (bg !== 'default') htmlRoot.setAttribute('data-bg', bg);
                document.querySelectorAll('#bgOptions .opt-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.bg === bg);
                });
            }

            function openSettings() {
                applySettings(loadSettings());
                settingsOverlay.classList.add('active');
                document.body.classList.add('modal-open');
            }

            function closeSettings() {
                settingsOverlay.classList.remove('active');
                document.body.classList.remove('modal-open');
            }

            settingsToggle.addEventListener('click', openSettings);
            settingsClose.addEventListener('click', closeSettings);
            settingsOverlay.addEventListener('click', function(e) {
                if (e.target === settingsOverlay) closeSettings();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && settingsOverlay.classList.contains('active')) closeSettings();
            });

            themeOptions.addEventListener('click', function(e) {
                const btn = e.target.closest('.opt-btn');
                if (!btn) return;
                const settings = loadSettings();
                settings.theme = btn.dataset.theme;
                saveSettings(settings);
                applySettings(settings);
            });

            bgOptions.addEventListener('click', function(e) {
                const btn = e.target.closest('.opt-btn');
                if (!btn) return;
                const settings = loadSettings();
                settings.bg = btn.dataset.bg;
                saveSettings(settings);
                applySettings(settings);
            });

            applySettings(loadSettings());

            const hideToggle = document.getElementById('hideToggle');
            let isHidden = false;
            hideToggle.addEventListener('click', function() {
                isHidden = !isHidden;
                document.body.classList.toggle('ui-hidden', isHidden);
                this.textContent = isHidden ? '👁️‍🗨️' : '👁️';
                this.classList.toggle('active', isHidden);
                this.title = isHidden ? '显示所有UI' : '隐藏所有UI，只看背景';
            });
        })();
    </script>
