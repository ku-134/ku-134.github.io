<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>幻影红包 · 永不抵达的100元</title>
    <style>
        :root {
            --red: #D42020;
            --dark-red: #8B0000;
            --gold: #FFD700;
            --gold-dark: #B8860B;
            --bg: #1a0000;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(ellipse at 50% 30%, #4a1010 0%, #1a0000 60%, #0a0000 100%);
        }
        .barrage-area {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 36px;
            z-index: 10;
            overflow: hidden;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
        }
        .barrage-track {
            display: flex;
            gap: 40px;
            animation: scroll-left 20s linear infinite;
            white-space: nowrap;
        }
        @keyframes scroll-left {
            0% {
                transform: translateX(100vw)
            }
            100% {
                transform: translateX(-100%)
            }
        }
        .barrage-item {
            color: #ffd700;
            font-size: 13px;
            opacity: 0.85;
            text-shadow: 0 0 6px rgba(255, 215, 0, 0.4);
        }
        .main {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 50px 20px 30px;
        }
        .stage-tag {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 8px;
            background: rgba(255, 215, 0, 0.15);
            color: var(--gold);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .value-wrap {
            text-align: center;
            margin: 12px 0;
        }
        .value-label {
            color: #e8b8b8;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .value-main {
            font-size: clamp(48px, 10vmin, 72px);
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5), 0 0 60px rgba(255, 215, 0, 0.2);
            animation: heartbeat 1s ease-in-out infinite;
            line-height: 1.1;
        }
        .value-unit {
            font-size: clamp(18px, 3.5vmin, 26px);
            color: var(--gold);
        }
        .value-sub {
            color: #d4956b;
            font-size: 13px;
            margin-top: 6px;
        }
        @keyframes heartbeat {
            0%,
            100% {
                transform: scale(1)
            }
            25% {
                transform: scale(1.06)
            }
            50% {
                transform: scale(1)
            }
            75% {
                transform: scale(1.04)
            }
        }
        .progress-wrap {
            width: 100%;
            max-width: 320px;
            margin: 10px 0;
        }
        .progress-outer {
            width: 100%;
            height: 14px;
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
            position: relative;
        }
        .progress-inner {
            height: 100%;
            border-radius: 7px;
            background: linear-gradient(90deg, #f9a825, #ffd700, #ffab00);
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .progress-inner::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            width: 20px;
            height: 100%;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 7px;
        }
        .progress-text {
            text-align: center;
            color: #ffd700;
            font-size: 12px;
            margin-top: 4px;
        }
        .horse-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-width: 300px;
            width: 100%;
            margin: 10px 0;
        }
        .horse-cell {
            aspect-ratio: 1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }
        .horse-cell.got {
            background: rgba(255, 215, 0, 0.15);
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.25);
        }
        .steps-wrap {
            width: 100%;
            max-width: 320px;
            margin: 10px 0;
        }
        .step-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            color: #aaa;
            font-size: 14px;
        }
        .step-row .step-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            border: 2px solid #555;
            flex-shrink: 0;
            transition: all 0.3s;
        }
        .step-row.done .step-icon {
            background: rgba(76, 175, 80, 0.2);
            border-color: #4caf50;
            color: #4caf50;
        }
        .step-row.fail .step-icon {
            background: rgba(244, 67, 54, 0.2);
            border-color: #f44336;
            color: #f44336;
        }
        .step-row.active .step-icon {
            border-color: var(--gold);
            color: var(--gold);
            animation: pulse 0.6s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.4)
            }
            50% {
                box-shadow: 0 0 0 8px rgba(255, 215, 0, 0)
            }
        }
        .step-label {
            flex: 1;
            font-size: 13px;
        }
        .copy-text {
            text-align: center;
            color: #ff8c42;
            font-size: 15px;
            font-weight: 600;
            min-height: 24px;
            margin: 8px 0;
            text-shadow: 0 0 8px rgba(255, 140, 66, 0.3);
            animation: fadeInOut 0.5s;
        }
        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translateY(-4px)
            }
            100% {
                opacity: 1;
                transform: translateY(0)
            }
        }
        .btn-wrap {
            width: 100%;
            max-width: 320px;
            margin-top: 8px;
        }
        .main-btn {
            width: 100%;
            padding: 16px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(180deg, #ff5252 0%, #d42020 60%, #a01010 100%);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 24px rgba(255, 50, 50, 0.5), 0 4px 16px rgba(0, 0, 0, 0.3);
            transition: all 0.15s;
            position: relative;
            overflow: hidden;
        }
        .main-btn:active {
            transform: scale(0.96);
        }
        .main-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            animation: none !important;
        }
        .main-btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: ripple 0.6s ease-out;
            pointer-events: none;
        }
        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0
            }
        }
        @keyframes breathe {
            0%,
            100% {
                box-shadow: 0 0 24px rgba(255, 50, 50, 0.5), 0 4px 16px rgba(0, 0, 0, 0.3)
            }
            50% {
                box-shadow: 0 0 40px rgba(255, 50, 50, 0.8), 0 4px 20px rgba(255, 0, 0, 0.4)
            }
        }
        .main-btn:not(:disabled) {
            animation: breathe 2s ease-in-out infinite;
        }
        .main-btn.inviting {
            background: linear-gradient(180deg, #666 0%, #444 60%, #222 100%);
            animation: none !important;
            box-shadow: 0 0 10px rgba(100, 100, 100, 0.3);
        }

        #particleCanvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 80;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.hidden {
            display: none;
        }
        .modal-box {
            background: linear-gradient(160deg, #3d1111, #1a0505);
            border: 2px solid var(--gold);
            border-radius: 18px;
            padding: 24px;
            max-width: 340px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-box h3 {
            color: var(--gold);
            font-size: 18px;
            margin-bottom: 8px;
        }
        .modal-box p {
            color: #d4b896;
            font-size: 14px;
            margin-bottom: 12px;
            line-height: 1.6;
        }
        .modal-box .modal-btn {
            padding: 10px 32px;
            border-radius: 24px;
            border: none;
            background: var(--red);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1px;
        }
        .modal-box .modal-btn:active {
            opacity: 0.8;
        }
        .modal-box .modal-btn.secondary {
            background: #555;
        }
        .flash-red {
            animation: flashRed 0.5s ease-out;
        }
        @keyframes flashRed {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.8)
            }
            100% {
                box-shadow: 0 0 60px 20px rgba(255, 0, 0, 0)
            }
        }
        .hidden {
            display: none !important;
        }

        /* 邀请计数 */
        .invite-counter {
            color: #d4b896;
            font-size: 13px;
            margin-top: 6px;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .invite-counter span {
            color: var(--gold);
            font-weight: 700;
        }

        /* 悬浮小游戏入口 */
        .game-float {
            position: fixed;
            bottom: 100px;
            right: 20px;
            z-index: 60;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b);
            box-shadow: 0 0 30px rgba(255, 50, 50, 0.6), 0 4px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s;
            animation: float-bounce 2s ease-in-out infinite;
            border: 2px solid rgba(255, 215, 0, 0.3);
            user-select: none;
            -webkit-user-select: none;
        }
        .game-float:active {
            transform: scale(0.9);
        }
        .game-float.hidden {
            display: none;
        }
        .game-float .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--gold);
            color: #1a0000;
            font-size: 10px;
            font-weight: 700;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #1a0000;
        }
        @keyframes float-bounce {
            0%,
            100% {
                transform: translateY(0px) scale(1);
            }
            50% {
                transform: translateY(-10px) scale(1.05);
            }
        }

        /* 小游戏内联样式 */
        .game-container {
            padding: 4px 0;
        }
        .game-container .game-title {
            color: var(--gold);
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .game-container .game-status {
            color: #d4b896;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .game-container .game-area {
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .game-container .game-btn {
            padding: 8px 24px;
            border-radius: 20px;
            border: none;
            background: var(--red);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
        }
        .game-container .game-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .game-container .game-btn.secondary {
            background: #555;
        }
        .game-container .game-opt {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .game-container .game-opt button {
            padding: 8px 20px;
            border-radius: 16px;
            border: 2px solid #888;
            background: transparent;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 60px;
        }
        .game-container .game-opt button:hover {
            border-color: var(--gold);
            background: rgba(255, 215, 0, 0.1);
        }
        .game-container .game-opt button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .game-container .game-opt button.correct {
            border-color: #4caf50;
            background: rgba(76, 175, 80, 0.2);
        }
        .game-container .game-opt button.wrong {
            border-color: #f44336;
            background: rgba(244, 67, 54, 0.2);
        }
        .game-container .redpacket-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            width: 100%;
            max-width: 200px;
        }
        .game-container .redpacket-grid .rp {
            aspect-ratio: 1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
            transition: all 0.2s;
            cursor: pointer;
        }
        .game-container .redpacket-grid .rp.caught {
            opacity: 0.2;
            transform: scale(0.8);
            pointer-events: none;
        }
        .game-container .redpacket-grid .rp:not(.caught):active {
            transform: scale(0.85);
        }
        .game-container .slot-machine {
            display: flex;
            gap: 6px;
            font-size: 36px;
            font-weight: 900;
            color: var(--gold);
            margin: 6px 0;
        }
        .game-container .slot-machine .reel {
            width: 50px;
            height: 60px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 215, 0, 0.2);
            transition: all 0.1s;
        }
        .game-container .slot-machine .reel.spinning {
            animation: reel-spin 0.1s steps(1) infinite;
        }
        @keyframes reel-spin {
            0% {
                transform: rotate(0deg) scale(1);
            }
            25% {
                transform: rotate(5deg) scale(1.1);
            }
            75% {
                transform: rotate(-5deg) scale(0.9);
            }
            100% {
                transform: rotate(0deg) scale(1);
            }
        }
        .game-container .slot-result {
            font-size: 20px;
            color: var(--gold);
            font-weight: 700;
            margin-top: 4px;
        }

        /* 横屏适配 */
        @media(orientation:landscape) {
            .main {
                padding: 40px 30px 20px;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 20px;
                justify-content: center;
                align-content: center;
            }
            .value-wrap,
            .progress-wrap,
            .horse-grid,
            .steps-wrap,
            .btn-wrap {
                max-width: 280px;
            }
        }

        /* 小屏适配 */
        @media(max-width:400px) {
            .main {
                padding: 30px 12px 20px;
            }
            .value-main {
                font-size: 40px;
            }
            .horse-grid {
                gap: 5px;
                max-width: 220px;
            }
            .horse-cell {
                font-size: 20px;
                border-radius: 8px;
            }
            .game-float {
                width: 52px;
                height: 52px;
                font-size: 22px;
                bottom: 80px;
                right: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="bg"></div>

    <!-- 弹幕 -->
    <div class="barrage-area">
        <div class="barrage-track" id="barrageTrack"></div>
    </div>

    <!-- 粒子Canvas -->
    <canvas id="particleCanvas"></canvas>

    <!-- 悬浮小游戏入口 -->
    <div class="game-float hidden" id="gameFloat">
        🎮
        <span class="badge">!</span>
    </div>

    <!-- 主内容 -->
    <div class="main" id="mainContainer">

        <div class="stage-tag" id="stageTag">💰 红包金额冲刺</div>

        <div class="value-wrap">
            <div class="value-label" id="valueLabel">当前金额</div>
            <div>
                <span class="value-main" id="valueMain">0.00</span>
                <span class="value-unit" id="valueUnit">元</span>
            </div>
            <div class="value-sub" id="valueSub"></div>
        </div>

        <div class="progress-wrap" id="progressWrap">
            <div class="progress-outer"><div class="progress-inner" id="progressInner" style="width:0%"></div></div>
            <div class="progress-text" id="progressText"></div>
        </div>

        <div class="horse-grid hidden" id="horseGrid"></div>

        <div class="steps-wrap hidden" id="stepsWrap"></div>

        <div class="copy-text" id="copyText">天降横财！再拉一人翻倍！</div>

        <div class="btn-wrap">
            <button class="main-btn" id="mainBtn">🔥 立即邀请好友助力</button>
        </div>

        <!-- 邀请计数 -->
        <div class="invite-counter" id="inviteCounter">已邀请好友：<span id="inviteCountDisplay">0</span> 人</div>
    </div>

    <!-- 弹窗容器 -->
    <div class="modal-overlay hidden" id="modalOverlay">
        <div class="modal-box" id="modalBox"></div>
    </div>

    <script>
        // ==================== 音效引擎 ====================
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function ensureAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playDing() {
            try {
                ensureAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
                osc.frequency.setValueAtTime(2200, audioCtx.currentTime + 0.03);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        function playBuzz() {
            try {
                ensureAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(80, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {}
        }

        function playWin() {
            try {
                ensureAudio();
                const notes = [523, 659, 784, 1047];
                notes.forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.1);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.1 + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + i * 0.1);
                    osc.stop(audioCtx.currentTime + i * 0.1 + 0.15);
                });
            } catch (e) {}
        }

        // ==================== 粒子系统 ====================
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function spawnParticles(count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: canvas.width / 2 + (Math.random() - 0.5) * 200,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 1) * 6 - 4,
                    life: 1,
                    decay: 0.008 + Math.random() * 0.02,
                    size: 3 + Math.random() * 6,
                    color: Math.random() < 0.5 ? '#FFD700' : '#FF5252'
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.life -= p.decay;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // ==================== 弹幕系统 ====================
        const fakeNames = [
            '贵州用户 王**', '广东用户 L***', '四川用户 张**', '湖南用户 陈**',
            '浙江用户 黄**', '湖北用户 赵**', '福建用户 林**', '江苏用户 周**',
            '山东用户 吴**', '河南用户 徐**', '安徽用户 孙**', '江西用户 胡**',
            '辽宁用户 高**', '重庆用户 何**', '云南用户 郭**'
        ];
        const barrageEl = document.getElementById('barrageTrack');

        function initBarrage() {
            let html = '';
            for (let i = 0; i < 8; i++) {
                const name = fakeNames[Math.floor(Math.random() * fakeNames.length)];
                const amount = (Math.random() * 50 + 50).toFixed(0);
                html += `<span class="barrage-item">🎉 ${name} 刚刚提现${amount}元</span>`;
            }
            barrageEl.innerHTML = html + html;
        }
        initBarrage();
        setInterval(() => {
            const name = fakeNames[Math.floor(Math.random() * fakeNames.length)];
            const amount = (Math.random() * 50 + 50).toFixed(0);
            const span = document.createElement('span');
            span.className = 'barrage-item';
            span.textContent = `🎉 ${name} 刚刚提现${amount}元`;
            barrageEl.appendChild(span);
            if (barrageEl.children.length > 20) barrageEl.removeChild(barrageEl.firstChild);
        }, 3000);

        // ==================== 核心状态 ====================
        const STATE = { S1: 'S1', S2: 'S2', S3: 'S3', S4: 'S4', S5: 'S5' };
        let currentState = STATE.S1;

        // 邀请系统
        let inviteCount = 0; // 累计邀请好友数
        let availableInvites = 3; // 可用邀请次数

        // S1
        let s1_money = 0;
        let s1_clicks = 0;

        // S2
        let s2_horses = 0;
        let s2_clicks = 0;
        const horseRewards = [11, 4, 2]; // 前三次分别获得11,4,2匹，之后每次1匹

        // S3
        let s3_step = 0;
        let s3_phase = 'queue'; // queue | fast

        // S4
        let s4_lucky = 5;
        let s4_clicks = 0;
        let s4_boostActive = false;

        // S5
        let s5_step = 0;

        // 小游戏
        let gameActive = false;
        let gameFloatVisible = false;
        let gameFloatTimer = null;

        // DOM引用
        const stageTag = document.getElementById('stageTag');
        const valueLabel = document.getElementById('valueLabel');
        const valueMain = document.getElementById('valueMain');
        const valueUnit = document.getElementById('valueUnit');
        const valueSub = document.getElementById('valueSub');
        const progressWrap = document.getElementById('progressWrap');
        const progressInner = document.getElementById('progressInner');
        const progressText = document.getElementById('progressText');
        const horseGrid = document.getElementById('horseGrid');
        const stepsWrap = document.getElementById('stepsWrap');
        const copyText = document.getElementById('copyText');
        const mainBtn = document.getElementById('mainBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalBox = document.getElementById('modalBox');
        const inviteCountDisplay = document.getElementById('inviteCountDisplay');
        const gameFloat = document.getElementById('gameFloat');

        // ==================== 工具函数 ====================
        function updateInviteDisplay() {
            inviteCountDisplay.textContent = inviteCount;
        }

        function logProgress(visualValue) {
            if (visualValue <= 0) return 0;
            if (visualValue >= 100) return 100;
            if (visualValue <= 50) return visualValue / 50 * 10;
            return 10 + (visualValue - 50) / 50 * 90;
        }

        function updateProgressBar(visualValue) {
            const width = logProgress(visualValue);
            progressInner.style.width = width + '%';
            progressText.textContent = visualValue.toFixed(1) + '%';
        }

        function showModal(title, msg, btnText, callback, btnSecondary) {
            let btns = `<button class="modal-btn" id="modalActionBtn">${btnText}</button>`;
            if (btnSecondary) {
                btns +=
                `<button class="modal-btn secondary" id="modalSecondaryBtn" style="margin-left:10px;">${btnSecondary}</button>`;
            }
            modalBox.innerHTML = `
                <h3>${title}</h3>
                <p>${msg}</p>
                <div style="display:flex;justify-content:center;flex-wrap:wrap;gap:8px;">${btns}</div>
            `;
            modalOverlay.classList.remove('hidden');
            document.getElementById('modalActionBtn').addEventListener('click', () => {
                modalOverlay.classList.add('hidden');
                if (callback) callback();
            });
            const secBtn = document.getElementById('modalSecondaryBtn');
            if (secBtn) {
                secBtn.addEventListener('click', () => {
                    modalOverlay.classList.add('hidden');
                });
            }
        }

        function showModalSimple(title, msg) {
            modalBox.innerHTML = `
                <h3>${title}</h3>
                <p>${msg}</p>
                <button class="modal-btn" id="modalActionBtn">知道了</button>
            `;
            modalOverlay.classList.remove('hidden');
            document.getElementById('modalActionBtn').addEventListener('click', () => {
                modalOverlay.classList.add('hidden');
            });
        }

        function getHorseReward() {
            if (s2_clicks === 0) return horseRewards[0];
            if (s2_clicks === 1) return horseRewards[1];
            if (s2_clicks === 2) return horseRewards[2];
            return 1;
        }

        function getRandomName() {
            return fakeNames[Math.floor(Math.random() * fakeNames.length)];
        }

        // ==================== 邀请系统 ====================
        function doInviteFlow(callback) {
            // 消耗一次可用邀请
            if (availableInvites > 0) {
                availableInvites--;
                if (callback) callback();
                return;
            }

            // 可用邀请为0，弹窗邀请好友
            showModal(
                '👋 邀请好友助力',
                `当前可用邀请次数已用完。<br>点击下方按钮邀请好友，助力成功后获得1次邀请机会！<br><small style="color:#999;">累计已邀请 ${inviteCount} 人</small>`,
                '📨 邀请好友',
                () => {
                    // 开始邀请流程
                    mainBtn.disabled = true;
                    mainBtn.textContent = '⏳ 邀请中...';
                    mainBtn.classList.add('inviting');

                    const delay = 1000 + Math.random() * 2000;
                    setTimeout(() => {
                        const name = getRandomName();
                        availableInvites++;
                        inviteCount++;
                        updateInviteDisplay();
                        mainBtn.disabled = false;
                        mainBtn.classList.remove('inviting');
                        // 恢复按钮文字（由switchUI负责刷新）
                        playDing();
                        showModalSimple('🎉 助力成功', `${name} 为你助力成功！<br>获得1次邀请机会！`);
                        if (callback) callback();
                    }, delay);
                },
                '取消'
            );
        }

        // ==================== UI切换 ====================
        function switchUI(state) {
            progressWrap.classList.add('hidden');
            horseGrid.classList.add('hidden');
            stepsWrap.classList.add('hidden');
            mainBtn.classList.remove('hidden');
            mainBtn.disabled = false;
            mainBtn.classList.remove('inviting');
            valueMain.style.transform = '';

            // 更新邀请计数显示（始终显示）
            updateInviteDisplay();

            if (state === STATE.S1) {
                stageTag.textContent = '💰 红包金额冲刺';
                valueLabel.textContent = '当前金额';
                valueUnit.textContent = '元';
                valueSub.textContent = '';
                progressWrap.classList.remove('hidden');
                updateProgressBar(s1_money / 99.9 * 100);
                const remain = availableInvites > 0 ? `剩余${availableInvites}次` : '需邀请好友';
                mainBtn.textContent = `🔥 邀请助力 (${remain})`;
                valueMain.textContent = s1_money.toFixed(2);
                copyText.textContent = '天降横财！再拉一人翻倍！';
            } else if (state === STATE.S2) {
                stageTag.textContent = '🐴 金马收集结界';
                valueLabel.textContent = '已收集金马';
                valueUnit.textContent = '匹';
                valueSub.textContent = '集齐20匹金马即可提现';
                horseGrid.classList.remove('hidden');
                const remain = availableInvites > 0 ? `剩余${availableInvites}次` : '需邀请好友';
                mainBtn.textContent = `🐴 邀请寻马 (${remain})`;
                valueMain.textContent = s2_horses;
                renderHorseGrid();
                copyText.textContent = '金马狂奔中！好友越多马越多！';
            } else if (state === STATE.S3) {
                stageTag.textContent = '🏦 打提排队中';
                valueLabel.textContent = '排队进度';
                valueUnit.textContent = '';
                valueSub.textContent = '当前提款排队人数过多，为你申请快速通道。幸运值越高，就更可能完成直接提款！';
                stepsWrap.classList.remove('hidden');
                mainBtn.classList.add('hidden');
                valueMain.textContent = '⏳';
                copyText.textContent = '排队中，请稍候...';
                renderStepsS3();
                runS3Sequence();
            } else if (state === STATE.S4) {
                stageTag.textContent = '🍀 幸运值解冻';
                valueLabel.textContent = '当前幸运值';
                valueUnit.textContent = '';
                valueSub.textContent = '满100可解冻打款';
                progressWrap.classList.remove('hidden');
                const remain = availableInvites > 0 ? `剩余${availableInvites}次` : '需邀请好友';
                mainBtn.textContent = `🍀 积攒幸运值 (${remain})`;
                updateProgressBar(s4_lucky);
                valueMain.textContent = s4_lucky.toFixed(2);
                copyText.textContent = '每次邀请都离解冻更近一步！';
            } else if (state === STATE.S5) {
                stageTag.textContent = '🎉 提款机会！';
                valueLabel.textContent = '打款验证';
                valueUnit.textContent = '';
                valueSub.textContent = '你幸运的获得了提款机会！';
                stepsWrap.classList.remove('hidden');
                mainBtn.classList.add('hidden');
                valueMain.textContent = '💎';
                copyText.textContent = '正在为您处理提款...';
                renderStepsS5();
                runS5Sequence();
            }
            updateCopyTextState();
        }

        function updateCopyTextState() {
            // 由各阶段自己控制
        }

        // ==================== S2 金马网格 ====================
        function renderHorseGrid() {
            let html = '';
            for (let i = 0; i < 20; i++) {
                const got = i < s2_horses;
                html += `<div class="horse-cell${got?' got':''}">${got?'🐴':'⬜'}</div>`;
            }
            horseGrid.innerHTML = html;
        }

        // ==================== S3 排队步骤 ====================
        function renderStepsS3() {
            const steps = ['提交提款申请', '排队等待处理', '快速通道审核', '资金准备中', '打款验证'];
            let html = '';
            for (let i = 0; i < 5; i++) {
                let cls = '';
                let icon = i + 1;
                if (i < s3_step) { cls = 'done';
                    icon = '✅'; } else if (i === s3_step && s3_step < 4) { cls = 'active'; } else if (i === 4 && s3_step >=
                    4) { cls = 'fail';
                    icon = '❌'; }
                html += `<div class="step-row${cls?' '+cls:''}">
                    <span class="step-icon">${typeof icon==='number'?icon:icon}</span>
                    <span class="step-label">${steps[i]}${i===4?'（需解冻）':''}</span>
                </div>`;
            }
            stepsWrap.innerHTML = html;
        }

        function runS3Sequence() {
            s3_step = 0;
            renderStepsS3();
            valueMain.textContent = '0/5';

            function advance() {
                if (s3_step < 4) {
                    s3_step++;
                    renderStepsS3();
                    valueMain.textContent = s3_step + '/5';
                    if (s3_step < 4) {
                        setTimeout(advance, 600);
                    } else {
                        setTimeout(() => {
                            valueMain.textContent = '99%';
                            document.getElementById('mainContainer').classList.add('flash-red');
                            setTimeout(() => {
                                document.getElementById('mainContainer').classList.remove(
                                'flash-red');
                                playBuzz();
                                try { navigator.vibrate([50, 50, 50]); } catch (e) {}
                                showModal(
                                    '⚠️ 排队超时',
                                    '当前提款排队人数过多，为你申请快速通道。<br>幸运值越高，就更可能完成直接提款！<br><small style="color:#999;">累计已邀请 ' +
                                    inviteCount + ' 人</small>',
                                    '去积攒幸运值',
                                    () => {
                                        currentState = STATE.S4;
                                        s4_lucky = 5 + Math.min(inviteCount * 0.5, 10);
                                        s4_clicks = 0;
                                        s4_boostActive = false;
                                        switchUI(STATE.S4);
                                    }
                                );
                            }, 500);
                        }, 400);
                    }
                }
            }
            setTimeout(advance, 300);
        }

        // ==================== S5 最终提款 ====================
        function renderStepsS5() {
            const steps = ['✨ 幸运提款通道开启', '💰 金额确认中', '🔐 安全验证', '💳 打款处理', '🎊 提款完成！'];
            let html = '';
            for (let i = 0; i < 5; i++) {
                let cls = '';
                let icon = i + 1;
                if (i < s5_step) { cls = 'done';
                    icon = '✅'; } else if (i === s5_step && s5_step < 4) { cls = 'active'; } else if (i === 4 && s5_step >=
                    4) { cls = 'done';
                    icon = '🎉'; }
                html += `<div class="step-row${cls?' '+cls:''}">
                    <span class="step-icon">${typeof icon==='number'?icon:icon}</span>
                    <span class="step-label">${steps[i]}</span>
                </div>`;
            }
            stepsWrap.innerHTML = html;
        }

        function runS5Sequence() {
            s5_step = 0;
            renderStepsS5();
            valueMain.textContent = '0/5';

            function advance() {
                if (s5_step < 5) {
                    s5_step++;
                    renderStepsS5();
                    valueMain.textContent = s5_step + '/5';
                    if (s5_step < 5) {
                        setTimeout(advance, 700);
                    } else {
                        setTimeout(() => {
                            playWin();
                            spawnParticles(100);
                            showModal(
                                '🎊 活动已结束！',
                                `活动已结束，谢谢你的参与！<br><br><small style="color:#999;">累计邀请好友：${inviteCount} 人</small><br><br>感谢参与「幻影红包」体验！`,
                                '我艹！',
                                () => {
                                    // 回到初始状态
                                    resetAll();
                                }
                            );
                        }, 400);
                    }
                }
            }
            setTimeout(advance, 400);
        }

        // ==================== 重置 ====================
        function resetAll() {
            currentState = STATE.S1;
            s1_money = 0;
            s1_clicks = 0;
            s2_horses = 0;
            s2_clicks = 0;
            s3_step = 0;
            s4_lucky = 5;
            s4_clicks = 0;
            s4_boostActive = false;
            s5_step = 0;
            // 保留邀请次数和累计
            availableInvites = Math.max(availableInvites, 3);
            switchUI(STATE.S1);
            valueMain.textContent = '0.00';
            updateProgressBar(0);
            updateInviteDisplay();
        }

        // ==================== 主按钮点击逻辑 ====================
        function onMainBtnClick() {
            if (mainBtn.disabled) return;

            // 波纹效果
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            const rect = mainBtn.getBoundingClientRect();
            ripple.style.width = ripple.style.height = Math.max(rect.width, rect.height) + 'px';
            ripple.style.left = '50%';
            ripple.style.top = '50%';
            mainBtn.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);

            // 检查可用邀请次数
            if (availableInvites <= 0) {
                doInviteFlow(() => {
                    // 邀请成功后，重新执行当前阶段的点击逻辑
                    executeStageAction();
                });
                return;
            }

            // 有可用邀请，直接执行
            executeStageAction();
        }

        function executeStageAction() {
            // 消耗一次邀请
            if (availableInvites > 0) {
                availableInvites--;
            } else {
                // 实际上不会走到这里，因为上面已经判断了
                return;
            }

            // 更新按钮文字
            updateMainBtnText();

            if (currentState === STATE.S1) doS1Action();
            else if (currentState === STATE.S2) doS2Action();
            else if (currentState === STATE.S4) doS4Action();
        }

        function updateMainBtnText() {
            const remain = availableInvites > 0 ? `剩余${availableInvites}次` : '需邀请好友';
            if (currentState === STATE.S1) {
                mainBtn.textContent = `🔥 邀请助力 (${remain})`;
            } else if (currentState === STATE.S2) {
                mainBtn.textContent = `🐴 邀请寻马 (${remain})`;
            } else if (currentState === STATE.S4) {
                mainBtn.textContent = `🍀 积攒幸运值 (${remain})`;
            }
        }

        // ==================== S1 动作 ====================
        function doS1Action() {
            s1_clicks++;
            let add;
            if (s1_clicks <= 3) add = 25 + Math.random() * 10;
            else if (s1_clicks <= 6) add = 3 + Math.random() * 5;
            else if (s1_clicks <= 10) add = 0.5 + Math.random() * 0.5;
            else add = 0.01 + Math.random() * 0.09;

            s1_money += add;
            if (s1_money > 99.9) s1_money = 99.9;

            if (s1_money >= 99.8) valueSub.textContent = '还差0.1元！';
            else valueSub.textContent = '';

            valueMain.textContent = s1_money.toFixed(2);
            updateProgressBar(s1_money / 99.9 * 100);
            updateMainBtnText();

            if (s1_money >= 99.9) {
                setTimeout(() => {
                    spawnParticles(60);
                    currentState = STATE.S2;
                    s2_horses = 0;
                    s2_clicks = 0;
                    // 根据邀请数给予初始金马
                    const bonus = Math.min(Math.floor(inviteCount / 2), 5);
                    s2_horses = Math.min(bonus, 5);
                    showModal(
                        '🎉 恭喜！',
                        `金额已满99.9元！<br>需集齐20匹金马才能提现。<br>已赠送 ${s2_horses} 匹初始金马，继续邀请好友吧！<br><small style="color:#999;">累计已邀请 ${inviteCount} 人</small>`,
                        '去收集金马',
                        () => {
                            switchUI(STATE.S2);
                        }
                    );
                }, 500);
            } else {
                playDing();
                try { navigator.vibrate(10); } catch (e) {}
            }
        }

        // ==================== S2 动作 ====================
        function doS2Action() {
            s2_clicks++;
            const reward = getHorseReward();
            const actual = Math.min(reward, 20 - s2_horses);
            s2_horses += actual;

            renderHorseGrid();
            valueMain.textContent = s2_horses;
            updateMainBtnText();
            playDing();
            try { navigator.vibrate(10); } catch (e) {}

            if (s2_horses >= 20) {
                setTimeout(() => {
                    spawnParticles(80);
                    currentState = STATE.S3;
                    s3_step = 0;
                    showModal(
                        '🎉 金马集齐！',
                        `20匹金马已全部收集！<br>即将进入打款排队流程...<br><small style="color:#999;">累计已邀请 ${inviteCount} 人</small>`,
                        '开始排队',
                        () => {
                            switchUI(STATE.S3);
                        }
                    );
                }, 400);
            }
        }

        // ==================== S4 动作 ====================
        function doS4Action() {
            s4_clicks++;

            let coeff;
            if (s4_boostActive) {
                coeff = 0.15;
                s4_boostActive = false;
                copyText.textContent = '⚡ 加速卡生效！本次获得大幅增长！';
            } else {
                coeff = 0.05 + Math.random() * 0.1;
            }

            let add;
            if (s4_lucky > 99.9) {
                add = 0.001 + Math.random() * 0.004;
            } else {
                add = (100 - s4_lucky) * coeff;
            }

            s4_lucky += add;
            if (s4_lucky >= 99.995) s4_lucky = 99.995;

            valueMain.textContent = s4_lucky.toFixed(2);
            updateProgressBar(s4_lucky);
            updateMainBtnText();
            playDing();
            try { navigator.vibrate(10); } catch (e) {}

            // 检测是否卡在99.9
            if (s4_lucky >= 99.99) {
                // 触发S5
                setTimeout(() => {
                    spawnParticles(100);
                    playWin();
                    showModal(
                        '🎊 幸运提款机会！',
                        `你幸运的获得了提款机会！<br>即将为你处理提款！<br><small style="color:#999;">累计已邀请 ${inviteCount} 人</small>`,
                        '立即提款',
                        () => {
                            currentState = STATE.S5;
                            s5_step = 0;
                            switchUI(STATE.S5);
                        }
                    );
                }, 400);
                return;
            }

            // 加速卡触发
            if (s4_clicks % 5 === 0 && !s4_boostActive && s4_lucky < 99.9) {
                setTimeout(() => {
                    s4_boostActive = true;
                    showModal('🎁 回流奖励', '检测到您太努力了！赠送一张「必得加速卡」，下一次点击将获得最大增幅！', '领取加速卡');
                }, 300);
            }
        }

        // ==================== 小游戏系统 ====================
        let gameType = null; // 'rain', 'idiom', 'slot'
        let gameRunning = false;

        function showGameFloat() {
            if (gameFloatVisible) return;
            // 随机概率出现：20%
            if (Math.random() > 0.25) return;
            gameFloatVisible = true;
            gameFloat.classList.remove('hidden');
            // 自动隐藏
            if (gameFloatTimer) clearTimeout(gameFloatTimer);
            gameFloatTimer = setTimeout(() => {
                gameFloat.classList.add('hidden');
                gameFloatVisible = false;
            }, 15000);
        }

        // 每隔一段时间尝试显示
        setInterval(() => {
            if (!gameFloatVisible && !gameActive) {
                showGameFloat();
            }
        }, 8000);

        gameFloat.addEventListener('click', () => {
            if (gameActive) return;
            gameFloat.classList.add('hidden');
            gameFloatVisible = false;
            if (gameFloatTimer) {
                clearTimeout(gameFloatTimer);
                gameFloatTimer = null;
            }
            // 随机选择小游戏
            const games = ['rain', 'idiom', 'slot'];
            gameType = games[Math.floor(Math.random() * games.length)];
            openGameModal();
        });

        function openGameModal() {
            gameActive = true;
            const titles = {
                rain: '🎈 红包雨',
                idiom: '📝 成语填空',
                slot: '🎰 幸运抽奖'
            };
            const descs = {
                rain: '点击掉落红包，收集5个获得1次邀请机会！<br>⏱️ 30秒倒计时',
                idiom: '从2个字中选出正确的填空字，答对5轮获得1次邀请机会！<br>答错直接结束',
                slot: '点击旋转转盘，随机获得1/2/3次邀请机会！'
            };
            let content = `<div class="game-container">
                <div class="game-title">${titles[gameType]}</div>
                <div class="game-status" id="gameStatus">${descs[gameType]}</div>
                <div class="game-area" id="gameArea"></div>
                <button class="game-btn" id="gameActionBtn">开始游戏</button>
            </div>`;

            modalBox.innerHTML = `
                <h3>🎮 小游戏</h3>
                ${content}
                <button class="modal-btn secondary" id="gameCloseBtn" style="margin-top:8px;">关闭</button>
            `;
            modalOverlay.classList.remove('hidden');

            document.getElementById('gameCloseBtn').addEventListener('click', () => {
                modalOverlay.classList.add('hidden');
                gameActive = false;
                gameRunning = false;
            });

            document.getElementById('gameActionBtn').addEventListener('click', () => {
                if (gameRunning) return;
                startGame();
            });
        }

        // ===== 红包雨 =====
        let rainTimer = null;
        let rainCollected = 0;
        let rainTarget = 5;
        let rainTimeLeft = 30;
        let rainInterval = null;
        let rainItems = [];

        function startRain() {
            const area = document.getElementById('gameArea');
            const status = document.getElementById('gameStatus');
            const btn = document.getElementById('gameActionBtn');
            btn.disabled = true;
            btn.textContent = '⏳ 进行中...';
            gameRunning = true;
            rainCollected = 0;
            rainTimeLeft = 30;
            rainItems = [];
            status.textContent = `⏱️ ${rainTimeLeft}s | 收集红包 ${rainCollected}/${rainTarget}`;

            area.innerHTML = `<div class="redpacket-grid" id="rpGrid"></div>`;
            const grid = document.getElementById('rpGrid');
            // 生成15个红包
            for (let i = 0; i < 15; i++) {
                const div = document.createElement('div');
                div.className = 'rp';
                div.textContent = '🧧';
                div.dataset.index = i;
                div.dataset.caught = 'false';
                div.addEventListener('click', () => {
                    if (div.dataset.caught === 'true') return;
                    div.dataset.caught = 'true';
                    div.classList.add('caught');
                    rainCollected++;
                    playDing();
                    status.textContent = `⏱️ ${rainTimeLeft}s | 收集红包 ${rainCollected}/${rainTarget}`;
                    if (rainCollected >= rainTarget) {
                        // 完成！
                        clearInterval(rainInterval);
                        gameRunning = false;
                        btn.disabled = false;
                        btn.textContent = '✅ 完成！';
                        availableInvites++;
                        inviteCount++;
                        updateInviteDisplay();
                        playWin();
                        status.textContent = `🎉 收集完成！获得1次邀请机会！`;
                        showModalSimple('🎉 游戏完成', '红包雨收集成功！<br>获得1次邀请机会！');
                        modalOverlay.classList.add('hidden');
                        gameActive = false;
                    }
                });
                grid.appendChild(div);
            }

            // 随机隐藏一些红包（模拟掉落）
            rainInterval = setInterval(() => {
                rainTimeLeft--;
                status.textContent = `⏱️ ${rainTimeLeft}s | 收集红包 ${rainCollected}/${rainTarget}`;
                if (rainTimeLeft <= 0) {
                    clearInterval(rainInterval);
                    gameRunning = false;
                    btn.disabled = false;
                    btn.textContent = '🔄 重试';
                    if (rainCollected < rainTarget) {
                        status.textContent = `⏰ 时间到！收集了 ${rainCollected}/${rainTarget}，再试试吧！`;
                        showModalSimple('⏰ 时间到', `收集了 ${rainCollected}/${rainTarget} 个红包，再试试吧！`);
                        modalOverlay.classList.add('hidden');
                        gameActive = false;
                    }
                }
                // 闪烁一些红包提示
                const rps = document.querySelectorAll('.rp:not(.caught)');
                if (rps.length > 0) {
                    const idx = Math.floor(Math.random() * rps.length);
                    rps[idx].style.transform = 'scale(1.1)';
                    setTimeout(() => { rps[idx].style.transform = ''; }, 200);
                }
            }, 1000);
        }

        // ===== 成语填空 =====
        const idioms = [
            { q: '一____惊人', ans: '鸣', opts: ['鸣', '名'] },
            { q: '____虎色变', ans: '谈', opts: ['谈', '弹'] },
            { q: '画____点睛', ans: '龙', opts: ['龙', '蛇'] },
            { q: '____中送炭', ans: '雪', opts: ['雪', '血'] },
            { q: '百____百中', ans: '发', opts: ['发', '法'] },
            { q: '____面楚歌', ans: '四', opts: ['四', '死'] },
            { q: '____入虎穴', ans: '焉', opts: ['焉', '燕'] },
            { q: '____公移山', ans: '愚', opts: ['愚', '鱼'] },
            { q: '____上添花', ans: '锦', opts: ['锦', '景'] },
            { q: '____璧无瑕', ans: '白', opts: ['白', '百'] },
        ];
        let idiomIdx = 0;
        let idiomCorrect = 0;
        let idiomTotal = 5;

        function startIdiom() {
            const area = document.getElementById('gameArea');
            const status = document.getElementById('gameStatus');
            const btn = document.getElementById('gameActionBtn');
            btn.disabled = true;
            btn.textContent = '⏳ 答题中...';
            gameRunning = true;
            idiomIdx = 0;
            idiomCorrect = 0;

            // 随机选5道
            const shuffled = [...idioms].sort(() => Math.random() - 0.5);
            const selected = shuffled.slice(0, idiomTotal);
            showIdiomQuestion(selected, 0, status, btn, area);
        }

        function showIdiomQuestion(selected, idx, status, btn, area) {
            if (idx >= selected.length) {
                // 全部答对
                gameRunning = false;
                btn.disabled = false;
                btn.textContent = '✅ 完成！';
                availableInvites++;
                inviteCount++;
                updateInviteDisplay();
                playWin();
                status.textContent = `🎉 全部答对！获得1次邀请机会！`;
                showModalSimple('🎉 游戏完成', '成语填空全部答对！<br>获得1次邀请机会！');
                modalOverlay.classList.add('hidden');
                gameActive = false;
                return;
            }

            const q = selected[idx];
            status.textContent = `📝 第 ${idx+1}/${selected.length} 题`;
            const displayQ = q.q.replace('____', '___');
            area.innerHTML = `
                <div style="font-size:20px;color:#ffd700;font-weight:700;margin:6px 0;">${displayQ}</div>
                <div class="game-opt" id="idiomOpts">
                    <button data-ans="${q.opts[0]}">${q.opts[0]}</button>
                    <button data-ans="${q.opts[1]}">${q.opts[1]}</button>
                </div>
            `;
            const opts = area.querySelectorAll('#idiomOpts button');
            opts.forEach(btnEl => {
                btnEl.addEventListener('click', () => {
                    if (!gameRunning) return;
                    const selectedAns = btnEl.dataset.ans;
                    const isCorrect = selectedAns === q.ans;
                    if (isCorrect) {
                        btnEl.classList.add('correct');
                        idiomCorrect++;
                        playDing();
                        setTimeout(() => {
                            showIdiomQuestion(selected, idx + 1, status, btn, area);
                        }, 300);
                    } else {
                        btnEl.classList.add('wrong');
                        playBuzz();
                        gameRunning = false;
                        btn.disabled = false;
                        btn.textContent = '🔄 重试';
                        status.textContent = `❌ 答错了！正确答案是「${q.ans}」`;
                        showModalSimple('❌ 答错了', `正确答案是「${q.ans}」<br>答对 ${idiomCorrect}/${selected.length} 题，再试试吧！`);
                        modalOverlay.classList.add('hidden');
                        gameActive = false;
                    }
                    opts.forEach(b => b.disabled = true);
                });
            });
        }

        // ===== 抽奖转盘 =====
        let slotSpinning = false;

        function startSlot() {
            const area = document.getElementById('gameArea');
            const status = document.getElementById('gameStatus');
            const btn = document.getElementById('gameActionBtn');
            if (slotSpinning) return;
            slotSpinning = true;
            btn.disabled = true;
            btn.textContent = '🎰 转动中...';
            gameRunning = true;

            const rewards = [1, 2, 3];
            const result = rewards[Math.floor(Math.random() * rewards.length)];

            area.innerHTML = `
                <div class="slot-machine" id="slotMachine">
                    <div class="reel" id="reel1">?</div>
                    <div class="reel" id="reel2">?</div>
                    <div class="reel" id="reel3">?</div>
                </div>
                <div class="slot-result" id="slotResult"></div>
            `;

            const reel1 = document.getElementById('reel1');
            const reel2 = document.getElementById('reel2');
            const reel3 = document.getElementById('reel3');

            // 滚动动画
            let count = 0;
            const maxCount = 15 + Math.floor(Math.random() * 10);
            const interval = setInterval(() => {
                const symbols = ['🎯', '⭐', '💎', '🎰', '🍀'];
                reel1.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                reel2.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                reel3.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                count++;
                if (count >= maxCount) {
                    clearInterval(interval);
                    // 显示结果
                    const resText = result === 1 ? '1次' : result === 2 ? '2次' : '3次';
                    reel1.textContent = '🎉';
                    reel2.textContent = result;
                    reel3.textContent = '🎉';
                    document.getElementById('slotResult').textContent = `🎊 恭喜获得 ${resText} 邀请机会！`;
                    status.textContent = `🎉 抽奖完成！获得 ${resText} 邀请机会！`;
                    availableInvites += result;
                    inviteCount += result;
                    updateInviteDisplay();
                    playWin();
                    slotSpinning = false;
                    gameRunning = false;
                    btn.disabled = false;
                    btn.textContent = '✅ 完成！';
                    setTimeout(() => {
                        showModalSimple('🎉 抽奖完成', `获得 ${resText} 邀请机会！`);
                        modalOverlay.classList.add('hidden');
                        gameActive = false;
                    }, 500);
                }
            }, 80);
        }

        // ===== 游戏启动路由 =====
        function startGame() {
            if (gameRunning) return;
            if (gameType === 'rain') startRain();
            else if (gameType === 'idiom') startIdiom();
            else if (gameType === 'slot') startSlot();
        }

        // ==================== 防退出 ====================
        window.addEventListener('beforeunload', (e) => {
            e.preventDefault();
            e.returnValue = '提现即将完成，确定要中断吗？';
            return e.returnValue;
        });

        // ==================== 初始化 ====================
        mainBtn.addEventListener('click', onMainBtnClick);

        // 启动
        switchUI(STATE.S1);
        valueMain.textContent = '0.00';
        updateProgressBar(0);
        updateInviteDisplay();

        setTimeout(() => {
            showModal(
                '🧧 幻影红包',
                '欢迎来到「永不抵达的100元」！<br>邀请好友助力，冲刺百元红包！<br><small style="color:#999;">（纯属娱乐，请勿当真）</small>',
                '开始冲刺'
            );
        }, 800);

        // 额外：点击空白处偶尔触发小游戏入口
        document.addEventListener('click', () => {
            if (!gameFloatVisible && !gameActive && Math.random() < 0.05) {
                showGameFloat();
            }
        });
    </script>
</body>
</html>
