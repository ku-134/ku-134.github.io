<!DOCTYPE html>
<html lang="zh-CN" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汇率换算 · 虚空终端</title>
    <link rel="preload" as="image" href="../background.webp">
    <link rel="preload" as="image" href="../background1.webp">
    <link rel="preload" as="image" href="../background2.webp">
    <link rel="preload" as="image" href="../background3.webp">
    <link rel="preload" as="image" href="../background4.webp">
    <link rel="stylesheet" href="../style.css">
    <style>
        .tool-container { max-width: 920px; width: 100%; margin: 0 auto; }
        .tool-card { background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); padding: 2.2rem 2.2rem 2rem; border-radius: 2rem; backdrop-filter: blur(14px) saturate(180%); -webkit-backdrop-filter: blur(14px) saturate(180%); }
        .tool-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.2rem; padding-bottom: 0.6rem; border-bottom: 1px solid rgba(128,128,128,0.1); }
        .tool-header .brand { font-size: 1.8rem; font-weight: 700; letter-spacing: 0.02em; }
        .tool-header .nav-links { display: flex; gap: 1rem; font-size: 0.95rem; }
        .tool-header .nav-links a { text-decoration: none; opacity: 0.7; transition: opacity 0.2s; }
        .tool-header .nav-links a:hover { opacity: 1; }
        .tool-sub { font-size: 0.9rem; opacity: 0.6; margin: -0.4rem 0 1.2rem; line-height: 1.6; }
        .tool-toolbar { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .text-input, .select-input {
            padding: 0.5rem 0.9rem; border-radius: 2rem; border: 1px solid rgba(128,128,128,0.25);
            background: rgba(128,128,128,0.06); color: inherit; font-family: inherit; font-size: 0.88rem;
            outline: none; transition: border-color 0.2s;
        }
        .text-input:focus, .select-input:focus { border-color: #66bb6a; }
        .text-input.num { width: 130px; font-family: 'Courier New', monospace; }
        .btn {
            padding: 0.5rem 1.4rem; border-radius: 2rem; cursor: pointer;
            border: 1px solid rgba(128,128,128,0.25); background: rgba(128,128,128,0.06);
            color: inherit; font-family: inherit; font-size: 0.9rem;
            transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.4rem;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary { border-color: #66bb6a; color: #66bb6a; background: rgba(102,187,106,0.1); }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .btn-sm { padding: 0.3rem 0.8rem; font-size: 0.78rem; }
        .loading { display: none; text-align: center; padding: 1rem; opacity: 0.6; }
        .loading.show { display: block; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(128,128,128,0.3); border-top-color: #66bb6a; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: -3px; margin-right: 0.5rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .calc-box { background: rgba(102,187,106,0.06); border: 1px solid rgba(102,187,106,0.2); border-radius: 1.2rem; padding: 1.2rem 1.4rem; margin-bottom: 0.9rem; display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; }
        .calc-box .result-big { font-size: 1.9rem; font-weight: 800; color: #66bb6a; font-family: 'Courier New', monospace; word-break: break-all; }
        .calc-box .rate-info { font-size: 0.8rem; opacity: 0.55; width: 100%; }
        .quick-row { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
        .cache-note { font-size: 0.78rem; opacity: 0.6; margin-left: auto; }
        .cmp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.5rem; }
        .cmp-item { background: rgba(128,128,128,0.04); border: 1px solid rgba(128,128,128,0.12); border-radius: 0.8rem; padding: 0.55rem 0.8rem; }
        .cmp-item .c-code { font-size: 0.72rem; opacity: 0.55; }
        .cmp-item .c-name { font-size: 0.8rem; margin: 0.15rem 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cmp-item .c-val { font-size: 0.95rem; font-weight: 700; font-family: 'Courier New', monospace; }
        .tool-foot { margin-top: 1.5rem; font-size: 0.78rem; opacity: 0.45; text-align: center; border-top: 1px solid rgba(128,128,128,0.1); padding-top: 1rem; }
    </style>
</head>
<body>
    <div class="tool-container">
        <div class="tool-card">
            <header class="tool-header">
                <div class="brand"><span class="typing-title">🌍 汇率换算</span></div>
                <div class="nav-links">
                    <a href="../MT.html">📝 返回列表</a>
                </div>
            </header>
            <div class="tool-sub">170+ 币种实时汇率换算。汇率自动缓存到本地——断网也能用上次的数据，并附常用币种同屏对比。</div>

            <div class="tool-toolbar">
                <input type="text" class="text-input num" id="amount" value="100" inputmode="decimal" placeholder="金额">
                <select class="select-input" id="fromCur"></select>
                <button class="btn btn-sm" id="swapBtn" title="互换币种">⇄</button>
                <select class="select-input" id="toCur"></select>
                <button class="btn btn-primary" id="refreshBtn">🔄 更新汇率</button>
                <span class="cache-note" id="cacheNote"></span>
            </div>
            <div class="loading" id="loading"><span class="spinner"></span>正在获取实时汇率…</div>

            <div class="calc-box" id="calcBox" style="display:none;">
                <span id="resultBig" class="result-big">-</span>
                <span id="rateInfo" class="rate-info"></span>
            </div>
            <div class="quick-row" id="quickRow" style="display:none;">
                <button class="btn btn-sm" data-q="100">100</button>
                <button class="btn btn-sm" data-q="500">500</button>
                <button class="btn btn-sm" data-q="1000">1000</button>
                <button class="btn btn-sm" data-q="5000">5000</button>
                <button class="btn btn-sm" data-q="10000">10000</button>
            </div>

            <div id="cmpArea" style="display:none;">
                <div class="sub" style="font-size:0.85rem;opacity:0.6;margin-bottom:0.5rem;">📊 常用币种对比（同金额）</div>
                <div class="cmp-grid" id="cmpGrid"></div>
            </div>

            <div class="tool-foot">数据源：open.er-api.com（每日多次更新）· 汇率缓存于本地，断网时显示上次数据</div>
        </div>
    </div>

    <script>
    (function () {
        'use strict';
        var CURRENCY_NAMES = {
            USD: '美元', CNY: '人民币', EUR: '欧元', JPY: '日元', GBP: '英镑', HKD: '港币',
            KRW: '韩元', AUD: '澳元', CAD: '加元', SGD: '新加坡元', TWD: '新台币', CHF: '瑞士法郎',
            THB: '泰铢', MYR: '林吉特', INR: '卢比', RUB: '卢布', BRL: '雷亚尔', MXN: '比索',
            NZD: '纽元', PHP: '比索', IDR: '印尼盾', VND: '越南盾', AED: '迪拉姆', SAR: '里亚尔',
            TRY: '里拉', SEK: '克朗', NOK: '克朗', DKK: '克朗', PLN: '兹罗提', ZAR: '兰特',
            ILS: '谢克尔', CZK: '克朗', HUF: '福林', CLP: '比索', ARS: '比索', EGP: '镑'
        };
        var COMMON = ['USD', 'CNY', 'EUR', 'JPY', 'GBP', 'HKD', 'KRW', 'TWD', 'SGD', 'AUD', 'CAD', 'CHF', 'THB', 'RUB'];
        var CACHE_KEY = 'fxCache';
        var rates = null, fetchedAt = null, fromCache = false;

        function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        function fmt(n) {
            if (n == null || isNaN(n)) return '-';
            return Number(n).toLocaleString('zh-CN', { maximumFractionDigits: n >= 100 ? 2 : n >= 1 ? 4 : 6 });
        }

        function loadCache() {
            try {
                var c = JSON.parse(localStorage.getItem(CACHE_KEY));
                if (c && c.rates && c.time) { rates = c.rates; fetchedAt = new Date(c.time); fromCache = true; return true; }
            } catch (e) { }
            return false;
        }
        function saveCache(rates) {
            try { localStorage.setItem(CACHE_KEY, JSON.stringify({ rates: rates, time: new Date().toISOString() })); } catch (e) { }
        }

        function fillSelects() {
            var codes = Object.keys(rates).sort();
            var f = document.getElementById('fromCur'), t = document.getElementById('toCur');
            f.innerHTML = ''; t.innerHTML = '';
            codes.forEach(function (c) {
                var name = CURRENCY_NAMES[c] || '';
                var label = c + (name ? ' · ' + name : '');
                f.insertAdjacentHTML('beforeend', '<option value="' + c + '">' + esc(label) + '</option>');
                t.insertAdjacentHTML('beforeend', '<option value="' + c + '">' + esc(label) + '</option>');
            });
            f.value = 'CNY'; t.value = 'USD';
        }

        function calc() {
            var amt = parseFloat(document.getElementById('amount').value);
            if (isNaN(amt)) amt = 0;
            var f = document.getElementById('fromCur').value;
            var t = document.getElementById('toCur').value;
            var rf = rates[f], rt = rates[t];
            if (!rf || !rt) return;
            var val = amt / rf * rt;
            var rate = rt / rf;
            document.getElementById('calcBox').style.display = '';
            document.getElementById('quickRow').style.display = '';
            document.getElementById('resultBig').textContent = fmt(val) + ' ' + t;
            document.getElementById('rateInfo').textContent = '1 ' + f + ' = ' + fmt(rate) + ' ' + t +
                '（数据时间：' + (fetchedAt ? fetchedAt.toLocaleString() : '-') + (fromCache ? ' · 离线缓存' : ' · 实时') + '）';
            /* 对比表 */
            var grid = document.getElementById('cmpGrid');
            grid.innerHTML = '';
            COMMON.forEach(function (c) {
                if (c === f) return;
                var r = rates[c];
                if (!r) return;
                var v = amt / rf * r;
                grid.insertAdjacentHTML('beforeend', '<div class="cmp-item"><div class="c-code">' + c + '</div><div class="c-name">' + esc(CURRENCY_NAMES[c] || '') + '</div><div class="c-val">' + fmt(v) + '</div></div>');
            });
            document.getElementById('cmpArea').style.display = '';
        }

        function fetchRates() {
            var loading = document.getElementById('loading');
            var refreshBtn = document.getElementById('refreshBtn');
            loading.classList.add('show');
            refreshBtn.disabled = true;
            fetch('https://open.er-api.com/v6/latest/USD').then(function (r) { return r.json(); }).then(function (j) {
                if (j && j.result === 'success' && j.rates) {
                    rates = j.rates; fetchedAt = new Date(); fromCache = false;
                    saveCache(j.rates);
                    document.getElementById('cacheNote').textContent = '已缓存 ' + new Date().toLocaleTimeString();
                    init();
                } else { throw new Error('bad'); }
            }).catch(function () {
                if (!loadCache()) { document.getElementById('cacheNote').textContent = '⚠ 获取失败且无缓存'; return; }
                document.getElementById('cacheNote').textContent = '⚠ 网络失败，使用缓存（' + fetchedAt.toLocaleString() + '）';
                init();
            }).then(function () {
                loading.classList.remove('show');
                refreshBtn.disabled = false;
            });
        }

        var inited = false;
        function init() {
            if (!rates) return;
            if (!inited) { fillSelects(); inited = true; }
            calc();
        }

        document.getElementById('refreshBtn').addEventListener('click', fetchRates);
        document.getElementById('swapBtn').addEventListener('click', function () {
            var f = document.getElementById('fromCur'), t = document.getElementById('toCur');
            var tmp = f.value; f.value = t.value; t.value = tmp;
            calc();
        });
        document.getElementById('amount').addEventListener('input', calc);
        document.getElementById('fromCur').addEventListener('change', calc);
        document.getElementById('toCur').addEventListener('change', calc);
        document.getElementById('quickRow').addEventListener('click', function (e) {
            var b = e.target.closest('[data-q]');
            if (!b) return;
            document.getElementById('amount').value = b.getAttribute('data-q');
            calc();
        });

        if (loadCache()) {
            document.getElementById('cacheNote').textContent = '缓存汇率：' + fetchedAt.toLocaleString() + '（正在刷新…）';
            init();
        }
        fetchRates();
    })();
    </script>
    <script src="../global-ui.js"></script>
</body>
</html>
