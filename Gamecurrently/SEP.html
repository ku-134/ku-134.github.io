<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肉鸽！贪吃！蛇！ · Kukuz</title>
    <link rel="preload" as="image" href="../background.webp">
    <link rel="stylesheet" href="../style.css">
    <style>
        /* ===== 游戏页专用样式 ===== */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            max-width: 820px;
            width: 100%;
            padding: 2rem 2rem 2rem;
            border-radius: 2rem;
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }
        @media (prefers-color-scheme: light) {
            .game-container {
                background: rgba(255, 255, 255, 0.68);
                color: #1a3b1a;
                border-color: rgba(80, 160, 80, 0.25);
            }
        }
        @media (prefers-color-scheme: dark) {
            .game-container {
                background: rgba(10, 20, 10, 0.72);
                color: #c8e6c9;
                border-color: rgba(60, 140, 60, 0.3);
            }
        }

        /* ----- 顶部导航栏 ----- */
        .game-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.8rem;
            border-bottom: 2px solid rgba(128, 128, 128, 0.08);
            margin-bottom: 1.2rem;
        }
        .game-nav .nav-btn {
            padding: 0.3rem 1.2rem;
            border-radius: 2rem;
            border: 1px solid currentColor;
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            opacity: 0.6;
            text-decoration: none;
            display: inline-block;
        }
        .game-nav .nav-btn:hover {
            opacity: 1;
            background: currentColor;
            color: #fff;
            transform: translateY(-2px);
        }
        @media (prefers-color-scheme: dark) {
            .game-nav .nav-btn:hover { color: #1a2e1a; }
        }
        .game-nav .game-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: center;
            flex: 1;
            margin: 0 1rem;
            white-space: nowrap;
        }

        /* ----- 游戏画面框 ----- */
        .game-screen {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 1.2rem;
            border: 2px solid rgba(128, 128, 128, 0.15);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            user-select: none;
            transition: border-color 0.3s;
            position: relative;
            overflow: hidden;
            flex-direction: column;
            gap: 0.5rem;
        }
        .game-screen .key-display {
            font-size: 3rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.6);
            min-height: 4rem;
            transition: color 0.1s;
        }
        .game-screen .key-hint {
            font-size: 0.8rem;
            opacity: 0.2;
            position: absolute;
            bottom: 0.8rem;
            right: 1rem;
        }
        .game-screen .placeholder-text {
            opacity: 0.2;
            font-size: 1rem;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* ----- 游戏操作框（手柄布局） ----- */
        .game-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0.5rem 0.2rem;
            border-top: 1px solid rgba(128, 128, 128, 0.08);
            flex-wrap: wrap;
            gap: 1rem;
        }

        /* 十字键 - 仅上下左右 + 中心装饰 */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 3rem);
            grid-template-rows: repeat(3, 3rem);
            gap: 0.2rem;
            flex-shrink: 0;
        }
        .dpad-btn {
            background: rgba(128, 128, 128, 0.08);
            border: 1px solid rgba(128, 128, 128, 0.12);
            border-radius: 0.6rem;
            color: inherit;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            font-family: inherit;
        }
        .dpad-btn:hover {
            background: rgba(128, 128, 128, 0.18);
            transform: scale(0.96);
        }
        .dpad-btn:active {
            transform: scale(0.88);
            background: rgba(128, 128, 128, 0.25);
        }
        /* 四角空白按钮 - 移除（不显示） */
        .dpad-btn.corner {
            visibility: hidden;
            pointer-events: none;
            border: none;
            background: transparent;
        }
        .dpad-center {
            background: transparent !important;
            border: none !important;
            cursor: default;
            pointer-events: none;
            font-size: 0.8rem;
            opacity: 0.3;
        }
        /* 键盘高亮状态 */
        .dpad-btn.active-key {
            background: rgba(102, 187, 106, 0.3);
            border-color: rgba(102, 187, 106, 0.5);
            transform: scale(0.95);
        }

        /* 右侧按钮组 */
        .action-buttons {
            display: flex;
            gap: 0.8rem;
            flex-shrink: 0;
        }
        .action-btn {
            width: 3.8rem;
            height: 3.8rem;
            border-radius: 50%;
            border: 2px solid currentColor;
            background: transparent;
            color: inherit;
            font-size: 1.2rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.5;
        }
        .action-btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }
        .action-btn:active {
            transform: scale(0.9);
            background: currentColor;
            color: #fff;
        }
        .action-btn.a {
            border-color: #f5a623;
            color: #f5a623;
        }
        .action-btn.b {
            border-color: #e74c3c;
            color: #e74c3c;
        }
        .action-btn.start {
            width: 3rem;
            height: 2rem;
            border-radius: 1rem;
            font-size: 0.8rem;
            border-color: rgba(128, 128, 128, 0.3);
            color: inherit;
            opacity: 0.4;
        }
        .action-btn.start:hover {
            opacity: 0.7;
        }
        .action-btn.active-key {
            background: rgba(102, 187, 106, 0.2);
            border-color: rgba(102, 187, 106, 0.4);
            transform: scale(0.95);
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .game-container { padding: 1.2rem 1rem; }
            .game-nav .game-title { font-size: 1.2rem; margin: 0 0.5rem; }
            .game-nav .nav-btn { font-size: 0.8rem; padding: 0.2rem 0.8rem; }
            .dpad { grid-template-columns: repeat(3, 2.4rem); grid-template-rows: repeat(3, 2.4rem); gap: 0.15rem; }
            .dpad-btn { font-size: 0.9rem; }
            .action-btn { width: 3rem; height: 3rem; font-size: 1rem; }
            .action-btn.start { width: 2.4rem; height: 1.6rem; font-size: 0.6rem; }
            .game-controls { justify-content: center; gap: 1.2rem; }
            .game-screen .key-display { font-size: 2rem; min-height: 3rem; }
        }
        @media (max-width: 400px) {
            .game-nav { flex-wrap: wrap; justify-content: center; gap: 0.3rem; }
            .game-nav .game-title { order: 3; flex-basis: 100%; margin: 0.2rem 0; font-size: 1.1rem; }
            .dpad { grid-template-columns: repeat(3, 2rem); grid-template-rows: repeat(3, 2rem); }
            .action-btn { width: 2.6rem; height: 2.6rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- 导航栏 -->
        <div class="game-nav">
            <a href="../GG.html" class="nav-btn">← 返回</a>
            <span class="game-title">🐍 肉鸽！贪吃！蛇！</span>
            <button class="nav-btn" id="refreshBtn">⟳ 刷新</button>
        </div>

        <!-- 游戏画面框 -->
        <div class="game-screen" id="gameScreen">
            <span class="placeholder-text">🎮 游戏画面</span>
            <div class="key-display" id="keyDisplay">⌨️</div>
            <span class="key-hint">WASD / 方向键 移动</span>
        </div>

        <!-- 游戏操作框 -->
        <div class="game-controls">
            <!-- 十字键（仅上下左右 + 中心） -->
            <div class="dpad" id="dpad">
                <!-- 第一行：空、上、空 -->
                <div class="dpad-btn corner"></div>
                <div class="dpad-btn" data-dir="up">↑</div>
                <div class="dpad-btn corner"></div>
                <!-- 第二行：左、中心、右 -->
                <div class="dpad-btn" data-dir="left">←</div>
                <div class="dpad-btn dpad-center">•</div>
                <div class="dpad-btn" data-dir="right">→</div>
                <!-- 第三行：空、下、空 -->
                <div class="dpad-btn corner"></div>
                <div class="dpad-btn" data-dir="down">↓</div>
                <div class="dpad-btn corner"></div>
            </div>

            <!-- 右侧按钮 -->
            <div class="action-buttons">
                <button class="action-btn a" data-key="j">A</button>
                <button class="action-btn b" data-key="k">B</button>
                <button class="action-btn start" data-key="enter">START</button>
            </div>
        </div>
    </div>

    <script src="../script.js"></script>
    <script>
        (function() {
            'use strict';

            const screen = document.getElementById('gameScreen');
            const keyDisplay = document.getElementById('keyDisplay');
            const refreshBtn = document.getElementById('refreshBtn');
            const dpadBtns = document.querySelectorAll('.dpad-btn[data-dir]');
            const actionBtns = document.querySelectorAll('.action-btn[data-key]');

            // ---------- 刷新 ----------
            refreshBtn.addEventListener('click', function() {
                location.reload();
            });

            // ---------- 按键反馈 ----------
            function showKey(keyName) {
                keyDisplay.textContent = keyName;
                // 闪烁动画
                keyDisplay.style.opacity = '0.3';
                setTimeout(function() {
                    keyDisplay.style.opacity = '1';
                }, 50);
            }

            // ---------- 十字键高亮 ----------
            function clearDpadHighlights() {
                dpadBtns.forEach(function(btn) {
                    btn.classList.remove('active-key');
                });
            }

            function highlightDir(dir) {
                clearDpadHighlights();
                dpadBtns.forEach(function(btn) {
                    if (btn.dataset.dir === dir) {
                        btn.classList.add('active-key');
                    }
                });
            }

            // ---------- 动作键高亮 ----------
            function clearActionHighlights() {
                actionBtns.forEach(function(btn) {
                    btn.classList.remove('active-key');
                });
            }

            function highlightAction(key) {
                clearActionHighlights();
                actionBtns.forEach(function(btn) {
                    if (btn.dataset.key === key) {
                        btn.classList.add('active-key');
                    }
                });
            }

            // ---------- 键盘映射 ----------
            const keyMap = {
                // 方向
                'w': 'up', 'W': 'up',
                'ArrowUp': 'up',
                's': 'down', 'S': 'down',
                'ArrowDown': 'down',
                'a': 'left', 'A': 'left',
                'ArrowLeft': 'left',
                'd': 'right', 'D': 'right',
                'ArrowRight': 'right',
                // 动作
                'j': 'j', 'J': 'j',
                'k': 'k', 'K': 'k',
                'Enter': 'enter'
            };

            const keyDisplayNames = {
                'up': '↑',
                'down': '↓',
                'left': '←',
                'right': '→',
                'j': 'J',
                'k': 'K',
                'enter': 'START'
            };

            document.addEventListener('keydown', function(e) {
                const key = e.key;
                const mapped = keyMap[key];
                if (!mapped) return;

                // 阻止默认行为（例如方向键滚动）
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(key)) {
                    e.preventDefault();
                }

                // 显示按键
                const displayName = keyDisplayNames[mapped] || key;
                showKey(displayName);

                // 高亮对应按钮
                if (['up', 'down', 'left', 'right'].includes(mapped)) {
                    highlightDir(mapped);
                } else {
                    highlightAction(mapped);
                }

                // 如果是 Enter（START），也触发点击效果
                if (mapped === 'enter') {
                    const startBtn = document.querySelector('.action-btn.start');
                    if (startBtn) {
                        startBtn.style.transform = 'scale(0.9)';
                        setTimeout(function() {
                            startBtn.style.transform = '';
                        }, 150);
                    }
                }
            });

            document.addEventListener('keyup', function(e) {
                const key = e.key;
                const mapped = keyMap[key];
                if (!mapped) return;

                if (['up', 'down', 'left', 'right'].includes(mapped)) {
                    clearDpadHighlights();
                } else {
                    clearActionHighlights();
                }
                // 松开按键后，稍后恢复显示占位符
                setTimeout(function() {
                    if (!document.querySelector('.dpad-btn.active-key') && !document.querySelector('.action-btn.active-key')) {
                        keyDisplay.textContent = '⌨️';
                    }
                }, 300);
            });

            // ---------- 鼠标/触控点击反馈 ----------
            dpadBtns.forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    const dir = this.dataset.dir;
                    showKey(keyDisplayNames[dir] || dir);
                    highlightDir(dir);
                    setTimeout(function() {
                        clearDpadHighlights();
                        if (!document.querySelector('.action-btn.active-key')) {
                            keyDisplay.textContent = '⌨️';
                        }
                    }, 500);
                });
            });

            actionBtns.forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    const key = this.dataset.key;
                    const displayName = keyDisplayNames[key] || key;
                    showKey(displayName);
                    highlightAction(key);
                    setTimeout(function() {
                        clearActionHighlights();
                        if (!document.querySelector('.dpad-btn.active-key')) {
                            keyDisplay.textContent = '⌨️';
                        }
                    }, 500);
                });
            });

            // 点击画面框重置显示
            screen.addEventListener('click', function() {
                keyDisplay.textContent = '⌨️';
                clearDpadHighlights();
                clearActionHighlights();
            });

        })();
    </script>

</body>
</html>
