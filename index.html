<!DOCTYPE html>
<html lang="zh-CN" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚空终端 · Kukuz分享页</title>
    <!-- 预加载所有背景图 -->
    <link rel="preload" as="image" href="background.webp">
    <link rel="preload" as="image" href="background1.webp">
    <link rel="preload" as="image" href="background2.webp">
    <link rel="preload" as="image" href="background3.webp">
    <link rel="preload" as="image" href="background4.webp">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== 入场动画 ===== */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: var(--loader-bg, #0d1a0d);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1.2s ease;
            pointer-events: none;
        }
        #loader.hide {
            opacity: 0;
            pointer-events: none;
        }
        .code-block {
            position: absolute;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: var(--code-color, #66bb6a);
            opacity: 0;
            animation: codeFade 3s ease-in-out infinite alternate;
            user-select: none;
            white-space: nowrap;
            text-shadow: 0 0 8px var(--code-glow, rgba(102, 187, 106, 0.3));
        }
        @keyframes codeFade {
            0% { opacity: 0; transform: translateY(-10px) scale(0.95); }
            50% { opacity: 0.9; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(10px) scale(0.95); }
        }

        /* ===== 主容器 ===== */
        .main-container {
            display: flex;
            gap: 1.5rem;
            max-width: 1100px;
            width: 100%;
            align-items: stretch;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ===== 卡片 ===== */
        .card {
            flex: 1 1 420px;
            max-width: 580px;
            padding: 2.8rem 2.5rem;
            border-radius: 2rem;
            text-align: center;
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: background 0.3s, color 0.3s, border-color 0.3s, opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            transform: translateY(40px) scale(0.96);
        }
        .card.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .card-narrow {
            max-width: 580px;
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
        }

        /* ===== 统计卡片 ===== */
        .stats-card {
            flex: 0 0 340px;
            max-width: 420px;
            padding: 2rem 1.8rem;
            border-radius: 2rem;
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: background 0.3s, color 0.3s, border-color 0.3s, opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            transform: translateY(40px) scale(0.96);
            display: flex;
            flex-direction: column;
        }
        .stats-card.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* ===== 统计卡片内部 ===== */
        .stats-section-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            margin: 0 0 0.4rem 0;
            color: inherit;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .stats-section-title:not(:first-of-type) {
            margin-top: 0.8rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }
        .stats-item {
            background: rgba(128, 128, 128, 0.05);
            border: 1px solid rgba(128, 128, 128, 0.06);
            border-radius: 1rem;
            padding: 0.7rem 0.5rem;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }
        .stats-item:hover {
            transform: translateY(-2px);
            border-color: rgba(128, 128, 128, 0.15);
        }
        .stats-item .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.35;
            margin-bottom: 0.1rem;
        }
        .stats-item .number-wrap {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 0.3rem;
        }
        .stats-item .number {
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.3;
        }
        .stats-item .number.loading {
            opacity: 0.3;
            font-weight: 400;
            font-size: 1.4rem;
        }
        .stats-item .delta {
            font-size: 0.7rem;
            font-weight: 600;
            color: #66bb6a;
            transition: opacity 0.3s;
            white-space: nowrap;
        }
        .stats-item .delta.negative {
            color: #e74c3c;
        }
        .stats-item .delta.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .stats-item .sub {
            font-size: 0.55rem;
            opacity: 0.2;
            margin-top: 0.05rem;
        }
        .stats-item.local .number {
            color: #f5a623;
        }
        .stats-item.local .label {
            opacity: 0.25;
        }

        .stats-item.full-width {
            grid-column: 1 / -1;
        }
        .stats-item.full-width .number {
            font-size: 2.2rem;
        }
        .stats-item.highlight .number {
            color: #e74c3c;
            text-shadow: 0 0 16px rgba(231, 76, 60, 0.15);
        }

        /* ===== 主卡片内部 ===== */
        .card h1 {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            margin-bottom: 0.4rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            min-height: 4rem;
        }
        .card .sub {
            font-size: 1.1rem;
            font-weight: 400;
            opacity: 0.9;
            margin-bottom: 1.2rem;
        }
        .card .divider {
            width: 80px;
            height: 3px;
            border-radius: 4px;
            margin: 0.8rem auto 1.2rem;
        }
        .card .desc {
            font-size: 1rem;
            line-height: 1.7;
            max-width: 500px;
            margin: 0 auto 1.8rem;
            opacity: 0.85;
        }
        .card .footer {
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            opacity: 0.7;
            margin-top: 0.5rem;
        }
        .card .footer a {
            text-decoration: none;
            border-bottom: 1px dotted rgba(128, 128, 128, 0.3);
        }
        .card .footer a:hover {
            border-bottom-color: currentColor;
        }

        /* ===== 导航 ===== */
        .nav-menu {
            display: flex;
            justify-content: center;
            gap: 1.8rem;
            margin: 0.8rem 0 0.2rem 0;
            flex-wrap: wrap;
        }
        .nav-link {
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            padding: 0.3rem 0.2rem;
            border-bottom: 2px solid transparent;
            transition: all 0.25s ease;
            opacity: 0.75;
        }
        .nav-link:hover {
            opacity: 1;
            border-bottom-color: currentColor;
            transform: translateY(-1px);
        }
        .nav-link.active {
            opacity: 1;
            border-bottom-color: currentColor;
            font-weight: 600;
        }

        /* ===== 按钮 ===== */
        .button-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.2rem;
            margin: 1.5rem 0 1.8rem 0;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            font-weight: 600;
            text-decoration: none;
            border-radius: 3rem;
            transition: all 0.25s ease;
            border: 2px solid transparent;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-primary {
            font-size: 1.25rem;
            padding: 0.75rem 2.4rem;
            box-shadow: 0 4px 12px rgba(27, 94, 32, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(27, 94, 32, 0.4);
        }
        .btn-secondary {
            font-size: 0.95rem;
            padding: 0.5rem 1.6rem;
            background: transparent;
            border-color: currentColor;
            opacity: 0.8;
        }
        .btn-secondary:hover {
            opacity: 1;
            transform: translateY(-2px);
            background: currentColor;
            color: #fff;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            z-index: 2000;
            padding: 12px 28px;
            border-radius: 2rem;
            font-size: 1rem;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast .highlight {
            color: #a5d6a7;
            font-weight: 700;
        }
        #toast { bottom: 30px; }
        #visitToast { bottom: 90px; }
        @media (max-width: 480px) {
            .toast { font-size: 0.85rem; padding: 10px 18px; white-space: normal; max-width: 90%; }
            #toast { bottom: 20px; }
            #visitToast { bottom: 80px; }
        }

        /* ===== 入场延迟工具 ===== */
        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.3s; }
        .delay-3 { animation-delay: 0.5s; }
        .delay-4 { animation-delay: 0.7s; }
        .delay-5 { animation-delay: 0.9s; }
        .delay-6 { animation-delay: 1.1s; }
        .delay-7 { animation-delay: 1.3s; }

        /* ===== 打字机 ===== */
        .typing-title {
            display: inline-block;
        }
        .typing-title .char {
            display: inline-block;
            opacity: 0;
            transform: translateY(-40px) scale(0.8);
            animation: charDrop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes charDrop {
            0% { opacity: 0; transform: translateY(-40px) scale(0.8); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .typing-title .cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: currentColor;
            margin-left: 2px;
            animation: blink 0.8s step-end infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        /* ============================================================
           底部控制栏（设置按钮 + 隐藏按钮）
           ============================================================ */
        .bottom-controls {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1500;
            display: flex;
            gap: 0.6rem;
            align-items: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        .bottom-controls.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .ctrl-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            opacity: 0.6;
            font-family: inherit;
            line-height: 1;
            padding: 0;
            background: var(--settings-bg, rgba(10,20,10,0.6));
            color: var(--text-color, #c8e6c9);
            border-color: var(--border-color, rgba(255,255,255,0.15));
        }
        .ctrl-btn:hover {
            opacity: 1;
            transform: scale(1.08);
        }
        .ctrl-btn.hide-btn:hover {
            transform: scale(1.08) rotate(0deg);
        }
        .ctrl-btn.settings-btn:hover {
            transform: scale(1.08) rotate(60deg);
        }
        .ctrl-btn.hide-btn.active {
            background: rgba(231, 76, 60, 0.3);
            border-color: #e74c3c;
            opacity: 0.8;
        }

        /* 🆕 全局隐藏模式：所有 UI 隐藏，只留背景和底部控制栏 */
        body.ui-hidden .main-container,
        body.ui-hidden #toast,
        body.ui-hidden #visitToast {
            opacity: 0 !important;
            pointer-events: none !important;
        }
        /* 但设置面板如果是激活状态，必须可交互且可见 */
        body.ui-hidden .settings-overlay:not(.active) {
            opacity: 0 !important;
            pointer-events: none !important;
        }
        body.ui-hidden .settings-overlay.active {
            opacity: 1 !important;
            pointer-events: auto !important;
        }
        /* 底部控制栏本身保留可见 */
        body.ui-hidden .bottom-controls {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        /* ===== 设置面板 ===== */
        .settings-overlay {
            position: fixed;
            inset: 0;
            z-index: 1600;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            animation: overlayIn 0.25s ease-out;
        }
        .settings-overlay.active {
            display: flex;
        }
        @keyframes overlayIn {
            0% { opacity: 0; backdrop-filter: blur(0px); }
            100% { opacity: 1; backdrop-filter: blur(6px); }
        }

        .settings-panel {
            max-width: 420px;
            width: 90%;
            padding: 2rem 2rem 1.8rem;
            border-radius: 1.8rem;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 90vh;
            overflow-y: auto;
            text-align: center;
            background: var(--settings-panel-bg, rgba(12,22,12,0.92));
            border-color: var(--settings-panel-border, rgba(255,255,255,0.06));
        }
        @keyframes modalPop {
            0% { transform: scale(0.92) translateY(16px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .settings-panel .panel-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
            color: var(--text-color, #c8e6c9);
        }
        .settings-panel .panel-sub {
            font-size: 0.85rem;
            opacity: 0.4;
            margin-bottom: 1.2rem;
            color: var(--text-color, #c8e6c9);
        }

        .settings-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }
        .settings-group label {
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0.6;
            display: block;
            margin-bottom: 0.4rem;
            color: var(--text-color, #c8e6c9);
        }
        .settings-group .options {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .settings-group .options .opt-btn {
            padding: 0.3rem 1.2rem;
            border-radius: 2rem;
            border: 1px solid rgba(128,128,128,0.15);
            background: transparent;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0.5;
            color: var(--text-color, #c8e6c9);
        }
        .settings-group .options .opt-btn:hover {
            opacity: 0.8;
            background: rgba(128,128,128,0.05);
        }
        .settings-group .options .opt-btn.active {
            opacity: 1;
            border-color: currentColor;
            background: rgba(128,128,128,0.08);
        }
        .settings-panel .panel-actions {
            display: flex;
            gap: 0.6rem;
            justify-content: flex-end;
            margin-top: 0.8rem;
        }
        .settings-panel .panel-actions .btn {
            padding: 0.4rem 1.4rem;
            border-radius: 2rem;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .settings-panel .panel-actions .btn-primary {
            background: #66bb6a;
            color: #1a2e1a;
        }
        .settings-panel .panel-actions .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102,187,106,0.25);
        }
        .settings-panel .panel-actions .btn-secondary {
            background: transparent;
            border: 1px solid rgba(128,128,128,0.15);
            color: var(--text-color, #c8e6c9);
        }
        .settings-panel .panel-actions .btn-secondary:hover {
            background: rgba(128,128,128,0.06);
        }

        /* ===== 🆕 背景图选择（CSS 变量） ===== */
        /* 背景图映射，由 data-bg 属性控制 */
        html[data-bg="food"] { --bg-image: url('background1.webp'); }
        html[data-bg="trip"] { --bg-image: url('background2.webp'); }
        html[data-bg="electric1"] { --bg-image: url('background3.webp'); }
        html[data-bg="electric2"] { --bg-image: url('background4.webp'); }

        /* ===== 响应式 ===== */
        @media (max-width: 860px) {
            .main-container { flex-direction: column; align-items: center; gap: 1.2rem; }
            .card, .stats-card { flex: 1 1 auto; width: 100%; max-width: 580px; padding: 2rem 1.8rem; }
            .stats-card { max-width: 580px; padding: 1.6rem 1.5rem; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .bottom-controls { bottom: 20px; right: 20px; }
            .ctrl-btn { width: 42px; height: 42px; font-size: 1rem; }
        }
        @media (max-width: 480px) {
            .card { padding: 1.8rem 1.2rem; }
            .card h1 { font-size: 2rem; min-height: 3rem; }
            .card .sub { font-size: 1rem; }
            .card .desc { font-size: 0.95rem; }
            .btn-primary { font-size: 1.05rem; padding: 0.6rem 1.8rem; }
            .btn-secondary { font-size: 0.85rem; padding: 0.4rem 1.2rem; }
            .button-group { gap: 0.8rem; }
            .nav-menu { gap: 1rem; }
            .nav-link { font-size: 0.9rem; }
            .stats-card { padding: 1.2rem 1rem; }
            .stats-item .number { font-size: 1.4rem; }
            .stats-grid { gap: 0.5rem; }
            .stats-item { padding: 0.5rem 0.3rem; }
            .stats-section-title { font-size: 1.2rem; }
            .settings-panel { padding: 1.5rem; }
            .bottom-controls { bottom: 15px; right: 15px; gap: 0.4rem; }
            .ctrl-btn { width: 38px; height: 38px; font-size: 0.9rem; }
        }
        @media (max-width: 359px) {
            .card h1 { font-size: 1.6rem; min-height: 2.6rem; }
            .card { padding: 1.2rem 0.8rem; }
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 0.4rem; }
            .stats-item .number { font-size: 1.2rem; }
            .stats-item.full-width .number { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <!-- ===== 加载层 ===== -->
    <div id="loader"></div>

    <!-- ===== Toast ===== -->
    <div id="toast" class="toast">💡 推荐使用 <span class="highlight">电脑横屏</span> 访问</div>
    <div id="visitToast" class="toast"></div>

    <!-- ===== 主容器 ===== -->
    <div class="main-container">

        <!-- ===== 主卡片 ===== -->
        <div class="card card-narrow" id="mainCard">
            <h1 class="typing-title">🌿 虚空终端</h1>
            <div class="sub fade-in-up delay-2">— Kukuz 分享页 —</div>
            <div class="divider fade-in-up delay-3"></div>

            <div class="nav-menu fade-in-up delay-4">
                <a href="index.html" class="nav-link active">🏠 首页</a>
                <a href="about.html" class="nav-link">📖 关于</a>
            </div>

            <p class="desc fade-in-up delay-5">
                万物虚寂，终有回响。<br>
                在这里，分享灵感、技术与我眼中的世界。
            </p>

            <!-- ===== 按钮组（已修改） ===== -->
            <div class="button-group fade-in-up delay-6">
                <a href="VOID.html" class="btn btn-primary">📝 阅读文章</a>
                <a href="MT.html" class="btn btn-primary">🛠️ 使用工具</a>
                <a href="RP.html" class="btn btn-primary">📦 浏览资源</a>
                <a href="GG.html" class="btn btn-primary">🎮 游玩游戏</a>
                <a href="contact.html" class="btn btn-primary">🤝 交朋友</a>
            </div>

            <div class="footer fade-in-up delay-7">
                ✦ 随时更新 · 欢迎来访 ✦ &nbsp;·&nbsp; 🐙 <a href="https://github.com/ku-134" target="_blank">ku-134</a>
            </div>
        </div>

        <!-- ===== 统计卡片 ===== -->
        <div class="stats-card" id="statsCard">

            <div class="stats-section-title fade-in-up delay-2">📊 本站数据</div>
            <div class="stats-grid fade-in-up delay-3">
                <div class="stats-item" id="uvItem">
                    <div class="label">🌐 独立访客</div>
                    <div class="number-wrap">
                        <span class="number" id="busuanzi_value_site_uv">加载中...</span>
                        <span class="delta hidden" id="uvDelta"></span>
                    </div>
                    <div class="sub">已访问本站</div>
                </div>
                <div class="stats-item" id="pvItem">
                    <div class="label">👁️ 总访问量</div>
                    <div class="number-wrap">
                        <span class="number" id="busuanzi_value_site_pv">加载中...</span>
                        <span class="delta hidden" id="pvDelta"></span>
                    </div>
                    <div class="sub">本站被访问</div>
                </div>
            </div>

            <div class="stats-section-title fade-in-up delay-4">📊 我的数据</div>
            <div class="stats-grid fade-in-up delay-5">
                <div class="stats-item local">
                    <div class="label">🔗 资源跳转</div>
                    <div class="number-wrap">
                        <span class="number" id="localClicks">0</span>
                        <span class="delta hidden" id="clicksDelta"></span>
                    </div>
                    <div class="sub">你成功跳转了</div>
                </div>
                <div class="stats-item local">
                    <div class="label">⭐ 资源收藏</div>
                    <div class="number-wrap">
                        <span class="number" id="localFavs">0</span>
                        <span class="delta hidden" id="favsDelta"></span>
                    </div>
                    <div class="sub">你收藏了</div>
                </div>
            </div>

            <div class="stats-grid fade-in-up delay-5">
                <div class="stats-item local full-width" id="gameEntryItem">
                    <div class="label">🎮 游戏进入</div>
                    <div class="number-wrap">
                        <span class="number" id="localGameEntry">0</span>
                        <span class="delta hidden" id="gameEntryDelta"></span>
                    </div>
                    <div class="sub">你进入了游戏</div>
                </div>
            </div>

            <div class="stats-grid fade-in-up delay-6">
                <div class="stats-item local full-width highlight" id="recommendItem">
                    <div class="label">📤 资源推荐</div>
                    <div class="number-wrap">
                        <span class="number" id="localRecommend">0</span>
                        <span class="delta hidden" id="recommendDelta"></span>
                    </div>
                    <div class="sub">你推荐的资源</div>
                </div>
            </div>

        </div>

    </div>

    <!-- ===== 不蒜子统计脚本 ===== -->
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

    <script src="script.js"></script>
    <script>
        (function() {
            'use strict';

            // ---------- 生成加载代码块 ----------
            const loader = document.getElementById('loader');
            const codeSnippets = [
                'ku', '</html>', '<div>', '</div>', 'function()', 'var', 'let', 'const',
                'Nahida', 'extends', 'return', 'if', 'else', 'for', 'while', 'try', 'catch',
                'console.log', 'import', 'export', 'default', 'async', 'await', '=>',
                '{ }', '[ ]', '( )', '===', '!==', '&&', '||', '++', '--',
                'npm install', 'git commit', '知识，与你分享', '42', 'true', 'false',
                '加载中...', 'undefined', 'NaN', 'Infinity', 'Promise', 'resolve',
                'fetch', 'then', 'catch', 'finally', 'throw', 'new', 'this',
                'super', 'static', 'get', 'set', 'yield', 'generator'
            ];
            for (let i = 0; i < 45; i++) {
                const span = document.createElement('span');
                span.className = 'code-block';
                let text = '';
                const count = Math.floor(Math.random() * 3) + 1;
                for (let j = 0; j < count; j++) {
                    text += codeSnippets[Math.floor(Math.random() * codeSnippets.length)];
                    if (j < count - 1) text += ' ';
                }
                span.textContent = text;
                span.style.left = Math.random() * 90 + 5 + '%';
                span.style.top = Math.random() * 90 + 5 + '%';
                span.style.fontSize = (Math.random() * 18 + 10) + 'px';
                span.style.animationDelay = (Math.random() * 5) + 's';
                span.style.animationDuration = (Math.random() * 4 + 2) + 's';
                span.style.opacity = Math.random() * 0.5 + 0.2;
                loader.appendChild(span);
            }

            // ---------- 预加载背景图 ----------
            const bgImage = new Image();
            const computedStyle = getComputedStyle(document.body);
            const bgUrl = computedStyle.backgroundImage;
            const match = bgUrl.match(/url\(["']?([^"')]+)["']?\)/);
            const imageUrl = match ? match[1] : 'background.webp';

            const mainCard = document.getElementById('mainCard');
            const statsCard = document.getElementById('statsCard');

            function showAll() {
                mainCard.classList.add('show');
                statsCard.classList.add('show');
            }

            function onBackgroundLoaded() {
                loader.classList.add('hide');
                showAll();
            }

            bgImage.src = imageUrl;
            if (bgImage.complete && bgImage.naturalWidth > 0) {
                onBackgroundLoaded();
            } else {
                bgImage.addEventListener('load', onBackgroundLoaded);
                bgImage.addEventListener('error', function() { onBackgroundLoaded(); });
                setTimeout(function() {
                    if (!loader.classList.contains('hide')) onBackgroundLoaded();
                }, 5000);
            }

            // ---------- Toast 提示 ----------
            if (/Mobi|Android|iPhone|iPad|iPod|BlackBerry|Opera Mini|IEMobile/i.test(navigator.userAgent) ||
                window.matchMedia('(orientation: portrait)').matches) {
                setTimeout(function() {
                    document.getElementById('toast').classList.add('show');
                    setTimeout(function() { document.getElementById('toast').classList.remove('show'); }, 4500);
                }, 1200);
            }

            // ---------- 访客足迹 ----------
            function showVisitToast() {
                const el = document.getElementById('visitToast');
                const last = localStorage.getItem('lastVisit');
                const now = Date.now();
                let msg = '';
                if (!last) msg = '👋 欢迎首次访问！';
                else {
                    const days = Math.floor((now - parseInt(last)) / (1000 * 60 * 60 * 24));
                    if (days === 0) msg = '👋 欢迎回来，今天已经来过啦！';
                    else if (days === 1) msg = '👋 欢迎回来，昨天刚来过～';
                    else msg = '👋 欢迎回来，上次访问是 ' + days + ' 天前';
                }
                el.textContent = msg;
                el.classList.add('show');
                setTimeout(function() { el.classList.remove('show'); }, 4500);
                localStorage.setItem('lastVisit', String(now));
            }
            setTimeout(showVisitToast, 1600);

            // ============================================================
            // 📊 统计卡片变化量对比逻辑
            // ============================================================

            function getNumberFromEl(id) {
                const el = document.getElementById(id);
                if (!el) return 0;
                const text = el.textContent.trim();
                const num = parseInt(text.replace(/[^0-9]/g, ''));
                return isNaN(num) ? 0 : num;
            }

            function getCache() {
                try {
                    const data = localStorage.getItem('statsCache');
                    return data ? JSON.parse(data) : {};
                } catch (e) {
                    return {};
                }
            }

            function saveCache(cache) {
                localStorage.setItem('statsCache', JSON.stringify(cache));
            }

            function updateDelta(deltaId, current, previous) {
                const el = document.getElementById(deltaId);
                if (!el) return;
                if (previous === undefined || previous === null) {
                    el.textContent = '';
                    el.className = 'delta hidden';
                    return;
                }
                const diff = current - previous;
                if (diff === 0) {
                    el.textContent = '';
                    el.className = 'delta hidden';
                    return;
                }
                el.textContent = (diff > 0 ? '↑' : '↓') + Math.abs(diff);
                el.className = 'delta' + (diff < 0 ? ' negative' : '');
            }

            function updateStatsWithDelta() {
                const currentUV = getNumberFromEl('busuanzi_value_site_uv');
                const currentPV = getNumberFromEl('busuanzi_value_site_pv');
                const currentClicks = getNumberFromEl('localClicks');
                const currentFavs = getNumberFromEl('localFavs');
                const currentRecommend = getNumberFromEl('localRecommend');
                const currentGameEntry = getNumberFromEl('localGameEntry');
                const cache = getCache();

                updateDelta('uvDelta', currentUV, cache.uv);
                updateDelta('pvDelta', currentPV, cache.pv);
                updateDelta('clicksDelta', currentClicks, cache.clicks);
                updateDelta('favsDelta', currentFavs, cache.favs);
                updateDelta('recommendDelta', currentRecommend, cache.recommend);
                updateDelta('gameEntryDelta', currentGameEntry, cache.gameEntry);

                cache.uv = currentUV;
                cache.pv = currentPV;
                cache.clicks = currentClicks;
                cache.favs = currentFavs;
                cache.recommend = currentRecommend;
                cache.gameEntry = currentGameEntry;
                saveCache(cache);
            }

            function waitForBusuanzi() {
                const uvEl = document.getElementById('busuanzi_value_site_uv');
                if (uvEl && uvEl.textContent.trim() !== '' && uvEl.textContent.trim() !== '加载中...') {
                    updateStatsWithDelta();
                } else {
                    let attempts = 0;
                    const interval = setInterval(function() {
                        attempts++;
                        const uv = document.getElementById('busuanzi_value_site_uv');
                        if (uv && uv.textContent.trim() !== '' && uv.textContent.trim() !== '加载中...') {
                            clearInterval(interval);
                            updateStatsWithDelta();
                        } else if (attempts > 16) {
                            clearInterval(interval);
                            updateStatsWithDelta();
                        }
                    }, 500);
                }
            }

            function updateLocalStats() {
                try {
                    const clicks = JSON.parse(localStorage.getItem('resourceClicks') || '{}');
                    document.getElementById('localClicks').textContent = clicks._total || 0;
                    const favs = JSON.parse(localStorage.getItem('favorites') || '[]');
                    document.getElementById('localFavs').textContent = favs.length;
                    const recommends = parseInt(localStorage.getItem('recommendSubmitCount') || '0');
                    document.getElementById('localRecommend').textContent = recommends;
                    const gameEntry = parseInt(localStorage.getItem('gameEntryCount') || '0');
                    document.getElementById('localGameEntry').textContent = gameEntry;
                } catch (e) { /* 静默降级 */ }
            }

            updateLocalStats();
            setTimeout(waitForBusuanzi, 1000);

            window.addEventListener('storage', function(e) {
                if (e.key === 'resourceClicks' || e.key === 'favorites' || e.key === 'recommendSubmitCount' || e.key === 'gameEntryCount') {
                    updateLocalStats();
                    setTimeout(function() {
                        const cache = getCache();
                        updateDelta('uvDelta', getNumberFromEl('busuanzi_value_site_uv'), cache.uv);
                        updateDelta('pvDelta', getNumberFromEl('busuanzi_value_site_pv'), cache.pv);
                        updateDelta('clicksDelta', getNumberFromEl('localClicks'), cache.clicks);
                        updateDelta('favsDelta', getNumberFromEl('localFavs'), cache.favs);
                        updateDelta('recommendDelta', getNumberFromEl('localRecommend'), cache.recommend);
                        updateDelta('gameEntryDelta', getNumberFromEl('localGameEntry'), cache.gameEntry);
                        cache.uv = getNumberFromEl('busuanzi_value_site_uv');
                        cache.pv = getNumberFromEl('busuanzi_value_site_pv');
                        cache.clicks = getNumberFromEl('localClicks');
                        cache.favs = getNumberFromEl('localFavs');
                        cache.recommend = getNumberFromEl('localRecommend');
                        cache.gameEntry = getNumberFromEl('localGameEntry');
                        saveCache(cache);
                    }, 500);
                }
            });

            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    updateLocalStats();
                    setTimeout(updateStatsWithDelta, 300);
                }
            });

        })();
    </script>

    <script src="global-ui.js"></script>
</body>
