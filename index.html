<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚空终端 · Kukuz分享页</title>
    <link rel="preload" as="image" href="background.webp">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== 入场动画 ===== */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: var(--loader-bg, #0d1a0d);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1.2s ease;
            pointer-events: none;
        }
        #loader.hide {
            opacity: 0;
            pointer-events: none;
        }
        .code-block {
            position: absolute;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: var(--code-color, #66bb6a);
            opacity: 0;
            animation: codeFade 3s ease-in-out infinite alternate;
            user-select: none;
            white-space: nowrap;
            text-shadow: 0 0 8px var(--code-glow, rgba(102, 187, 106, 0.3));
        }
        @keyframes codeFade {
            0% { opacity: 0; transform: translateY(-10px) scale(0.95); }
            50% { opacity: 0.9; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(10px) scale(0.95); }
        }
        @media (prefers-color-scheme: light) {
            #loader { --loader-bg: #f0f5f0; }
            .code-block { --code-color: #1b5e20; --code-glow: rgba(27, 94, 32, 0.2); }
        }
        @media (prefers-color-scheme: dark) {
            #loader { --loader-bg: #0d1a0d; }
            .code-block { --code-color: #66bb6a; --code-glow: rgba(102, 187, 106, 0.3); }
        }

        /* ===== 主容器 ===== */
        .main-container {
            display: flex;
            gap: 1.5rem;
            max-width: 1100px;
            width: 100%;
            align-items: stretch;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ===== 主卡片 ===== */
        .card {
            flex: 1 1 420px;
            max-width: 580px;
            padding: 2.8rem 2.5rem;
            border-radius: 2rem;
            text-align: center;
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: background 0.3s, color 0.3s, border-color 0.3s, opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            transform: translateY(40px) scale(0.96);
        }
        .card.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .card-narrow {
            max-width: 580px;
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
        }

        /* ===== 统计卡片 ===== */
        .stats-card {
            flex: 0 0 340px;
            max-width: 420px;
            padding: 2rem 1.8rem;
            border-radius: 2rem;
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: background 0.3s, color 0.3s, border-color 0.3s, opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            transform: translateY(40px) scale(0.96);
            display: flex;
            flex-direction: column;
        }
        .stats-card.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* ===== 统计卡片内部 ===== */
        /* 大标题 */
        .stats-section-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            margin: 0 0 0.4rem 0;
            color: inherit;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .stats-section-title:not(:first-of-type) {
            margin-top: 0.8rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }
        .stats-item {
            background: rgba(128, 128, 128, 0.05);
            border: 1px solid rgba(128, 128, 128, 0.06);
            border-radius: 1rem;
            padding: 0.7rem 0.5rem;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }
        .stats-item:hover {
            transform: translateY(-2px);
            border-color: rgba(128, 128, 128, 0.15);
        }
        .stats-item .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.35;
            margin-bottom: 0.1rem;
        }
        .stats-item .number-wrap {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 0.3rem;
        }
        .stats-item .number {
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.3;
        }
        .stats-item .number.loading {
            opacity: 0.3;
            font-weight: 400;
            font-size: 1.4rem;
        }
        .stats-item .delta {
            font-size: 0.7rem;
            font-weight: 600;
            color: #66bb6a;
            transition: opacity 0.3s;
            white-space: nowrap;
        }
        .stats-item .delta.negative {
            color: #e74c3c;
        }
        .stats-item .delta.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .stats-item .sub {
            font-size: 0.55rem;
            opacity: 0.2;
            margin-top: 0.05rem;
        }
        /* 本地数据特殊标识 */
        .stats-item.local .number {
            color: #f5a623;
        }
        .stats-item.local .label {
            opacity: 0.25;
        }
        @media (prefers-color-scheme: light) {
            .stats-item.local .number { color: #d48c1a; }
            .stats-item .delta { color: #2e7d32; }
            .stats-item .delta.negative { color: #c0392b; }
        }

        /* 跨两列卡片 */
        .stats-item.full-width {
            grid-column: 1 / -1;
        }
        .stats-item.full-width .number {
            font-size: 2.2rem;
        }
        .stats-item.highlight .number {
            color: #e74c3c;
            text-shadow: 0 0 16px rgba(231, 76, 60, 0.15);
        }
        @media (prefers-color-scheme: dark) {
            .stats-item.highlight .number { color: #ff6b6b; }
        }

        /* ===== 亮色模式 ===== */
        @media (prefers-color-scheme: light) {
            .card, .stats-card {
                background: rgba(255, 255, 255, 0.68);
                color: #1a3b1a;
                border-color: rgba(80, 160, 80, 0.2);
                box-shadow: 0 20px 60px rgba(0, 40, 0, 0.12);
            }
            .card h1 { color: #1a4f1a; }
            .card .sub { color: #2d5e2d; }
            .card .divider { background: rgba(60, 140, 60, 0.2); }
            .card .footer { color: #3d6b3d; }
            .stats-item { background: rgba(0, 0, 0, 0.03); }
        }

        /* ===== 深色模式 ===== */
        @media (prefers-color-scheme: dark) {
            .card, .stats-card {
                background: rgba(10, 20, 10, 0.72);
                color: #c8e6c9;
                border-color: rgba(60, 140, 60, 0.25);
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            }
            .card h1 { color: #a5d6a7; }
            .card .sub { color: #81c784; }
            .card .divider { background: rgba(100, 200, 100, 0.15); }
            .card .footer { color: #6f9e76; }
            .stats-item { background: rgba(255, 255, 255, 0.03); }
        }

        /* ===== 主卡片内部 ===== */
        .card h1 {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            margin-bottom: 0.4rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            min-height: 4rem;
        }
        .card .sub {
            font-size: 1.1rem;
            font-weight: 400;
            opacity: 0.9;
            margin-bottom: 1.2rem;
        }
        .card .divider {
            width: 80px;
            height: 3px;
            border-radius: 4px;
            margin: 0.8rem auto 1.2rem;
        }
        .card .desc {
            font-size: 1rem;
            line-height: 1.7;
            max-width: 500px;
            margin: 0 auto 1.8rem;
            opacity: 0.85;
        }
        .card .footer {
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            opacity: 0.7;
            margin-top: 0.5rem;
        }
        .card .footer a {
            text-decoration: none;
            border-bottom: 1px dotted rgba(128, 128, 128, 0.3);
        }
        .card .footer a:hover {
            border-bottom-color: currentColor;
        }

        /* ===== 导航 ===== */
        .nav-menu {
            display: flex;
            justify-content: center;
            gap: 1.8rem;
            margin: 0.8rem 0 0.2rem 0;
            flex-wrap: wrap;
        }
        .nav-link {
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            padding: 0.3rem 0.2rem;
            border-bottom: 2px solid transparent;
            transition: all 0.25s ease;
            color: inherit;
            opacity: 0.75;
        }
        .nav-link:hover {
            opacity: 1;
            border-bottom-color: currentColor;
            transform: translateY(-1px);
        }
        .nav-link.active {
            opacity: 1;
            border-bottom-color: currentColor;
            font-weight: 600;
        }

        /* ===== 按钮 ===== */
        .button-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.2rem;
            margin: 1.5rem 0 1.8rem 0;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            font-weight: 600;
            text-decoration: none;
            border-radius: 3rem;
            transition: all 0.25s ease;
            border: 2px solid transparent;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-primary {
            font-size: 1.25rem;
            padding: 0.75rem 2.4rem;
            background: #1b5e20;
            border-color: #1b5e20;
            color: #fff;
            box-shadow: 0 4px 12px rgba(27, 94, 32, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(27, 94, 32, 0.4);
            background: #2e7d32;
            border-color: #2e7d32;
        }
        .btn-secondary {
            font-size: 0.95rem;
            padding: 0.5rem 1.6rem;
            background: transparent;
            border-color: currentColor;
            color: inherit;
            opacity: 0.8;
        }
        .btn-secondary:hover {
            opacity: 1;
            transform: translateY(-2px);
            background: currentColor;
            color: #fff;
        }
        @media (prefers-color-scheme: dark) {
            .btn-primary {
                background: #66bb6a;
                border-color: #66bb6a;
                color: #1a2e1a;
                box-shadow: 0 4px 12px rgba(102, 187, 106, 0.3);
            }
            .btn-primary:hover {
                background: #81c784;
                border-color: #81c784;
                color: #1a2e1a;
                box-shadow: 0 8px 24px rgba(102, 187, 106, 0.4);
            }
            .btn-secondary:hover {
                background: #66bb6a;
                border-color: #66bb6a;
                color: #1a2e1a;
            }
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            z-index: 2000;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 12px 28px;
            border-radius: 2rem;
            font-size: 1rem;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast .highlight {
            color: #a5d6a7;
            font-weight: 700;
        }
        #toast { bottom: 30px; }
        #visitToast { bottom: 90px; }
        @media (max-width: 480px) {
            .toast { font-size: 0.85rem; padding: 10px 18px; white-space: normal; max-width: 90%; }
            #toast { bottom: 20px; }
            #visitToast { bottom: 80px; }
        }
        @media (prefers-color-scheme: light) {
            .toast { background: rgba(255,255,255,0.9); color: #1a3b1a; border-color: rgba(0,0,0,0.05); }
            .toast .highlight { color: #1b5e20; }
        }

        /* ===== 入场延迟工具 ===== */
        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.3s; }
        .delay-3 { animation-delay: 0.5s; }
        .delay-4 { animation-delay: 0.7s; }
        .delay-5 { animation-delay: 0.9s; }
        .delay-6 { animation-delay: 1.1s; }
        .delay-7 { animation-delay: 1.3s; }

        /* ===== 打字机 ===== */
        .typing-title {
            display: inline-block;
        }
        .typing-title .char {
            display: inline-block;
            opacity: 0;
            transform: translateY(-40px) scale(0.8);
            animation: charDrop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes charDrop {
            0% { opacity: 0; transform: translateY(-40px) scale(0.8); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .typing-title .cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: currentColor;
            margin-left: 2px;
            animation: blink 0.8s step-end infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 860px) {
            .main-container { flex-direction: column; align-items: center; gap: 1.2rem; }
            .card, .stats-card { flex: 1 1 auto; width: 100%; max-width: 580px; padding: 2rem 1.8rem; }
            .stats-card { max-width: 580px; padding: 1.6rem 1.5rem; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .card { padding: 1.8rem 1.2rem; }
            .card h1 { font-size: 2rem; min-height: 3rem; }
            .card .sub { font-size: 1rem; }
            .card .desc { font-size: 0.95rem; }
            .btn-primary { font-size: 1.05rem; padding: 0.6rem 1.8rem; }
            .btn-secondary { font-size: 0.85rem; padding: 0.4rem 1.2rem; }
            .button-group { gap: 0.8rem; }
            .nav-menu { gap: 1rem; }
            .nav-link { font-size: 0.9rem; }
            .stats-card { padding: 1.2rem 1rem; }
            .stats-item .number { font-size: 1.4rem; }
            .stats-grid { gap: 0.5rem; }
            .stats-item { padding: 0.5rem 0.3rem; }
            .stats-section-title { font-size: 1.2rem; }
        }
        @media (max-width: 359px) {
            .card h1 { font-size: 1.6rem; min-height: 2.6rem; }
            .card { padding: 1.2rem 0.8rem; }
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 0.4rem; }
            .stats-item .number { font-size: 1.2rem; }
            .stats-item.full-width .number { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <!-- ===== 加载层 ===== -->
    <div id="loader"></div>

    <!-- ===== Toast ===== -->
    <div id="toast" class="toast">💡 推荐使用 <span class="highlight">电脑横屏</span> 访问</div>
    <div id="visitToast" class="toast"></div>

    <!-- ===== 主容器 ===== -->
    <div class="main-container">

        <!-- ===== 主卡片 ===== -->
        <div class="card card-narrow" id="mainCard">
            <h1 class="typing-title">🌿 虚空终端</h1>
            <div class="sub fade-in-up delay-2">— Kukuz 分享页 —</div>
            <div class="divider fade-in-up delay-3"></div>

            <div class="nav-menu fade-in-up delay-4">
                <a href="index.html" class="nav-link active">🏠 首页</a>
                <a href="about.html" class="nav-link">📖 关于</a>
            </div>

            <p class="desc fade-in-up delay-5">
                万物虚寂，终有回响。<br>
                在这里，分享灵感、技术与我眼中的世界。
            </p>

            <div class="button-group fade-in-up delay-6">
                <a href="RP.html" class="btn btn-primary">📦 我的资源</a>
                <a href="#" class="btn btn-secondary">📝 我的文章</a>
                <a href="#" class="btn btn-secondary">🎮 我的游戏</a>
                <a href="contact.html" class="btn btn-secondary">🤝 交朋友</a>
            </div>

            <div class="footer fade-in-up delay-7">
                ✦ 随时更新 · 欢迎来访 ✦ &nbsp;·&nbsp; 🐙 <a href="https://github.com/ku-134" target="_blank">ku-134</a>
            </div>
        </div>

        <!-- ===== 统计卡片 ===== -->
        <div class="stats-card" id="statsCard">

            <!-- 本站数据 -->
            <div class="stats-section-title fade-in-up delay-2">📊 本站数据</div>
            <div class="stats-grid fade-in-up delay-3">
                <div class="stats-item" id="uvItem">
                    <div class="label">🌐 独立访客</div>
                    <div class="number-wrap">
                        <span class="number" id="busuanzi_value_site_uv">加载中...</span>
                        <span class="delta hidden" id="uvDelta"></span>
                    </div>
                    <div class="sub">已访问本站</div>
                </div>
                <div class="stats-item" id="pvItem">
                    <div class="label">👁️ 总访问量</div>
                    <div class="number-wrap">
                        <span class="number" id="busuanzi_value_site_pv">加载中...</span>
                        <span class="delta hidden" id="pvDelta"></span>
                    </div>
                    <div class="sub">本站被访问</div>
                </div>
            </div>

            <!-- 我的数据 -->
            <div class="stats-section-title fade-in-up delay-4">📊 我的数据</div>
            <div class="stats-grid fade-in-up delay-5">
                <div class="stats-item local">
                    <div class="label">🔗 资源跳转</div>
                    <div class="number-wrap">
                        <span class="number" id="localClicks">0</span>
                        <span class="delta hidden" id="clicksDelta"></span>
                    </div>
                    <div class="sub">你成功跳转了</div>
                </div>
                <div class="stats-item local">
                    <div class="label">⭐ 资源收藏</div>
                    <div class="number-wrap">
                        <span class="number" id="localFavs">0</span>
                        <span class="delta hidden" id="favsDelta"></span>
                    </div>
                    <div class="sub">你收藏了</div>
                </div>
            </div>

            <!-- 新增：你推荐的资源次数 -->
            <div class="stats-grid fade-in-up delay-6">
                <div class="stats-item local full-width highlight" id="recommendItem">
                    <div class="label">📤 资源推荐</div>
                    <div class="number-wrap">
                        <span class="number" id="localRecommend">0</span>
                        <span class="delta hidden" id="recommendDelta"></span>
                    </div>
                    <div class="sub">你推荐的资源</div>
                </div>
            </div>

        </div>

    </div>

    <!-- ===== 不蒜子统计脚本 ===== -->
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

    <script src="script.js"></script>
    <script>
        (function() {
            'use strict';

            // ---------- 生成加载代码块 ----------
            const loader = document.getElementById('loader');
            const codeSnippets = [
                '<html>', '</html>', '<div>', '</div>', 'function()', 'var', 'let', 'const',
                'class', 'extends', 'return', 'if', 'else', 'for', 'while', 'try', 'catch',
                'console.log', 'import', 'export', 'default', 'async', 'await', '=>',
                '{ }', '[ ]', '( )', '===', '!==', '&&', '||', '++', '--',
                'npm install', 'git commit', 'Hello World', '42', 'true', 'false',
                'null', 'undefined', 'NaN', 'Infinity', 'Promise', 'resolve',
                'fetch', 'then', 'catch', 'finally', 'throw', 'new', 'this',
                'super', 'static', 'get', 'set', 'yield', 'generator'
            ];
            for (let i = 0; i < 45; i++) {
                const span = document.createElement('span');
                span.className = 'code-block';
                let text = '';
                const count = Math.floor(Math.random() * 3) + 1;
                for (let j = 0; j < count; j++) {
                    text += codeSnippets[Math.floor(Math.random() * codeSnippets.length)];
                    if (j < count - 1) text += ' ';
                }
                span.textContent = text;
                span.style.left = Math.random() * 90 + 5 + '%';
                span.style.top = Math.random() * 90 + 5 + '%';
                span.style.fontSize = (Math.random() * 18 + 10) + 'px';
                span.style.animationDelay = (Math.random() * 5) + 's';
                span.style.animationDuration = (Math.random() * 4 + 2) + 's';
                span.style.opacity = Math.random() * 0.5 + 0.2;
                loader.appendChild(span);
            }

            // ---------- 预加载背景图 ----------
            const bgImage = new Image();
            const computedStyle = getComputedStyle(document.body);
            const bgUrl = computedStyle.backgroundImage;
            const match = bgUrl.match(/url\(["']?([^"')]+)["']?\)/);
            const imageUrl = match ? match[1] : 'background.webp';

            function showCards() {
                document.getElementById('mainCard').classList.add('show');
                document.getElementById('statsCard').classList.add('show');
            }

            function onBackgroundLoaded() {
                loader.classList.add('hide');
                showCards();
            }

            bgImage.src = imageUrl;
            if (bgImage.complete && bgImage.naturalWidth > 0) {
                onBackgroundLoaded();
            } else {
                bgImage.addEventListener('load', onBackgroundLoaded);
                bgImage.addEventListener('error', function() { onBackgroundLoaded(); });
                setTimeout(function() {
                    if (!loader.classList.contains('hide')) onBackgroundLoaded();
                }, 5000);
            }

            // ---------- Toast 提示 ----------
            if (/Mobi|Android|iPhone|iPad|iPod|BlackBerry|Opera Mini|IEMobile/i.test(navigator.userAgent) ||
                window.matchMedia('(orientation: portrait)').matches) {
                setTimeout(function() {
                    document.getElementById('toast').classList.add('show');
                    setTimeout(function() { document.getElementById('toast').classList.remove('show'); }, 4500);
                }, 1200);
            }

            // ---------- 访客足迹 ----------
            function showVisitToast() {
                const el = document.getElementById('visitToast');
                const last = localStorage.getItem('lastVisit');
                const now = Date.now();
                let msg = '';
                if (!last) msg = '👋 欢迎首次访问！';
                else {
                    const days = Math.floor((now - parseInt(last)) / (1000 * 60 * 60 * 24));
                    if (days === 0) msg = '👋 欢迎回来，今天已经来过啦！';
                    else if (days === 1) msg = '👋 欢迎回来，昨天刚来过～';
                    else msg = '👋 欢迎回来，上次访问是 ' + days + ' 天前';
                }
                el.textContent = msg;
                el.classList.add('show');
                setTimeout(function() { el.classList.remove('show'); }, 4500);
                localStorage.setItem('lastVisit', String(now));
            }
            setTimeout(showVisitToast, 1600);

            // ============================================================
            // 📊 统计卡片变化量对比逻辑
            // ============================================================

            // ---------- 工具：获取元素数字 ----------
            function getNumberFromEl(id) {
                const el = document.getElementById(id);
                if (!el) return 0;
                const text = el.textContent.trim();
                const num = parseInt(text.replace(/[^0-9]/g, ''));
                return isNaN(num) ? 0 : num;
            }

            // ---------- 缓存读写 ----------
            function getCache() {
                try {
                    const data = localStorage.getItem('statsCache');
                    return data ? JSON.parse(data) : {};
                } catch (e) {
                    return {};
                }
            }

            function saveCache(cache) {
                localStorage.setItem('statsCache', JSON.stringify(cache));
            }

            // ---------- 更新单个 delta ----------
            function updateDelta(deltaId, current, previous, label) {
                const el = document.getElementById(deltaId);
                if (!el) return;
                if (previous === undefined || previous === null) {
                    el.textContent = '';
                    el.className = 'delta hidden';
                    return;
                }
                const diff = current - previous;
                if (diff === 0) {
                    el.textContent = '';
                    el.className = 'delta hidden';
                    return;
                }
                const prefix = diff > 0 ? '↑' : '↓';
                const sign = diff > 0 ? '' : '';
                el.textContent = prefix + Math.abs(diff);
                el.className = 'delta' + (diff < 0 ? ' negative' : '');
            }

            // ---------- 主更新函数 ----------
            function updateStatsWithDelta() {
                // 读取当前值
                const currentUV = getNumberFromEl('busuanzi_value_site_uv');
                const currentPV = getNumberFromEl('busuanzi_value_site_pv');
                const currentClicks = getNumberFromEl('localClicks');
                const currentFavs = getNumberFromEl('localFavs');
                const currentRecommend = getNumberFromEl('localRecommend');

                // 读取缓存
                const cache = getCache();

                // 更新 delta
                updateDelta('uvDelta', currentUV, cache.uv, '独立访客');
                updateDelta('pvDelta', currentPV, cache.pv, '总访问量');
                updateDelta('clicksDelta', currentClicks, cache.clicks, '资源跳转');
                updateDelta('favsDelta', currentFavs, cache.favs, '资源收藏');
                updateDelta('recommendDelta', currentRecommend, cache.recommend, '资源推荐');

                // 保存新缓存
                cache.uv = currentUV;
                cache.pv = currentPV;
                cache.clicks = currentClicks;
                cache.favs = currentFavs;
                cache.recommend = currentRecommend;
                saveCache(cache);
            }

            // ---------- 等待不蒜子加载 ----------
            function waitForBusuanzi() {
                const uvEl = document.getElementById('busuanzi_value_site_uv');
                if (uvEl && uvEl.textContent.trim() !== '' && uvEl.textContent.trim() !== '加载中...') {
                    // 数据已填充
                    updateStatsWithDelta();
                } else {
                    // 未加载，继续等待，最多 8 秒
                    let attempts = 0;
                    const interval = setInterval(function() {
                        attempts++;
                        const uv = document.getElementById('busuanzi_value_site_uv');
                        if (uv && uv.textContent.trim() !== '' && uv.textContent.trim() !== '加载中...') {
                            clearInterval(interval);
                            updateStatsWithDelta();
                        } else if (attempts > 16) { // 8秒
                            clearInterval(interval);
                            // 即使没有数据也尝试更新（显示当前值，无delta）
                            updateStatsWithDelta();
                        }
                    }, 500);
                }
            }

            // ---------- 读取本地数据并显示 ----------
            function updateLocalStats() {
                try {
                    const clicks = JSON.parse(localStorage.getItem('resourceClicks') || '{}');
                    document.getElementById('localClicks').textContent = clicks._total || 0;
                    const favs = JSON.parse(localStorage.getItem('favorites') || '[]');
                    document.getElementById('localFavs').textContent = favs.length;
                    const recommends = parseInt(localStorage.getItem('recommendSubmitCount') || '0');
                    document.getElementById('localRecommend').textContent = recommends;
                } catch (e) { /* 静默降级 */ }
            }

            // ---------- 初始化 ----------
            updateLocalStats();
            // 等待不蒜子加载完成后再更新delta
            setTimeout(waitForBusuanzi, 1000);

            // 监听 storage 变化（其他标签页修改时同步）
            window.addEventListener('storage', function(e) {
                if (e.key === 'resourceClicks' || e.key === 'favorites' || e.key === 'recommendSubmitCount') {
                    updateLocalStats();
                    // 延迟重新计算delta
                    setTimeout(function() {
                        const currentUV = getNumberFromEl('busuanzi_value_site_uv');
                        const currentPV = getNumberFromEl('busuanzi_value_site_pv');
                        const currentClicks = getNumberFromEl('localClicks');
                        const currentFavs = getNumberFromEl('localFavs');
                        const currentRecommend = getNumberFromEl('localRecommend');
                        const cache = getCache();
                        updateDelta('uvDelta', currentUV, cache.uv, '独立访客');
                        updateDelta('pvDelta', currentPV, cache.pv, '总访问量');
                        updateDelta('clicksDelta', currentClicks, cache.clicks, '资源跳转');
                        updateDelta('favsDelta', currentFavs, cache.favs, '资源收藏');
                        updateDelta('recommendDelta', currentRecommend, cache.recommend, '资源推荐');
                        // 更新缓存
                        cache.uv = currentUV;
                        cache.pv = currentPV;
                        cache.clicks = currentClicks;
                        cache.favs = currentFavs;
                        cache.recommend = currentRecommend;
                        saveCache(cache);
                    }, 500);
                }
            });

            // 不蒜子数据加载完成后会自动更新，但我们也轮询检查
            // 每5秒检查一次是否数据有更新（但不要频繁更新缓存，只在有变化时更新）
            // 这里简单处理：每次页面可见时刷新delta
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    updateLocalStats();
                    setTimeout(updateStatsWithDelta, 300);
                }
            });

        })();
    </script>

</body>
</html>
