<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VoidOS · 桌面</title>
    <link rel="stylesheet" href="style.css?v=0.3" />
</head>
<body>

    <!-- 桌面背景 -->
    <div id="desktop-bg"></div>

    <!-- 桌面元素容器（气泡弹窗、组件、应用图标） -->
    <div id="desktop"></div>

    <!-- Home 键（虚空之眼）：无前台→终端 / 有前台→返回 -->
    <div id="home-eye" title="虚空之眼">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle class="eye-ring" cx="50" cy="50" r="42" stroke="#8FB991" stroke-width="1.2" stroke-dasharray="4 8" opacity="0.5" />
            <circle class="eye-ring" cx="50" cy="50" r="36" stroke="#8FB991" stroke-width="0.8" stroke-dasharray="2 12" opacity="0.3" />
            <polygon class="eye-diamond" points="50,18 74,50 50,82 26,50" stroke="#8FB991" stroke-width="1.5" stroke-linejoin="round" opacity="0.7" />
            <polygon class="eye-diamond" points="50,26 66,50 50,74 34,50" stroke="#8FB991" stroke-width="0.8" stroke-linejoin="round" opacity="0.3" style="animation-direction: reverse; animation-duration: 4s;" />
            <circle class="eye-dot" cx="50" cy="50" r="4" fill="#8FB991" opacity="0.9" />
            <circle cx="50" cy="12" r="1.5" fill="#8FB991" opacity="0.25" />
            <circle cx="88" cy="50" r="1.5" fill="#8FB991" opacity="0.25" />
            <circle cx="50" cy="88" r="1.5" fill="#8FB991" opacity="0.25" />
            <circle cx="12" cy="50" r="1.5" fill="#8FB991" opacity="0.25" />
        </svg>
    </div>

    <!-- 终端命令栏：输出区 + 输入行 -->
    <div id="terminal-input-area">
        <div id="terminal-output"></div>
        <div class="terminal-row">
            <span class="prompt">❯</span>
            <input type="text" id="terminal-input" placeholder="输入命令 (help 查看帮助) ..." disabled autocomplete="off" spellcheck="false" />
        </div>
    </div>

    <!-- 缩放指示器 -->
    <div id="zoom-indicator">缩放: <span id="zoom-value">100%</span></div>

    <!-- 引擎模块 -->
    <script src="assets/js/core.js?v=0.3"></script>
    <script src="assets/js/apps.js?v=0.3"></script>
    <script src="assets/js/system.js?v=0.3"></script>
    <script src="assets/js/loader.js?v=0.3"></script>
</body>
</html>
