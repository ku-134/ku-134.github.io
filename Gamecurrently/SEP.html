<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肉鸽！贪吃！蛇！ · Kukuz</title>
    <link rel="preload" as="image" href="../background.webp">
    <link rel="stylesheet" href="../style.css">
    <!-- 引入独立游戏风格 -->
    <link rel="stylesheet" href="SHE-style.css">
    <style>
        /* ===== 游戏页专用样式（保留原框架） ===== */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
            background: #1a1a1a; /* 兜底背景 */
        }

        .game-container {
            max-width: 820px;
            width: 100%;
            padding: 2rem 2rem 2rem;
            border-radius: 2rem;
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: background 0.3s, color 0.3s, border-color 0.3s;
            background: rgba(10, 20, 10, 0.72);
            color: #c8e6c9;
            border-color: rgba(60, 140, 60, 0.3);
        }

        /* ----- 顶部导航栏 ----- */
        .game-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.8rem;
            border-bottom: 2px solid rgba(128, 128, 128, 0.08);
            margin-bottom: 1.2rem;
        }
        .game-nav .nav-btn {
            padding: 0.3rem 1.2rem;
            border-radius: 2rem;
            border: 1px solid currentColor;
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            opacity: 0.6;
            text-decoration: none;
            display: inline-block;
        }
        .game-nav .nav-btn:hover {
            opacity: 1;
            background: currentColor;
            color: #1a2e1a;
            transform: translateY(-2px);
        }
        .game-nav .game-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: center;
            flex: 1;
            margin: 0 1rem;
            white-space: nowrap;
        }

        /* ----- 游戏画面框（黑屏容器） ----- */
        .game-screen {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 1.2rem;
            border: 2px solid rgba(128, 128, 128, 0.15);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: border-color 0.3s;
            position: relative;
            overflow: hidden;
        }
        /* 游戏内所有绝对定位元素都基于此容器 */

        /* ----- 游戏操作框（手柄布局） ----- */
        .game-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0.5rem 0.2rem;
            border-top: 1px solid rgba(128, 128, 128, 0.08);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 3rem);
            grid-template-rows: repeat(3, 3rem);
            gap: 0.2rem;
            flex-shrink: 0;
        }
        .dpad-btn {
            background: rgba(128, 128, 128, 0.08);
            border: 1px solid rgba(128, 128, 128, 0.12);
            border-radius: 0.6rem;
            color: inherit;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            font-family: inherit;
        }
        .dpad-btn:hover {
            background: rgba(128, 128, 128, 0.18);
            transform: scale(0.96);
        }
        .dpad-btn:active {
            transform: scale(0.88);
            background: rgba(128, 128, 128, 0.25);
        }
        .dpad-btn.corner {
            visibility: hidden;
            pointer-events: none;
            border: none;
            background: transparent;
        }
        .dpad-center {
            background: transparent !important;
            border: none !important;
            cursor: default;
            pointer-events: none;
            font-size: 0.8rem;
            opacity: 0.3;
        }
        .dpad-btn.active-key {
            background: rgba(102, 187, 106, 0.3);
            border-color: rgba(102, 187, 106, 0.5);
            transform: scale(0.95);
        }

        .action-buttons {
            display: flex;
            gap: 0.8rem;
            flex-shrink: 0;
        }
        .action-btn {
            width: 3.8rem;
            height: 3.8rem;
            border-radius: 50%;
            border: 2px solid currentColor;
            background: transparent;
            color: inherit;
            font-size: 1.2rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.5;
        }
        .action-btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }
        .action-btn:active {
            transform: scale(0.9);
            background: currentColor;
            color: #fff;
        }
        .action-btn.a {
            border-color: #f5a623;
            color: #f5a623;
        }
        .action-btn.b {
            border-color: #e74c3c;
            color: #e74c3c;
        }
        .action-btn.start {
            width: 3rem;
            height: 2rem;
            border-radius: 1rem;
            font-size: 0.8rem;
            border-color: rgba(128, 128, 128, 0.3);
            color: inherit;
            opacity: 0.4;
        }
        .action-btn.start:hover {
            opacity: 0.7;
        }
        .action-btn.active-key {
            background: rgba(102, 187, 106, 0.2);
            border-color: rgba(102, 187, 106, 0.4);
            transform: scale(0.95);
        }

        @media (max-width: 600px) {
            .game-container { padding: 1.2rem 1rem; }
            .game-nav .game-title { font-size: 1.2rem; margin: 0 0.5rem; }
            .game-nav .nav-btn { font-size: 0.8rem; padding: 0.2rem 0.8rem; }
            .dpad { grid-template-columns: repeat(3, 2.4rem); grid-template-rows: repeat(3, 2.4rem); gap: 0.15rem; }
            .dpad-btn { font-size: 0.9rem; }
            .action-btn { width: 3rem; height: 3rem; font-size: 1rem; }
            .action-btn.start { width: 2.4rem; height: 1.6rem; font-size: 0.6rem; }
            .game-controls { justify-content: center; gap: 1.2rem; }
        }
        @media (max-width: 400px) {
            .game-nav { flex-wrap: wrap; justify-content: center; gap: 0.3rem; }
            .game-nav .game-title { order: 3; flex-basis: 100%; margin: 0.2rem 0; font-size: 1.1rem; }
            .dpad { grid-template-columns: repeat(3, 2rem); grid-template-rows: repeat(3, 2rem); }
            .action-btn { width: 2.6rem; height: 2.6rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- 导航栏 -->
        <div class="game-nav">
            <a href="../GG.html" class="nav-btn">← 返回</a>
            <span class="game-title">🐍 肉鸽！贪吃！蛇！</span>
            <button class="nav-btn" id="refreshBtn">⟳ 刷新</button>
        </div>

        <!-- 游戏画面框 -->
        <div class="game-screen" id="gameScreen">
            <!-- 初始提示（由 JS 控制显示/隐藏） -->
            <div id="startPrompt">按下「开始」后进入游戏</div>
            
            <!-- 蛇的容器（绝对定位，由 JS 控制移动） -->
            <div id="snakeContainer">
                <div id="snake">🐍</div>
            </div>

            <!-- 对话框容器（绝对定位） -->
            <div id="dialogueBox" style="display: none;">
                <div class="dialogue-arrow"></div>
                <div class="dialogue-speaker" id="dialogueSpeaker">？？？</div>
                <div class="dialogue-text" id="dialogueText"></div>
                <div class="dialogue-action-hint" id="dialogueActionHint">按 A 继续</div>
            </div>

            <!-- 选择对话框容器 -->
            <div id="choiceBox" style="display: none;">
                <div class="choice-question" id="choiceQuestion">你选择？</div>
                <div class="choice-options">
                    <button class="choice-btn" data-choice="tutorial">不了。（新手教程）</button>
                    <button class="choice-btn" data-choice="start">是的（直接开始）</button>
                </div>
            </div>
        </div>

        <!-- 游戏操作框 -->
        <div class="game-controls">
            <div class="dpad" id="dpad">
                <div class="dpad-btn corner"></div>
                <div class="dpad-btn" data-dir="up">↑</div>
                <div class="dpad-btn corner"></div>
                <div class="dpad-btn" data-dir="left">←</div>
                <div class="dpad-btn dpad-center">•</div>
                <div class="dpad-btn" data-dir="right">→</div>
                <div class="dpad-btn corner"></div>
                <div class="dpad-btn" data-dir="down">↓</div>
                <div class="dpad-btn corner"></div>
            </div>

            <div class="action-buttons">
                <button class="action-btn a" data-key="j">A</button>
                <button class="action-btn b" data-key="k">B</button>
                <button class="action-btn start" data-key="enter" id="startBtn">START</button>
            </div>
        </div>
    </div>

    <!-- 引入独立脚本 -->
    <script src="SHE-script.js"></script>
    <!-- 保留原有按键反馈脚本（可选，但为了兼容最好保留） -->
    <script src="../script.js"></script>
    <script>
        // 原有按键反馈（与游戏逻辑不冲突，保留作为界面反馈）
        (function() {
            'use strict';
            const screen = document.getElementById('gameScreen');
            const keyDisplay = document.getElementById('keyDisplay');
            const refreshBtn = document.getElementById('refreshBtn');
            const dpadBtns = document.querySelectorAll('.dpad-btn[data-dir]');
            const actionBtns = document.querySelectorAll('.action-btn[data-key]');

            if (refreshBtn) {
                refreshBtn.addEventListener('click', function() {
                    location.reload();
                });
            }

            // 这里只做高亮反馈，不做核心逻辑，核心逻辑在 SHE-script.js 中
        })();
    </script>
</body>
</html>
