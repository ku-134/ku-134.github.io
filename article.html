<!DOCTYPE html>
<html lang="zh-CN" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章阅读 · 虚空终端</title>
    <link rel="preload" as="image" href="background.webp">
    <link rel="preload" as="image" href="background1.webp">
    <link rel="preload" as="image" href="background2.webp">
    <link rel="preload" as="image" href="background3.webp">
    <link rel="preload" as="image" href="background4.webp">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ===== 文章阅读页专属样式 ===== */
        .article-container {
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
        }
        .article-card {
            padding: 2.2rem 2.2rem 2rem;
            border-radius: 2rem;
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }
        .article-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.2rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid rgba(128, 128, 128, 0.1);
        }
        .article-header .brand {
            font-size: 2rem;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
            letter-spacing: 0.02em;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .article-header .brand .typing-title {
            display: inline-block;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .article-header .nav-links {
            display: flex;
            gap: 1.5rem;
            font-size: 1.05rem;
        }
        .article-header .nav-links a {
            text-decoration: none;
            color: inherit;
            opacity: 0.7;
            transition: 0.25s;
            border-bottom: 2px solid transparent;
            padding-bottom: 2px;
        }
        .article-header .nav-links a:hover,
        .article-header .nav-links a.active {
            opacity: 1;
            border-bottom-color: currentColor;
        }

        /* ===== 正文区 ===== */
        .article-body {
            line-height: 1.8;
            font-size: 1rem;
            min-height: 200px;
        }
        /* 段落依次浮现特效：只作用于顶层元素，完美兼容 md 嵌套结构 */
        .article-body > * {
            opacity: 0;
            transform: translateY(16px);
            animation: articleReveal 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: var(--reveal-delay, 0s);
            will-change: opacity, transform;
        }
        @keyframes articleReveal {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .article-body h1,
        .article-body h2,
        .article-body h3 {
            margin-top: 1.4em;
            margin-bottom: 0.6em;
            line-height: 1.3;
        }
        .article-body h1 { font-size: 1.8rem; }
        .article-body h2 { font-size: 1.45rem; }
        .article-body h3 { font-size: 1.2rem; }
        .article-body p { margin: 0.8em 0; }
        .article-body blockquote {
            margin: 1em 0;
            padding: 0.6em 1.2em;
            border-left: 3px solid rgba(102, 187, 106, 0.5);
            background: rgba(128, 128, 128, 0.05);
            border-radius: 0 0.8rem 0.8rem 0;
            opacity: 0.9;
        }
        .article-body code {
            background: rgba(128, 128, 128, 0.12);
            padding: 0.1em 0.4em;
            border-radius: 0.4em;
            font-size: 0.92em;
        }
        .article-body pre {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(128, 128, 128, 0.12);
            border-radius: 1rem;
            padding: 1rem 1.2rem;
            overflow-x: auto;
            margin: 1em 0;
        }
        .article-body pre code {
            background: transparent;
            padding: 0;
        }
        .article-body table {
            border-collapse: collapse;
            margin: 1em 0;
            width: 100%;
        }
        .article-body th,
        .article-body td {
            border: 1px solid rgba(128, 128, 128, 0.2);
            padding: 0.5rem 0.9rem;
            text-align: left;
        }
        .article-body th {
            background: rgba(128, 128, 128, 0.08);
            font-weight: 600;
        }
        .article-body ul,
        .article-body ol {
            padding-left: 1.6em;
            margin: 0.8em 0;
        }
        .article-body li { margin: 0.3em 0; }
        .article-body hr {
            border: none;
            border-top: 1px dashed rgba(128, 128, 128, 0.25);
            margin: 1.6em 0;
        }
        .article-body a {
            color: #66bb6a;
        }

        .article-empty {
            text-align: center;
            padding: 3rem 0;
            opacity: 0.5;
            width: 100%;
        }

        /* ===== 底部控制栏 ===== */
        .bottom-controls {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1500;
            display: flex;
            gap: 0.6rem;
            align-items: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        .bottom-controls.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .ctrl-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            opacity: 0.6;
            font-family: inherit;
            line-height: 1;
            padding: 0;
            background: var(--settings-bg, rgba(10, 20, 10, 0.6));
            color: var(--text-color, #c8e6c9);
            border-color: var(--border-color, rgba(255, 255, 255, 0.15));
        }
        .ctrl-btn:hover {
            opacity: 1;
            transform: scale(1.08);
        }
        .ctrl-btn.hide-btn:hover {
            transform: scale(1.08) rotate(0deg);
        }
        .ctrl-btn.settings-btn:hover {
            transform: scale(1.08) rotate(60deg);
        }
        .ctrl-btn.hide-btn.active {
            background: rgba(231, 76, 60, 0.3);
            border-color: #e74c3c;
            opacity: 0.8;
        }

        /* ===== 样式设置弹窗（双视图：站点 / 文章） ===== */
        .settings-overlay {
            position: fixed; inset: 0; z-index: 1600; display: none;
            align-items: center; justify-content: center;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .settings-overlay.active { display: flex; }
        .settings-panel {
            width: 92%; max-width: 440px; max-height: 88vh; overflow-y: auto;
            padding: 1.6rem 1.8rem 1.3rem; border-radius: 1.4rem;
            background: var(--settings-panel-bg, rgba(12,22,12,0.95));
            border: 1px solid var(--settings-panel-border, rgba(255,255,255,0.08));
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
        }
        .panel-title {
            display: flex; align-items: center; justify-content: space-between;
            gap: 0.8rem; flex-wrap: wrap;
            font-size: 1.15rem; font-weight: 700; margin-bottom: 0.2rem;
        }
        .panel-sub { font-size: 0.8rem; opacity: 0.5; margin-bottom: 1rem; }
        .view-switch { display: flex; gap: 0.35rem; }
        .view-switch .opt-btn {
            padding: 0.25rem 0.8rem; border-radius: 2rem;
            border: 1px solid rgba(128,128,128,0.25); background: transparent;
            color: inherit; opacity: 0.55; cursor: pointer; font-size: 0.75rem; font-family: inherit;
        }
        .view-switch .opt-btn.active { opacity: 1; border-color: #66bb6a; color: #66bb6a; background: rgba(102,187,106,0.1); }
        .settings-group { margin-bottom: 0.9rem; }
        .settings-group label { font-size: 0.8rem; font-weight: 600; opacity: 0.6; display: block; margin-bottom: 0.4rem; }
        .settings-group .options { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .settings-group .options .opt-btn {
            padding: 0.3rem 0.9rem; border-radius: 2rem;
            border: 1px solid rgba(128,128,128,0.25); background: transparent;
            color: inherit; opacity: 0.5; cursor: pointer; font-size: 0.8rem; font-family: inherit;
        }
        .settings-group .options .opt-btn:hover { opacity: 0.85; }
        .settings-group .options .opt-btn.active { opacity: 1; border-color: #66bb6a; color: #66bb6a; background: rgba(102,187,106,0.1); }
        .pure-colors {
            overflow: hidden; max-height: 0; opacity: 0;
            transition: max-height 0.35s ease, opacity 0.3s ease, margin-top 0.3s ease;
        }
        .pure-colors.open {
            max-height: 220px; opacity: 1; margin-top: 0.5rem;
        }
        .pure-colors { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; }
        .pure-colors .pure-c { display: flex; align-items: center; gap: 0.35rem; font-size: 0.78rem; opacity: 0.75; }
        .pure-colors input[type=color] {
            width: 34px; height: 26px; border: 1px solid rgba(128,128,128,0.3);
            border-radius: 0.5rem; background: transparent; padding: 2px; cursor: pointer;
        }
        .pure-colors .pure-hex {
            width: 76px; padding: 0.25rem 0.5rem; border-radius: 0.5rem;
            border: 1px solid rgba(128,128,128,0.3); background: rgba(128,128,128,0.08);
            color: inherit; font-size: 0.75rem; font-family: monospace; outline: none;
        }
        .pure-colors .pure-hex:focus { border-color: #66bb6a; }
        .pure-colors .pure-hex.invalid { border-color: #e74c3c; }
        .panel-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem; }
        .panel-actions .btn {
            padding: 0.4rem 1.2rem; border-radius: 2rem;
            border: 1px solid rgba(128,128,128,0.25); background: transparent;
            color: inherit; cursor: pointer; font-size: 0.8rem; font-family: inherit;
        }
        .panel-actions .btn:hover { opacity: 0.85; }

        /* ===== 阅读进度条 ===== */
        #artProgressBar {
            position: fixed; top: 0; left: 0; height: 3px; width: 0;
            background: linear-gradient(90deg, #66bb6a, #4db6ac);
            z-index: 9998; transition: width 0.1s linear;
        }

        /* ===== 文章目录 ===== */
        #artTocBox {
            position: fixed; right: 1.2rem; top: 50%; transform: translateY(-50%);
            max-width: 220px; max-height: 70vh; overflow-y: auto;
            padding: 0.9rem 1rem; border-radius: 1rem;
            background: var(--settings-panel-bg, rgba(12,22,12,0.85));
            border: 1px solid rgba(128,128,128,0.15);
            backdrop-filter: blur(10px);
            font-size: 0.78rem; z-index: 500;
        }
        #artTocBox .art-toc-title { font-weight: 700; opacity: 0.7; margin-bottom: 0.5rem; }
        #artTocBox ul { list-style: none; margin: 0; padding: 0; }
        #artTocBox li { margin: 0.3rem 0; }
        #artTocBox li.toc-lv2 { padding-left: 0.8rem; }
        #artTocBox li.toc-lv3 { padding-left: 1.6rem; }
        #artTocBox a { text-decoration: none; opacity: 0.65; transition: opacity 0.2s; }
        #artTocBox a:hover { opacity: 1; }
        body.art-toc-off #artTocBox { display: none !important; }
        @media (max-width: 1100px) { #artTocBox { display: none; } }

        /* ===== 文章阅读专属设置 ===== */
        .article-body { font-size: var(--art-size, 1rem); line-height: var(--art-lh, 1.8); font-family: var(--art-font, inherit); }
        .article-container { max-width: var(--art-width, 720px); }
        body.art-reveal-off .article-body > * { opacity: 1 !important; transform: none !important; animation: none !important; }

        /* 阅读底色 */
        body.art-paper-cream .article-card { background: rgba(250, 244, 228, 0.94); }
        body.art-paper-cream .article-body { color: #3a332b; }
        body.art-paper-cream .article-body h1, body.art-paper-cream .article-body h2, body.art-paper-cream .article-body h3 { color: #2c261f; }
        body.art-paper-cream .article-body a { color: #6a5238; }
        body.art-paper-cream .article-body blockquote { border-left-color: rgba(106, 82, 56, 0.5); }
        body.art-paper-cream .article-body code { background: rgba(100, 80, 50, 0.12); }
        body.art-paper-cream .article-body pre { background: rgba(100, 80, 50, 0.08); border-color: rgba(100, 80, 50, 0.2); }
        body.art-paper-green .article-card { background: rgba(226, 240, 226, 0.94); }
        body.art-paper-green .article-body { color: #2c3a2c; }
        body.art-paper-green .article-body h1, body.art-paper-green .article-body h2, body.art-paper-green .article-body h3 { color: #1f2d1f; }
        body.art-paper-green .article-body a { color: #3f5e3f; }
        body.art-paper-green .article-body blockquote { border-left-color: rgba(63, 94, 63, 0.5); }
        body.art-paper-green .article-body code { background: rgba(60, 100, 60, 0.12); }
        body.art-paper-green .article-body pre { background: rgba(60, 100, 60, 0.08); border-color: rgba(60, 100, 60, 0.2); }
        body.art-paper-black .article-card { background: rgba(8, 8, 8, 0.94); }
        body.art-paper-black .article-body { color: #c8c8c8; }
        body.art-paper-black .article-body h1, body.art-paper-black .article-body h2, body.art-paper-black .article-body h3 { color: #e8e8e8; }
        body.art-paper-black .article-body a { color: #9ab89a; }
        body.art-paper-black .article-body blockquote { border-left-color: rgba(160, 160, 160, 0.5); }
        body.art-paper-black .article-body code { background: rgba(160, 160, 160, 0.14); }
        body.art-paper-black .article-body pre { background: rgba(160, 160, 160, 0.08); border-color: rgba(160, 160, 160, 0.2); }

        /* ===== 纯净浏览（黑白系 · 全屏） ===== */
        body.art-pure { background: var(--pure-bg, #111) !important; }
        body.art-pure .article-container { max-width: 100%; margin: 0; padding: 0; }
        body.art-pure .article-card {
            max-width: 100%; width: 100%; min-height: 100vh;
            border: none; border-radius: 0; box-shadow: none;
            backdrop-filter: none; -webkit-backdrop-filter: none;
            background: var(--pure-bg, #111) !important;
            color: var(--pure-fg, #e8e8e8);
            padding: 2.5rem max(1.2rem, calc((100vw - var(--art-width, 720px)) / 2));
        }
        body.art-pure .article-header { border-bottom-color: var(--pure-border, rgba(255,255,255,0.15)); }
        body.art-pure .article-header .brand,
        body.art-pure .article-header .nav-links a { color: var(--pure-muted, rgba(255,255,255,0.6)); }
        body.art-pure .article-body { color: var(--pure-fg, #e8e8e8); }
        body.art-pure .article-body h1, body.art-pure .article-body h2, body.art-pure .article-body h3,
        body.art-pure .article-body h4, body.art-pure .article-body h5, body.art-pure .article-body h6,
        body.art-pure .article-body strong { color: var(--pure-heading, var(--pure-fg, #e8e8e8)); }
        body.art-pure .article-body a { color: var(--pure-link, #c8c8c8); }
        body.art-pure .article-body blockquote {
            border-left-color: var(--pure-border, rgba(255,255,255,0.2));
            background: var(--pure-quote-bg, rgba(255,255,255,0.04));
            color: var(--pure-muted, rgba(255,255,255,0.65));
        }
        body.art-pure .article-body code { background: var(--pure-code-bg, rgba(255,255,255,0.08)); color: var(--pure-code-fg, #e8e8e8); }
        body.art-pure .article-body pre { background: var(--pure-code-bg, rgba(255,255,255,0.08)); border-color: var(--pure-border, rgba(255,255,255,0.2)); }
        body.art-pure .article-body pre code { background: transparent; }
        body.art-pure .article-body table, body.art-pure .article-body th, body.art-pure .article-body td { border-color: var(--pure-border, rgba(255,255,255,0.2)); }
        body.art-pure .article-body th { background: var(--pure-th-bg, rgba(255,255,255,0.08)); }
        body.art-pure .article-body hr { border-color: var(--pure-border, rgba(255,255,255,0.2)); }
        body.art-pure .article-body .article-empty { color: var(--pure-muted, rgba(255,255,255,0.6)); }
        body.art-pure #artTocBox {
            background: var(--pure-code-bg, rgba(255,255,255,0.08));
            border-color: var(--pure-border, rgba(255,255,255,0.2));
        }
        body.art-pure #artTocBox a { color: var(--pure-muted, rgba(255,255,255,0.6)); }
        body.art-pure .ctrl-btn { background: rgba(128,128,128,0.18); border-color: var(--pure-border, rgba(255,255,255,0.2)); }

        /* ===== 系列导航 ===== */
        .series-nav { display: inline-flex; align-items: center; gap: 0.3rem; }
        .series-nav input, .series-pager input {
            width: 52px; padding: 0.2rem 0.4rem; border-radius: 0.6rem;
            border: 1px solid rgba(128,128,128,0.25); background: rgba(128,128,128,0.08);
            color: inherit; font-size: 0.8rem; text-align: center; outline: none;
        }
        .series-nav input:focus, .series-pager input:focus { border-color: #66bb6a; }
        .series-nav button, .series-pager button {
            padding: 0.22rem 0.7rem; border-radius: 0.8rem;
            border: 1px solid rgba(128,128,128,0.25); background: transparent;
            color: inherit; cursor: pointer; font-size: 0.78rem; font-family: inherit;
        }
        .series-nav button:hover, .series-pager button:hover { opacity: 0.8; border-color: #66bb6a; }
        .series-nav button:disabled, .series-pager button:disabled { opacity: 0.35; cursor: not-allowed; }
        .series-pager {
            display: flex; align-items: center; justify-content: center;
            gap: 0.9rem; margin-top: 1.6rem; padding-top: 1.1rem;
            border-top: 1px solid rgba(128,128,128,0.12);
            font-size: 0.85rem;
        }
        .series-page { display: inline-flex; align-items: center; gap: 0.3rem; opacity: 0.75; }
        .series-page input { width: 42px; }
        body.art-pure .series-pager { border-top-color: var(--pure-border, rgba(255,255,255,0.2)); }
        /* 竖屏滚到底部时，控制栏上移避开翻页条 */
        .bottom-controls.lift { bottom: 120px; }
        body.art-pure .series-nav input, body.art-pure .series-pager input,
        body.art-pure .series-nav button, body.art-pure .series-pager button {
            border-color: var(--pure-border, rgba(255,255,255,0.2));
            color: var(--pure-fg, #e8e8e8);
        }
        @media (max-width: 600px) {
            .article-card { padding: 1.5rem 1rem; }
            .article-header { flex-direction: column; align-items: stretch; }
        }
        @media (max-width: 400px) {
            .article-card { padding: 1rem 0.8rem; }
        }

        @keyframes overlayIn {
            0% { opacity: 0; backdrop-filter: blur(0px); }
            100% { opacity: 1; backdrop-filter: blur(6px); }
        }
        @keyframes modalPop {
            0% { transform: scale(0.92) translateY(16px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="article-container">
        <div class="article-card">
            <header class="article-header">
                <div class="brand" id="brandTitle">
                    <span class="typing-title">📖 详细全文</span>
                </div>
                <div class="nav-links">
                    <a href="VOID.html">📝 返回列表</a>
                    <span class="series-nav" id="seriesNav" style="display:none">
                        <input type="number" id="seriesJumpInput" min="1" placeholder="章节" />
                        <button id="seriesJumpBtn">跳转</button>
                    </span>
                </div>
            </header>
            <div id="articleBody" class="article-body">
                <div class="article-empty">⏳ 加载中...</div>
            </div>
            <div class="series-pager" id="seriesPager" style="display:none">
                <button id="seriesPrev">← 上一页</button>
                <span class="series-page">[ <input type="number" id="seriesPageInput" min="1" /> / <span id="seriesTotal">1</span> ]</span>
                <button id="seriesNext">下一页 →</button>
            </div>
        </div>
    </div>

    <!-- ===== Toast ===== -->
    <div id="voidToast"></div>

    <!-- ===== 阅读进度条 ===== -->
    <div id="artProgressBar"></div>
    <!-- ===== 文章目录 ===== -->
    <nav id="artTocBox"></nav>
    <!-- ===== 底部控制栏（纯净浏览 + 样式设置） ===== -->
    <div class="bottom-controls" id="bottomControls">
        <button class="ctrl-btn hide-btn" id="pureToggle" title="纯净浏览">👁️</button>
        <button class="ctrl-btn settings-btn" id="settingsToggle" title="样式设置">⚙️</button>
    </div>
    <!-- ===== 设置面板（双视图：站点 / 文章） ===== -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-panel">
            <div class="panel-title">
                ⚙️ 样式设置
                <span class="view-switch" id="viewSwitch">
                    <button class="opt-btn active" data-view="site">🌐 站点</button>
                    <button class="opt-btn" data-view="article">📖 文章</button>
                </span>
            </div>
            <div class="panel-sub">自定义你的浏览体验</div>

            <!-- 站点样式视图（与 global-ui 同步） -->
            <div id="viewSite">
                <div class="settings-group">
                    <label>🎨 主题模式</label>
                    <div class="options" id="siteTheme">
                        <button class="opt-btn" data-v="default">默认</button>
                        <button class="opt-btn" data-v="light">亮色</button>

            <!-- 文章样式视图（专属设置） -->

                <div class="settings-group">
                    <label>📊 阅读进度条</label>
                    <div class="options" id="artProgress">
                        <button class="opt-btn" data-v="on">开</button>
                        <button class="opt-btn" data-v="off">关</button>
                    </div>
                </div>
                <div class="settings-group">
                    <label>📑 文章目录</label>
                    <div class="options" id="artToc">
                        <button class="opt-btn" data-v="on">开</button>
                        <button class="opt-btn" data-v="off">关</button>
                    </div>
                </div>
                <div class="settings-group">
                    <label>🧼 纯净浏览</label>

                        <button class="opt-btn" data-v="off">关</button>
                        <button class="opt-btn" data-v="on">开</button>

                <div class="settings-group">
                    <label>🎨 纯净自定义颜色</label>
                    <div class="options" id="artColorMode">
                        <button class="opt-btn" data-v="auto">跟随系统</button>
                        <button class="opt-btn" data-v="custom">自定义</button>
                    </div>
                    <div class="pure-colors" id="pureColorsWrap">
                        <label class="pure-c">字体
                            <input type="color" id="pureFg" value="#e8e8e8">
                            <input type="text" class="pure-hex" id="pureFgHex" maxlength="7" placeholder="#e8e8e8" spellcheck="false">
                        </label>
                        <label class="pure-c">背景
                            <input type="color" id="pureBg" value="#111111">
                            <input type="text" class="pure-hex" id="pureBgHex" maxlength="7" placeholder="#111111" spellcheck="false">
                        </label>

                    </div>

            <div class="panel-actions">
                <button class="btn btn-secondary" id="settingsReset">重置</button>
                <button class="btn btn-secondary" id="settingsClose">关闭</button>

    </div>
    <!-- ===== 全局脚本 ===== -->
    <script src="script.js"></script>
    <script src="global-ui.js"></script>
    <script>
        (function() {
            // ===== 样式设置：双视图（站点 / 文章） =====
            var GU = window.GlobalUI;
            var overlayEl = document.getElementById('settingsOverlay');
            var viewSite = document.getElementById('viewSite');
            var viewArticle = document.getElementById('viewArticle');

            // ---- 视图切换 ----
            document.getElementById('viewSwitch').addEventListener('click', function (ev) {
                var btn = ev.target.closest('button');
                if (!btn) return;
                var v = btn.getAttribute('data-view');
                document.querySelectorAll('#viewSwitch .opt-btn').forEach(function (b) {
                    b.classList.toggle('active', b === btn);
                });
                viewSite.style.display = v === 'site' ? '' : 'none';
                viewArticle.style.display = v === 'article' ? '' : 'none';
            });

            // ---- 弹窗开关 ----
            function openSettings() {
                syncSiteView();
                syncArticleView();
                overlayEl.classList.add('active');
            }
            function closeSettings() { overlayEl.classList.remove('active'); }
            document.getElementById('settingsToggle').addEventListener('click', openSettings);
            document.getElementById('settingsClose').addEventListener('click', closeSettings);
            overlayEl.addEventListener('click', function (ev) {
                if (ev.target === overlayEl) closeSettings();
            });
            document.addEventListener('keydown', function (ev) {
                if (ev.key === 'Escape') closeSettings();
            });

            // ---- 站点视图（与 global-ui 同步） ----
            function setGroup(id, val, def) {
                var box = document.getElementById(id);
                if (!box) return;
                box.querySelectorAll('.opt-btn').forEach(function (b) {
                    b.classList.toggle('active', b.getAttribute('data-v') === (val || def));
                });
            }
            function syncSiteView() {
                if (!GU) return;
                var s = GU.loadSettings();
                setGroup('siteTheme', s.theme, 'default');
                setGroup('siteBg', s.bg, 'default');
                setGroup('siteFont', localStorage.getItem('gui_fontSize') || '1', '1');
                setGroup('siteNav', localStorage.getItem('gui_navHidden') === '1' ? 'nav' : '', '');
            }
            document.getElementById('siteTheme').addEventListener('click', function (ev) {
                if (!GU) return;
                var b = ev.target.closest('.opt-btn');
                if (!b) return;
                var s = GU.loadSettings();
                s.theme = b.getAttribute('data-v');
                GU.saveSettings(s);
                GU.applyAll();
                syncSiteView();
            });
            document.getElementById('siteBg').addEventListener('click', function (ev) {
                if (!GU) return;
                var b = ev.target.closest('.opt-btn');
                if (!b) return;
                var s = GU.loadSettings();
                s.bg = b.getAttribute('data-v');
                GU.saveSettings(s);
                GU.applyAll();
                syncSiteView();
            });
            document.getElementById('siteFont').addEventListener('click', function (ev) {
                if (!GU) return;
                var b = ev.target.closest('.opt-btn');
                if (!b) return;
                localStorage.setItem('gui_fontSize', b.getAttribute('data-v'));
                GU.applyAll();
                syncSiteView();
            });
            document.getElementById('siteNav').addEventListener('click', function (ev) {
                if (!GU) return;
                var b = ev.target.closest('.opt-btn');
                if (!b) return;
                var nav = document.body.classList.contains('gui-nav-hidden');
                localStorage.setItem('gui_navHidden', nav ? '0' : '1');
                GU.applyAll();
                syncSiteView();
            });

            // ---- 文章视图（专属设置） ----
            var ART_KEYS = {
                size: 'art_size', line: 'art_line', font: 'art_font', width: 'art_width',
                paper: 'art_paper', reveal: 'art_reveal', progress: 'art_progress',
                toc: 'art_toc', pure: 'art_pure', colorMode: 'art_color_mode', fg: 'art_fg', bg: 'art_bg'
            };
            function artGet(k) { try { return localStorage.getItem(ART_KEYS[k]); } catch (e) { return null; } }
            function artSet(k, v) { try { localStorage.setItem(ART_KEYS[k], v); } catch (e) {} }
            function syncArticleView() {
                setGroup('artSize', artGet('size'), '18');
                setGroup('artLine', artGet('line'), '1.9');
                setGroup('artFont', artGet('font'), 'default');
                setGroup('artWidth', artGet('width'), '720');
                setGroup('artPaper', artGet('paper'), 'default');
                setGroup('artReveal', artGet('reveal'), 'on');
                setGroup('artProgress', artGet('progress'), 'on');
                setGroup('artToc', artGet('toc'), 'on');
                setGroup('artPure', artGet('pure'), 'off');
                setGroup('artColorMode', artGet('colorMode'), 'auto');
                var fg = artGet('fg'), bg = artGet('bg');
                if (fg) document.getElementById('pureFg').value = fg;
                if (bg) document.getElementById('pureBg').value = bg;
            }
            function applyArticle() {
                var bd = document.body;
                bd.style.setProperty('--art-size', (artGet('size') || '18') + 'px');
                bd.style.setProperty('--art-lh', artGet('line') || '1.9');
                var f = artGet('font') || 'default';
                bd.style.setProperty('--art-font', f === 'serif'
                    ? "Georgia, 'Noto Serif SC', 'Songti SC', SimSun, serif"
                    : (f === 'sans' ? "'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" : 'inherit'));
                bd.style.setProperty('--art-width', (artGet('width') || '720') + 'px');
                var paper = artGet('paper') || 'default';
                bd.classList.toggle('art-paper-cream', paper === 'cream');
                bd.classList.toggle('art-paper-green', paper === 'green');
                bd.classList.toggle('art-paper-black', paper === 'black');
                bd.classList.toggle('art-reveal-off', (artGet('reveal') || 'on') === 'off');
                var pb = document.getElementById('artProgressBar');
                if (pb) pb.style.display = (artGet('progress') || 'on') === 'on' ? '' : 'none';
                buildToc();
                bd.classList.toggle('art-toc-off', (artGet('toc') || 'on') === 'off');
                var pw = document.getElementById('pureColorsWrap');
                if (pw) pw.classList.toggle('open', (artGet('colorMode') || 'auto') === 'custom');
                var pure = (artGet('pure') || 'off') === 'on';
                bd.classList.toggle('art-pure', pure);
                var pt = document.getElementById('pureToggle');
                pt.classList.toggle('active', pure);
                pt.title = pure ? '退出纯净浏览' : '纯净浏览';
                if (pure) applyPureColors();
            }
            function bindArtGroup(id, key, def) {
                document.getElementById(id).addEventListener('click', function (ev) {
                    var b = ev.target.closest('.opt-btn');
                    if (!b) return;
                    artSet(key, b.getAttribute('data-v'));
                    applyArticle();
                    syncArticleView();
                });
            }
            bindArtGroup('artSize', 'size', '18');
            bindArtGroup('artLine', 'line', '1.9');
            bindArtGroup('artFont', 'font', 'default');
            bindArtGroup('artWidth', 'width', '720');
            bindArtGroup('artPaper', 'paper', 'default');
            bindArtGroup('artReveal', 'reveal', 'on');
            bindArtGroup('artProgress', 'progress', 'on');
            bindArtGroup('artToc', 'toc', 'on');
            bindArtGroup('artPure', 'pure', 'off');
            bindArtGroup('artColorMode', 'colorMode', 'auto');

            // ---- 纯净浏览颜色（黑白系自动衍生） ----
            function hexToRgb(hex) {
                var s = String(hex || '').replace('#', '');
                if (s.length === 3) s = s.split('').map(function (c) { return c + c; }).join('');
                if (s.length !== 6) return [128, 128, 128];
                return [parseInt(s.substr(0, 2), 16), parseInt(s.substr(2, 2), 16), parseInt(s.substr(4, 2), 16)];
            }
            function rgbToHex(r, g, b) {
                function p(v) {
                    var x = Math.round(Math.max(0, Math.min(255, v))).toString(16);
                    return x.length < 2 ? '0' + x : x;
                }
                return '#' + p(r) + p(g) + p(b);
            }
            function mix(c1, c2, t) {
                var a = hexToRgb(c1), b2 = hexToRgb(c2);
                return rgbToHex(a[0] + (b2[0] - a[0]) * t, a[1] + (b2[1] - a[1]) * t, a[2] + (b2[2] - a[2]) * t);
            }
            function defaultPureColors() {
                var dark = true;
                try { dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
                var th = document.documentElement.getAttribute('data-theme');
                if (th === 'light') dark = false;
                if (th === 'dark') dark = true;
                return dark ? { bg: '#111111', fg: '#e8e8e8' } : { bg: '#f7f7f5', fg: '#1c1c1c' };
            }
            function applyPureColors() {
                var mode = artGet('colorMode') || 'auto';
                var fg = null, bg = null;
                if (mode === 'custom') {
                    fg = artGet('fg');
                    bg = artGet('bg');
                }
                if (!fg || !bg) {
                    var d = defaultPureColors();
                    if (!fg) fg = d.fg;
                    if (!bg) bg = d.bg;
                }
                var root = document.documentElement;
                root.style.setProperty('--pure-bg', bg);
                root.style.setProperty('--pure-fg', fg);
                root.style.setProperty('--pure-muted', mix(bg, fg, 0.62));
                root.style.setProperty('--pure-code-bg', mix(bg, fg, 0.08));
                root.style.setProperty('--pure-code-fg', fg);
                root.style.setProperty('--pure-border', mix(bg, fg, 0.24));
                root.style.setProperty('--pure-link', mix(bg, fg, 0.78));
                root.style.setProperty('--pure-quote-bg', mix(bg, fg, 0.045));
                root.style.setProperty('--pure-th-bg', mix(bg, fg, 0.09));
                root.style.setProperty('--pure-heading', mix(bg, fg, 0.92));
            }
            function validHex(v) { return /^#[0-9a-fA-F]{6}$/.test(v); }
            function bindColorPair(colorId, hexId, key) {
                var cEl = document.getElementById(colorId);
                var hEl = document.getElementById(hexId);
                cEl.addEventListener('input', function () {
                    hEl.value = this.value;
                    hEl.classList.remove('invalid');
                    artSet(key, this.value);
                    applyPureColors();
                });
                hEl.addEventListener('change', function () {
                    var v = this.value.trim();
                    if (v.charAt(0) !== '#') v = '#' + v;
                    if (validHex(v)) {
                        this.value = v.toLowerCase();
                        this.classList.remove('invalid');
                        cEl.value = v;
                        artSet(key, v);
                        applyPureColors();
                    } else {
                        this.classList.add('invalid');
                        this.value = cEl.value;
                        setTimeout(function () { hEl.classList.remove('invalid'); }, 600);
                    }
                });
                hEl.addEventListener('input', function () {
                    var v = this.value.trim();
                    var t = v.charAt(0) === '#' ? v : '#' + v;
                    this.classList.toggle('invalid', v.length > 0 && !validHex(t));
                });
            }
            bindColorPair('pureFg', 'pureFgHex', 'fg');
            bindColorPair('pureBg', 'pureBgHex', 'bg');
            document.getElementById('pureFgHex').value = document.getElementById('pureFg').value;
            document.getElementById('pureBgHex').value = document.getElementById('pureBg').value;
            document.getElementById('pureResetColor').addEventListener('click', function () {
                try {
                    localStorage.removeItem(ART_KEYS.fg);
                    localStorage.removeItem(ART_KEYS.bg);
                    localStorage.removeItem(ART_KEYS.colorMode);
                } catch (e) {}
                var d = defaultPureColors();
                document.getElementById('pureFg').value = d.fg;
                document.getElementById('pureBg').value = d.bg;
                document.getElementById('pureFgHex').value = d.fg;
                document.getElementById('pureBgHex').value = d.bg;
                applyPureColors();
                applyArticle();
                syncArticleView();
            });

            // ---- 纯净浏览开关（原隐藏 UI 按钮） ----
            document.getElementById('pureToggle').addEventListener('click', function () {
                var on = !document.body.classList.contains('art-pure');
                artSet('pure', on ? 'on' : 'off');
                applyArticle();
            });

            // ---- 阅读进度条 ----
            var pbar = document.getElementById('artProgressBar');
            function updateProgress() {
                var doc = document.documentElement;
                var total = doc.scrollHeight - doc.clientHeight;
                var pct = total > 0 ? (window.pageYOffset || doc.scrollTop || 0) / total * 100 : 0;
                if (pbar) pbar.style.width = pct + '%';
            }
            document.addEventListener('scroll', updateProgress, { passive: true });
            window.addEventListener('resize', updateProgress);

            // ---- 系列文章检索与跳转 ----
            var seriesList = [];
            var seriesIdx = -1;
            var voidFiles = new Set();
            var seriesNav = document.getElementById('seriesNav');
            var seriesPager = document.getElementById('seriesPager');
            function stripNumName(name) {
                return name.replace(/(\d+)\.md$/i, '.md');
            }
            function buildSeries(currentFile) {
                var base = stripNumName(currentFile);
                seriesList = [];
                // 从原文件（无数字）开始 +1 搜索，遇到缺失即停（防无上限搜索）
                for (var i = 0; i < 100; i++) {
                    var cand = i === 0 ? base : base.replace(/\.md$/i, i + '.md');
                    if (voidFiles.has(cand)) seriesList.push(cand);
                    else break;
                }
                seriesIdx = seriesList.indexOf(currentFile);
                var hasSeries = seriesList.length > 1 && seriesIdx >= 0;
                seriesNav.style.display = hasSeries ? 'inline-flex' : 'none';
                seriesPager.style.display = hasSeries ? 'flex' : 'none';
                if (!hasSeries) return;
                document.getElementById('seriesTotal').textContent = seriesList.length;
                document.getElementById('seriesPageInput').value = seriesIdx + 1;
                document.getElementById('seriesPrev').disabled = seriesIdx === 0;
                document.getElementById('seriesNext').disabled = seriesIdx === seriesList.length - 1;
                updateControlsLift();
            }
            function updateControlsLift() {
                var bc = document.getElementById('bottomControls');
                if (!bc) return;
                var pagerVisible = document.getElementById('seriesPager').style.display !== 'none';
                var nearBottom = (window.innerHeight + window.pageYOffset) >= (document.documentElement.scrollHeight - 180);
                var narrow = window.innerWidth <= 900;
                bc.classList.toggle('lift', narrow && nearBottom && pagerVisible);
            }
            document.addEventListener('scroll', updateControlsLift, { passive: true });
            window.addEventListener('resize', updateControlsLift);
            function jumpSeries(n) {
                if (!seriesList.length || n < 1 || n > seriesList.length) {
                    if (window.showVoidToast) showVoidToast('⚠️ 章节不存在（1 ~ ' + seriesList.length + '）');
                    return;
                }
                location.href = 'article.html?file=' + encodeURIComponent('VOID/' + seriesList[n - 1]);
            }
            document.getElementById('seriesJumpBtn').addEventListener('click', function () {
                var v = parseInt(document.getElementById('seriesJumpInput').value, 10);
                if (v) jumpSeries(v);
            });
            document.getElementById('seriesJumpInput').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { e.preventDefault(); document.getElementById('seriesJumpBtn').click(); }
            });
            document.getElementById('seriesPrev').addEventListener('click', function () {
                if (seriesIdx > 0) jumpSeries(seriesIdx);
            });
            document.getElementById('seriesNext').addEventListener('click', function () {
                if (seriesIdx >= 0 && seriesIdx < seriesList.length - 1) jumpSeries(seriesIdx + 2);
            });
            document.getElementById('seriesPageInput').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { e.preventDefault(); var v = parseInt(this.value, 10); if (v) jumpSeries(v); }
            });
            document.getElementById('seriesPageInput').addEventListener('change', function () {
                var v = parseInt(this.value, 10);
                if (v && v !== seriesIdx + 1) jumpSeries(v);
            });
            // 拉取 VOID/ 目录，判定当前文章的系列
            (function loadSeriesFiles() {
                var fp = new URLSearchParams(location.search).get('file');
                fetch('https://api.github.com/repos/ku-134/ku-134.github.io/contents/VOID', {
                    headers: { 'Accept': 'application/vnd.github+json' }
                })
                    .then(function (r) { return r.ok ? r.json() : []; })
                    .then(function (arr) {
                        voidFiles = new Set((arr || []).map(function (f) { return f.name; }));
                        if (fp) buildSeries(fp.replace(/^VOID\//, ''));
                    })
                    .catch(function () {});
            })();

            // ---- 文章目录 ----
            var tocBox = document.getElementById('artTocBox');
            function buildToc() {
                if (!tocBox) return;
                var heads = document.querySelectorAll('.article-body h1, .article-body h2, .article-body h3');
                if (!heads.length) { tocBox.innerHTML = ''; return; }
                var html = '<div class="art-toc-title">📑 目录</div><ul>';
                heads.forEach(function (hd, i) {
                    if (!hd.id) hd.id = 'art-h-' + i;
                    var lv = parseInt(hd.tagName.charAt(1), 10);
                    html += '<li class="toc-lv' + lv + '"><a href="#' + hd.id + '">' + hd.textContent + '</a></li>';
                });
                html += '</ul>';
                tocBox.innerHTML = html;
                tocBox.querySelectorAll('a').forEach(function (a) {
                    a.addEventListener('click', function (ev) {
                        ev.preventDefault();
                        var t = document.getElementById(a.getAttribute('href').slice(1));
                        if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    });
                });
            }

            // ---- 重置 ----
            document.getElementById('settingsReset').addEventListener('click', function () {
                Object.keys(ART_KEYS).forEach(function (k) {
                    try { localStorage.removeItem(ART_KEYS[k]); } catch (e) {}
                });
                if (GU) { GU.applyAll(); }
                applyArticle();
                syncArticleView();
                syncSiteView();
            });

            // ---- 暴露给渲染完成后的刷新钩子 ----
            window.ArtSettings = { refresh: applyArticle, rebuildToc: buildToc };

            // ---- 显示底部控制栏（👁️ 纯净浏览 / ⚙️ 设置） ----
            setTimeout(function () {
                var bc = document.getElementById('bottomControls');
                if (bc) bc.classList.add('show');
            }, 800);

            // ---- 初始化 ----
            applyArticle();
            updateProgress();
            // ===== Toast =====
            window.showVoidToast = function(msg, duration) {
                duration = duration || 4000;
                const el = document.getElementById('voidToast');
                el.textContent = msg;
                el.classList.add('show');
                clearTimeout(el._hideTimer);
                el._hideTimer = setTimeout(function() {
                    el.classList.remove('show');
                }, duration);
            };

            // ===== 加载文章（?file=xxx.md 或 ?file=VOID/xxx.md） =====
            const articleBody = document.getElementById('articleBody');
            const params = new URLSearchParams(location.search);
            let file = params.get('file');
            if (!file) {
                articleBody.innerHTML = '<div class="article-empty">📭 未指定文章<br>请在链接后添加 <code>?file=VOID/测试文本.md</code></div>';
                if (window.showVoidToast) showVoidToast('📭 文章不存在', 2000);
                return;
            }
            // 兼容纯文件名（自动补 VOID/ 前缀）与完整路径
            if (!file.includes('/')) file = 'VOID/' + file;

            // ===== 文章拉取：缓存 + 哈希更新策略 =====
            // 每次先走网络验证最新版（no-cache），内容哈希变化则刷新缓存；
            // 网络失败时回退到 Cache Storage 中的旧版缓存。
            async function sha256(text) {
                try {
                    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
                    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
                } catch (e) {
                    return String(text.length); // 不支持 crypto.subtle 时的兜底
                }
            }

            async function loadArticleText(url) {
                const cache = await caches.open('void-articles');
                try {
                    const res = await fetch(url, { cache: 'no-cache' });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const text = await res.text();
                    const hash = await sha256(text);
                    const hashKey = 'voidArticleHash:' + url;
                    let oldHash = null;
                    try { oldHash = localStorage.getItem(hashKey); } catch (e) {}
                    if (oldHash !== hash) {
                        try {
                            localStorage.setItem(hashKey, hash);
                            await cache.put(url, new Response(text, { headers: { 'Content-Type': 'text/markdown; charset=utf-8' } }));
                        } catch (e) { /* 存储失败不影响阅读 */ }
                    }
                    return text;
                } catch (e) {
                    // 网络失败 → 使用本地缓存旧版
                    const cached = await cache.match(url);
                    if (cached) return cached.text();
                    throw e;
                }
            }

            loadArticleText(file)
                .then(function(text) {
                    articleBody.innerHTML = marked.parse(text);
                if (window.ArtSettings) window.ArtSettings.refresh();
                    // 段落依次浮现：从上到下逐个出现，避免生硬
                    const kids = articleBody.children;
                    for (let i = 0; i < kids.length; i++) {
                        kids[i].style.setProperty('--reveal-delay', Math.min(i * 0.07, 1.8) + 's');
                    }
                    document.title = file.split('/').pop() + ' · 虚空终端';
                })
                .catch(function(err) {
                    articleBody.innerHTML = '<div class="article-empty">❌ 文章不存在或加载失败</div>';
                    if (window.showVoidToast) showVoidToast('❌ 文章不存在', 2000);
                });
        })();
    </script>
</body>
</html>
