<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚空终端 · Kukuz分享页</title>
    <link rel="preload" as="image" href="background.webp">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== 入场动画专属样式 ===== */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: var(--loader-bg, #0d1a0d);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1.2s ease;
            pointer-events: none;
        }
        #loader.hide {
            opacity: 0;
            pointer-events: none;
        }
        .code-block {
            position: absolute;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: var(--code-color, #66bb6a);
            opacity: 0;
            animation: codeFade 3s ease-in-out infinite alternate;
            user-select: none;
            white-space: nowrap;
            text-shadow: 0 0 8px var(--code-glow, rgba(102, 187, 106, 0.3));
        }
        @keyframes codeFade {
            0% { opacity: 0; transform: translateY(-10px) scale(0.95); }
            50% { opacity: 0.9; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(10px) scale(0.95); }
        }
        @media (prefers-color-scheme: light) {
            #loader { --loader-bg: #f0f5f0; }
            .code-block { --code-color: #1b5e20; --code-glow: rgba(27, 94, 32, 0.2); }
        }
        @media (prefers-color-scheme: dark) {
            #loader { --loader-bg: #0d1a0d; }
            .code-block { --code-color: #66bb6a; --code-glow: rgba(102, 187, 106, 0.3); }
        }

        .card {
            opacity: 0;
            transform: translateY(40px) scale(0.96);
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .card.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* ===== Toast 提示（两个独立 Toast） ===== */
        .toast {
            position: fixed;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            z-index: 2000;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 12px 28px;
            border-radius: 2rem;
            font-size: 1rem;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast .highlight {
            color: #a5d6a7;
            font-weight: 700;
        }

        #toast { bottom: 30px; }          /* 横屏提示 */
        #visitToast { bottom: 90px; }     /* 访客足迹（在横屏上方，避免重叠） */

        @media (max-width: 480px) {
            .toast {
                font-size: 0.85rem;
                padding: 10px 18px;
                white-space: normal;
                max-width: 90%;
            }
            #toast { bottom: 20px; }
            #visitToast { bottom: 80px; }
        }
        @media (prefers-color-scheme: light) {
            .toast {
                background: rgba(255,255,255,0.9);
                color: #1a3b1a;
                border-color: rgba(0,0,0,0.05);
            }
            .toast .highlight { color: #1b5e20; }
        }
    </style>
</head>
<body>

    <!-- 加载层 -->
    <div id="loader"></div>

    <!-- 横屏提示 Toast -->
    <div id="toast" class="toast">💡 推荐使用 <span class="highlight">电脑横屏</span> 访问</div>

    <!-- 访客足迹 Toast -->
    <div id="visitToast" class="toast"></div>

    <!-- 主卡片 -->
    <div class="card card-narrow" id="mainCard">
        <h1 class="typing-title">🌿 虚空终端</h1>
        <div class="sub fade-in-up delay-2">— Kukuz 分享页 —</div>
        <div class="divider fade-in-up delay-3"></div>

        <div class="nav-menu fade-in-up delay-4">
            <a href="index.html" class="nav-link active">🏠 首页</a>
            <a href="about.html" class="nav-link">📖 关于</a>
        </div>

        <p class="desc fade-in-up delay-5">
            万物虚寂，终有回响。<br>
            在这里，分享灵感、技术与我眼中的世界。
        </p>

        <div class="button-group fade-in-up delay-6">
            <a href="RP.html" class="btn btn-primary">📦 我的资源</a>
            <a href="#" class="btn btn-secondary">📝 我的文章</a>
            <a href="#" class="btn btn-secondary">🎮 我的游戏</a>
            <a href="contact.html" class="btn btn-secondary">🤝 交朋友</a>
        </div>

        <div class="footer fade-in-up delay-7">
            ✦ 随时更新 · 欢迎来访 ✦ &nbsp;·&nbsp; 🐙 <a href="https://github.com/ku-134" target="_blank">ku-134</a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        (function() {
            'use strict';

            // ---------- 生成随机代码块 ----------
            const loader = document.getElementById('loader');
            const codeSnippets = [
                '<html>', '</html>', '<div>', '</div>', 'function()', 'var', 'let', 'const',
                'class', 'extends', 'return', 'if', 'else', 'for', 'while', 'try', 'catch',
                'console.log', 'import', 'export', 'default', 'async', 'await', '=>',
                '{ }', '[ ]', '( )', '===', '!==', '&&', '||', '++', '--',
                'npm install', 'git commit', 'Hello World', '42', 'true', 'false',
                'null', 'undefined', 'NaN', 'Infinity', 'Promise', 'resolve',
                'fetch', 'then', 'catch', 'finally', 'throw', 'new', 'this',
                'super', 'static', 'get', 'set', 'yield', 'generator'
            ];
            for (let i = 0; i < 45; i++) {
                const span = document.createElement('span');
                span.className = 'code-block';
                let text = '';
                const count = Math.floor(Math.random() * 3) + 1;
                for (let j = 0; j < count; j++) {
                    text += codeSnippets[Math.floor(Math.random() * codeSnippets.length)];
                    if (j < count - 1) text += ' ';
                }
                span.textContent = text;
                span.style.left = Math.random() * 90 + 5 + '%';
                span.style.top = Math.random() * 90 + 5 + '%';
                span.style.fontSize = (Math.random() * 18 + 10) + 'px';
                span.style.animationDelay = (Math.random() * 5) + 's';
                span.style.animationDuration = (Math.random() * 4 + 2) + 's';
                span.style.opacity = Math.random() * 0.5 + 0.2;
                loader.appendChild(span);
            }

            // ---------- 预加载背景图 ----------
            const bgImage = new Image();
            const computedStyle = getComputedStyle(document.body);
            const bgUrl = computedStyle.backgroundImage;
            const match = bgUrl.match(/url\(["']?([^"')]+)["']?\)/);
            const imageUrl = match ? match[1] : 'background.webp';

            function onBackgroundLoaded() {
                loader.classList.add('hide');
                const card = document.getElementById('mainCard');
                card.classList.add('show');
            }

            bgImage.src = imageUrl;
            if (bgImage.complete && bgImage.naturalWidth > 0) {
                onBackgroundLoaded();
            } else {
                bgImage.addEventListener('load', onBackgroundLoaded);
                bgImage.addEventListener('error', function() {
                    console.warn('背景图加载失败，使用备用颜色');
                    onBackgroundLoaded();
                });
                setTimeout(() => {
                    if (!loader.classList.contains('hide')) {
                        onBackgroundLoaded();
                    }
                }, 5000);
            }

            // ---------- 横屏提示（原有） ----------
            function showToast() {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => { toast.classList.remove('show'); }, 4500);
            }
            if (/Mobi|Android|iPhone|iPad|iPod|BlackBerry|Opera Mini|IEMobile/i.test(navigator.userAgent) ||
                window.matchMedia('(orientation: portrait)').matches) {
                setTimeout(showToast, 1200);
            }

            // ---------- 访客足迹（新增） ----------
            function showVisitToast() {
                const visitToast = document.getElementById('visitToast');
                const lastVisit = localStorage.getItem('lastVisit');
                const now = Date.now();

                let message = '';
                if (!lastVisit) {
                    message = '👋 欢迎首次访问！';
                } else {
                    const days = Math.floor((now - parseInt(lastVisit)) / (1000 * 60 * 60 * 24));
                    if (days === 0) {
                        message = '👋 欢迎回来，今天已经来过啦！';
                    } else if (days === 1) {
                        message = '👋 欢迎回来，昨天刚来过～';
                    } else {
                        message = `👋 欢迎回来，上次访问是 ${days} 天前`;
                    }
                }
                visitToast.textContent = message;
                visitToast.classList.add('show');
                setTimeout(() => { visitToast.classList.remove('show'); }, 4500);

                // 更新访问时间
                localStorage.setItem('lastVisit', String(now));
            }

            // 延迟显示，避免与横屏提示同时出现（但也可以同时，位置不同）
            setTimeout(showVisitToast, 1600);
        })();
    </script>

</body>
</html>
