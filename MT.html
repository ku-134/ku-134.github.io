<!DOCTYPE html>
<html lang="zh-CN" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具 · 虚空终端</title>
    <link rel="preload" as="image" href="background.webp">
    <link rel="preload" as="image" href="background1.webp">
    <link rel="preload" as="image" href="background2.webp">
    <link rel="preload" as="image" href="background3.webp">
    <link rel="preload" as="image" href="background4.webp">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== 工具页：公开工具合集 ===== */
        .tool-container { max-width: 920px; width: 100%; margin: 0 auto; }
        .tool-card {
            padding: 2.2rem 2.2rem 2rem;
            border-radius: 2rem;
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
        }
        .tool-header {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 1rem; margin-bottom: 1.2rem;
            padding-bottom: 0.6rem; border-bottom: 1px solid rgba(128,128,128,0.1);
        }
        .tool-header .brand { font-size: 2rem; font-weight: 700; letter-spacing: 0.02em; }
        .tool-header .nav-links { display: flex; gap: 1rem; font-size: 0.95rem; }
        .tool-header .nav-links a { text-decoration: none; opacity: 0.7; transition: opacity 0.2s; }
        .tool-header .nav-links a:hover { opacity: 1; }
        .tool-header .nav-links a.active { opacity: 1; font-weight: 600; }
        /* ===== 工具栏：搜索 + 计数 ===== */
        .tool-toolbar { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1.5rem; }
        .tool-toolbar input {
            flex: 1; padding: 0.55rem 1rem; border-radius: 2rem;
            border: 1px solid rgba(128,128,128,0.2); background: rgba(128,128,128,0.06);
            color: inherit; font-family: inherit; outline: none;
        }
        .tool-toolbar input:focus { border-color: #66bb6a; }
        .tool-count { font-size: 0.85rem; opacity: 0.5; white-space: nowrap; }
        /* ===== 工具卡片网格 ===== */
        .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        @media (max-width: 640px) {
            .tool-grid { grid-template-columns: 1fr; }
            .tool-header { flex-direction: column; align-items: flex-start; }
        }
        .tool-item {
            display: flex; gap: 1rem; align-items: center; padding: 1.2rem 1.3rem;
            border-radius: 1.4rem; border: 1px solid rgba(128,128,128,0.12);
            background: rgba(128,128,128,0.04); cursor: pointer;
            transition: all 0.25s;
        }
        .tool-item:hover {
            transform: translateY(-3px);
            border-color: rgba(102,187,106,0.45);
            background: rgba(102,187,106,0.07);
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }
        .t-icon {
            font-size: 1.8rem; width: 3.4rem; height: 3.4rem; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            border-radius: 1rem; background: rgba(102,187,106,0.12);
            border: 1px solid rgba(102,187,106,0.2);
        }
        .t-main { flex: 1; min-width: 0; }
        .t-name { font-size: 1.1rem; font-weight: 700; }
        .t-desc { margin-top: 0.3rem; font-size: 0.85rem; opacity: 0.65; line-height: 1.5; }
        .t-go { font-size: 1.2rem; opacity: 0.35; transition: transform 0.25s, opacity 0.25s; }
        .tool-item:hover .t-go { transform: translateX(4px); opacity: 0.9; }
        .tool-empty { grid-column: 1 / -1; text-align: center; opacity: 0.6; padding: 2.5rem 0; }
    </style>
</head>
<body>
    <div class="tool-container">
        <div class="tool-card">
            <header class="tool-header">
                <div class="brand"><span class="typing-title">🛠️ 工具</span></div>
                <div class="nav-links">
                    <a href="index.html">🏠 首页</a>
                    <a href="#" class="active">🛠️ 工具</a>
                </div>
            </header>
            <div class="tool-toolbar">
                <input type="text" id="searchInput" placeholder="🔍 搜索工具..." />
                <span class="tool-count" id="toolCount"></span>
            </div>
            <div id="toolGrid" class="tool-grid">
                <div class="tool-empty">⏳ 加载中...</div>
            </div>
        </div>
    </div>

    <script>
    (function () {
        'use strict';
        var grid = document.getElementById('toolGrid');
        var countEl = document.getElementById('toolCount');
        // 文件名 → 图标（未命中默认 📦）
        var ICONS = { 'mt.html': '🛠️', '设备信息.html': '📊', '权限请求.html': '🔐' };
        var tools = [];

        function parseIndex(text) {
            tools = [];
            text.split('\n').forEach(function (line) {
                line = line.trim();
                if (!line) return;
                // 格式：文件名 -工具名 | 工具简介
                var m = line.match(/^(.*?)\s*-\s*(.*?)\s*\|\s*(.*)$/);
                if (!m) return;
                tools.push({ file: m[1].trim(), name: m[2].trim(), brief: (m[3] || '').trim() });
            });
        }

        function iconOf(file) {
            return ICONS[file.toLowerCase()] || ICONS[file] || '📦';
        }

        function render() {
            var kw = (document.getElementById('searchInput').value || '').trim().toLowerCase();
            var list = tools.filter(function (t) {
                if (!kw) return true;
                return (t.name + t.file + t.brief).toLowerCase().indexOf(kw) >= 0;
            });
            countEl.textContent = list.length ? '共 ' + list.length + ' 个工具' : '';
            if (!list.length) {
                grid.innerHTML = '<div class="tool-empty">🌫️ 没有找到相关工具</div>';
                return;
            }
            grid.innerHTML = list.map(function (t) {
                return '<div class="tool-item" data-file="' + t.file.replace(/"/g, '"') + '">' +
                    '<div class="t-icon">' + iconOf(t.file) + '</div>' +
                    '<div class="t-main"><div class="t-name">' + t.name + '</div>' +
                    (t.brief ? '<div class="t-desc">' + t.brief + '</div>' : '') + '</div>' +
                    '<div class="t-go">→</div></div>';
            }).join('');
        }

        grid.addEventListener('click', function (e) {
            var item = e.target.closest('.tool-item');
            if (item && item.dataset.file) {
                location.href = 'tool/' + encodeURIComponent(item.dataset.file);
            }
        });

        document.getElementById('searchInput').addEventListener('input', render);

        fetch('tool/index.txt?t=' + Date.now(), { cache: 'no-cache' })
            .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
            .then(function (text) { parseIndex(text); render(); })
            .catch(function () { grid.innerHTML = '<div class="tool-empty">⚠️ 索引加载失败</div>'; });
    })();
    </script>
    <script src="global-ui.js"></script>
</body>
</html>
