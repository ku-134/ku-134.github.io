<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>碰撞球</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div id="rotate-tip">请将设备旋转至横屏 🎮</div>

<div id="app">
  <!-- 首页 -->
  <section id="screen-home" class="screen active">
    <h1 id="gameTitle">碰！ 撞！ 球！</h1>
    <p class="subtitle">观战 · 干涉 · 决胜</p>
    <div class="home-btns">
      <button id="btn-start" class="btn big">开始</button>
      <button id="btn-bestiary" class="btn big">图鉴</button>
    </div>
    <button id="btn-settings" class="btn gear" title="设置">⚙</button>
  </section>

  <!-- 模式选择：弹窗覆盖（遮罩防底下按钮误触） -->
  <section id="panel-start" class="panel hidden">
    <div class="modal-box">
      <h2>选择模式</h2>
      <button id="btn-single" class="btn wide">自己</button>
      <button id="btn-online" class="btn wide">联机</button>
      <button class="btn wide back" data-back="screen-home">返回</button>
    </div>
  </section>

  <!-- 图鉴面板（右滑出）：分类切换 + 左半列表 + 右半详情（可滚动大展示框） -->
  <section id="panel-bestiary" class="panel right hidden bestiary-panel">
    <div id="cat-tabs-bestiary" class="cat-tabs"></div>
    <div class="bestiary-wrap">
      <div id="bestiary-list" class="card-list"></div>
      <div id="bestiary-detail" class="detail">
        <div id="detail-orb" class="detail-orb"></div>
        <h3 id="detail-name"></h3>
        <p id="detail-desc"></p>
      </div>
    </div>
    <button class="btn back corner-back" data-back="screen-home">返回</button>
  </section>

  <!-- 设置面板：基础设置 + 音效开关（分类独立） -->
  <section id="panel-settings" class="panel right hidden">
    <h2>设置</h2>
    <label class="set-row">联机昵称
      <input id="nick-input" maxlength="8" value="玩家">
    </label>
    <label class="set-row">球体图案
      <input type="file" id="skin-upload" accept="image/*">
    </label>
    <label class="set-row">主动技能按键
      <input id="key-active" maxlength="1" value="J">
    </label>
    <div class="set-divider">音效开关</div>
    <label class="set-row">全局音效 <input type="checkbox" id="sfx-master" class="sfx-toggle" checked></label>
    <label class="set-row">按钮交互音效 <input type="checkbox" id="sfx-ui" class="sfx-toggle" checked></label>
    <label class="set-row">受击音效 <input type="checkbox" id="sfx-hit" class="sfx-toggle" checked></label>
    <label class="set-row">冲刺音效 <input type="checkbox" id="sfx-dash" class="sfx-toggle" checked></label>
    <label class="set-row">技能音效 <input type="checkbox" id="sfx-skill" class="sfx-toggle" checked></label>
    <label class="set-row">对局音效（倒计时/狂暴/结算） <input type="checkbox" id="sfx-match" class="sfx-toggle" checked></label>
    <p class="tip">联机昵称会显示在对方的对局界面中；自定义皮肤同步功能开发中</p>
    <button class="btn wide back" data-back="screen-home">返回</button>
  </section>

  <!-- 选球界面（单机）：顶部一排（左上AI的球+返回并列 | 中间选择球 | 右上你的球），下方左右对称选择器，底部确认 -->
  <section id="screen-select" class="screen hidden select-screen">
    <div class="select-header">
      <div class="select-header-left">
        <span class="col-title">AI 的球</span>
        <button class="btn back" data-back="panel-start">返回</button>
      </div>
      <h2 class="center-title">选择球</h2>
      <span class="col-title select-header-right">你的球</span>
    </div>
    <div class="select-layout">
      <div class="select-col">
        <div id="cat-tabs-ai" class="cat-tabs"></div>
        <div id="select-list-ai" class="card-list"></div>
      </div>
      <div class="select-col">
        <div id="cat-tabs-select" class="cat-tabs"></div>
        <div id="select-list" class="card-list"></div>
      </div>
    </div>
    <div class="select-confirm-wrap">
      <button id="btn-select-confirm" class="btn big">确认出战</button>
    </div>
  </section>

  <!-- 战场选择界面（单机）：左右滑动选战场（小型渲染图+文案+随机） -->
  <section id="screen-battle" class="screen hidden">
    <h2>选择战场</h2>
    <div id="battle-list" class="battle-scroll"></div>
    <div class="select-btns">
      <button id="btn-battle-confirm" class="btn big">确认开战</button>
      <button class="btn back" data-back="screen-select">返回</button>
    </div>
  </section>

  <!-- 联机界面：大厅（创建/加入） + 房间（等待/选球/准备） -->
  <section id="screen-online" class="screen hidden">
    <h2>联机对战</h2>
    <div id="online-lobby" class="online-cols">
      <div class="col">
        <button id="btn-create-room" class="btn wide">创建房间</button>
        <p class="tip">生成5位数字房间号，对方输入即可加入</p>
      </div>
      <div class="col">
        <input id="room-input" class="room-input" maxlength="5" placeholder="5位数字房间号" inputmode="numeric">
        <button id="btn-join-room" class="btn wide">加入房间</button>
        <p id="room-msg" class="tip"></p>
      </div>
    </div>
    <div id="online-wait" class="online-wait hidden">
      <p>房间号</p>
      <div id="room-code" class="room-code"></div>
      <p id="room-status" class="tip"></p>
      <p id="online-enemy" class="tip hidden"></p>
      <div id="cat-tabs-online" class="cat-tabs hidden"></div>
      <div id="online-pick" class="card-list online-pick-list hidden"></div>
      <button id="btn-ready" class="btn wide hidden">准备</button>
    </div>
    <button id="btn-online-back" class="btn back corner-back" data-back="panel-start">返回</button>
  </section>

  <!-- 对战界面（单机）：双技能通道（冲刺 + 职业技能） -->
  <section id="screen-game" class="screen hidden">
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
      <div class="side left">
        <div class="pname" id="p2-name"></div>
        <div class="bar hp"><div class="fill" id="p2-hp"></div></div>
        <div class="bar passive"><div class="fill" id="p2-passive"></div></div>
      </div>
      <div class="side right">
        <div class="pname" id="p1-name"></div>
        <div class="bar hp"><div class="fill" id="p1-hp"></div></div>
        <div class="bar passive"><div class="fill" id="p1-passive"></div></div>
      </div>
    </div>
    <div id="match-timer" class="match-timer hidden"></div>
    <div id="dash-btn" class="skill-btn hidden"><span class="sname">冲刺</span><span class="scd"></span></div>
    <div id="active-btn" class="skill-btn active-pos hidden"><span class="sname"></span><span class="scd"></span></div>
    <div id="dash-cd-bar" class="cd-bar dash-pos hidden"><span id="dash-cd-name">冲刺</span><div class="bar"><div id="dash-cd-fill"></div></div><span id="dash-cd-key">SPACE</span></div>
    <div id="cd-bar" class="cd-bar hidden"><span id="cd-name"></span><div class="bar"><div id="cd-fill"></div></div><span id="cd-key">J</span></div>
    <div id="countdown" class="hidden"></div>
    <div id="result" class="hidden"></div>
  </section>

  <!-- 对战界面（联机专用战场，元素 id 加 online- 前缀互不干扰） -->
  <section id="screen-game-online" class="screen hidden">
    <canvas id="gameCanvasOnline"></canvas>
    <div id="hud-online">
      <div class="side left">
        <div class="pname" id="online-p2-name"></div>
        <div class="bar hp"><div class="fill" id="online-p2-hp"></div></div>
        <div class="bar passive"><div class="fill" id="online-p2-passive"></div></div>
      </div>
      <div class="side right">
        <div class="pname" id="online-p1-name"></div>
        <div class="bar hp"><div class="fill" id="online-p1-hp"></div></div>
        <div class="bar passive"><div class="fill" id="online-p1-passive"></div></div>
      </div>
    </div>
    <div id="online-match-timer" class="match-timer hidden"></div>
    <div id="online-dash-btn" class="skill-btn hidden"><span class="sname">冲刺</span><span class="scd"></span></div>
    <div id="online-active-btn" class="skill-btn active-pos hidden"><span class="sname"></span><span class="scd"></span></div>
    <div id="online-dash-cd-bar" class="cd-bar dash-pos hidden"><span id="online-dash-cd-name">冲刺</span><div class="bar"><div id="online-dash-cd-fill"></div></div><span id="online-dash-cd-key">SPACE</span></div>
    <div id="online-cd-bar" class="cd-bar hidden"><span id="online-cd-name"></span><div class="bar"><div id="online-cd-fill"></div></div><span id="online-cd-key">J</span></div>
    <div id="online-countdown" class="hidden"></div>
    <div id="online-result" class="hidden"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
