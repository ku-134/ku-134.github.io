<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资源分类 · Kukuz</title>
    <link rel="preload" as="image" href="background.webp">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== RP 页面专属样式 ===== */
        .rp-layout {
            display: flex;
            gap: 1.5rem;
            margin-top: 0.5rem;
            min-height: 320px;
        }
        .rp-sidebar {
            flex: 0 0 200px;
            border-right: 1px solid rgba(128, 128, 128, 0.12);
            padding-right: 1rem;
        }
        .rp-sidebar-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.4;
            margin-bottom: 0.8rem;
        }
        .rp-category-item {
            display: block;
            width: 100%;
            text-align: left;
            padding: 0.45rem 0.6rem;
            border-radius: 0.5rem;
            border: none;
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            opacity: 0.65;
        }
        .rp-category-item:hover {
            background: rgba(128, 128, 128, 0.08);
            opacity: 0.9;
        }
        .rp-category-item.active {
            background: rgba(128, 128, 128, 0.12);
            opacity: 1;
            font-weight: 600;
        }
        .rp-category-item .badge {
            font-size: 0.7rem;
            opacity: 0.5;
            margin-left: 0.3rem;
            font-weight: 400;
        }
        .rp-category-item.active .badge {
            opacity: 0.7;
        }

        .rp-content {
            flex: 1;
            min-width: 0;
        }
        .rp-content-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
            padding-bottom: 0.4rem;
            border-bottom: 2px dashed rgba(128, 128, 128, 0.1);
        }
        .rp-content-header .cat-name {
            font-size: 1.3rem;
            font-weight: 600;
        }
        .rp-content-header .cat-count {
            font-size: 0.85rem;
            opacity: 0.5;
        }

        /* ---- 搜索栏 ---- */
        .search-bar {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            min-width: 160px;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            border: 1px solid rgba(128, 128, 128, 0.2);
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-bar input:focus {
            border-color: currentColor;
        }
        .search-bar input::placeholder {
            opacity: 0.4;
        }
        .search-bar .clear-btn {
            cursor: pointer;
            opacity: 0.4;
            font-size: 1.2rem;
            padding: 0 0.3rem;
            transition: opacity 0.2s;
        }
        .search-bar .clear-btn:hover {
            opacity: 0.8;
        }
        .search-bar .fav-toggle {
            cursor: pointer;
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            border: 1px solid rgba(128, 128, 128, 0.2);
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s;
            opacity: 0.6;
            white-space: nowrap;
        }
        .search-bar .fav-toggle.active {
            opacity: 1;
            border-color: #f5a623;
            background: rgba(245, 166, 35, 0.1);
        }
        .search-bar .fav-toggle:hover {
            opacity: 1;
        }

        .rp-resource-item {
            display: flex;
            align-items: center;
            padding: 0.5rem 0.6rem;
            margin-bottom: 0.2rem;
            border-radius: 0.6rem;
            border-left: 3px solid transparent;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
            cursor: default;
            gap: 0.6rem;
        }
        .rp-resource-item:hover {
            background: rgba(128, 128, 128, 0.04);
        }
        .rp-resource-item.favorited {
            box-shadow: inset 0 0 0 1px #f5a623;
            border-left-color: #f5a623;
        }
        .rp-resource-item.type-github { border-left-color: #6e5494; }
        .rp-resource-item.type-pan    { border-left-color: #f5a623; }
        .rp-resource-item.type-other  { border-left-color: #4a90d9; }
        .rp-resource-item.type-local  { border-left-color: #7ed321; }
        .rp-resource-item.type-unknown{ border-left-color: #888; }

        .rp-resource-item .arrow {
            font-size: 0.75rem;
            opacity: 0.3;
            flex-shrink: 0;
            width: 1.2rem;
            text-align: center;
        }
        .rp-resource-item .name {
            font-weight: 600;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .rp-resource-item .name a {
            text-decoration: none;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s;
        }
        .rp-resource-item .name a:hover {
            border-bottom-color: currentColor;
        }
        .rp-resource-item .desc {
            font-size: 0.85rem;
            opacity: 0.55;
            flex: 1;
            min-width: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .rp-resource-item .type-tag {
            font-size: 0.65rem;
            padding: 0.1rem 0.6rem;
            border-radius: 1rem;
            opacity: 0.6;
            flex-shrink: 0;
            border: 1px solid currentColor;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .rp-resource-item .name.placeholder {
            opacity: 0.4;
            font-style: italic;
        }

        /* 收藏星标按钮 */
        .rp-resource-item .star-btn {
            cursor: pointer;
            font-size: 1.1rem;
            opacity: 0.3;
            transition: all 0.2s;
            background: none;
            border: none;
            padding: 0 0.2rem;
            color: inherit;
            flex-shrink: 0;
        }
        .rp-resource-item .star-btn:hover {
            opacity: 0.8;
            transform: scale(1.2);
        }
        .rp-resource-item .star-btn.active {
            opacity: 1;
            color: #f5a623;
            text-shadow: 0 0 8px rgba(245, 166, 35, 0.4);
        }

        .rp-empty {
            text-align: center;
            padding: 2.5rem 1rem;
            opacity: 0.4;
            font-size: 0.95rem;
        }

        .rp-fetch-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 280px;
            text-align: center;
        }
        .rp-fetch-btn {
            font-size: 1.6rem;
            padding: 1.2rem 3.5rem;
            border-radius: 3rem;
            border: 3px dashed currentColor;
            background: transparent;
            color: inherit;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.6;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .rp-fetch-btn:hover {
            opacity: 1;
            transform: scale(1.03);
            border-style: solid;
        }
        .rp-fetch-btn:active {
            transform: scale(0.96);
        }
        .rp-fetch-btn.loading {
            opacity: 0.8;
            cursor: wait;
            border-style: solid;
            animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .rp-fetch-btn .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
            font-size: 1.4rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .rp-fetch-hint {
            margin-top: 0.8rem;
            font-size: 0.85rem;
            opacity: 0.3;
        }

        @media (prefers-color-scheme: light) {
            .rp-resource-item.type-github { border-left-color: #6e5494; }
            .rp-resource-item.type-pan    { border-left-color: #d48c1a; }
            .rp-resource-item.type-other  { border-left-color: #2b6bb0; }
            .rp-resource-item.type-local  { border-left-color: #5a9e2e; }
            .rp-category-item.active { background: rgba(0,0,0,0.06); }
            .rp-fetch-btn { border-color: rgba(0,0,0,0.2); }
            .search-bar input { border-color: rgba(0,0,0,0.15); }
            .search-bar .fav-toggle { border-color: rgba(0,0,0,0.15); }
        }
        @media (prefers-color-scheme: dark) {
            .rp-category-item.active { background: rgba(255,255,255,0.06); }
            .rp-fetch-btn { border-color: rgba(255,255,255,0.15); }
            .search-bar input { border-color: rgba(255,255,255,0.15); }
            .search-bar .fav-toggle { border-color: rgba(255,255,255,0.15); }
        }

        @media (max-width: 600px) {
            .rp-layout { flex-direction: column; gap: 0.5rem; }
            .rp-sidebar {
                flex: none;
                border-right: none;
                padding-right: 0;
                display: flex;
                flex-wrap: wrap;
                gap: 0.3rem;
            }
            .rp-sidebar-title { display: none; }
            .rp-category-item {
                width: auto;
                padding: 0.3rem 0.8rem;
                font-size: 0.85rem;
                border-radius: 2rem;
                background: rgba(128, 128, 128, 0.06);
            }
            .rp-category-item .badge { display: none; }
            .rp-content-header .cat-name { font-size: 1.1rem; }
            .rp-resource-item { flex-wrap: wrap; gap: 0.2rem 0.5rem; }
            .rp-resource-item .desc {
                white-space: normal;
                flex-basis: 100%;
                margin-left: 1.8rem;
            }
            .rp-resource-item .type-tag { font-size: 0.55rem; padding: 0 0.5rem; }
            .rp-fetch-btn {
                font-size: 1.2rem;
                padding: 0.9rem 2rem;
                flex-direction: column;
                gap: 0.4rem;
            }
            .search-bar input { min-width: 100px; font-size: 0.85rem; }
            .search-bar .fav-toggle { font-size: 0.8rem; padding: 0.2rem 0.6rem; }
        }

        /* ===== 跳转确认弹窗 ===== */
        .rp-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            animation: overlayIn 0.25s ease-out;
        }
        .rp-overlay.active {
            display: flex;
        }
        @keyframes overlayIn {
            0% { opacity: 0; backdrop-filter: blur(0px); }
            100% { opacity: 1; backdrop-filter: blur(6px); }
        }

        .rp-modal {
            max-width: 440px;
            width: 90%;
            padding: 2rem 2rem 1.8rem;
            border-radius: 1.8rem;
            background: var(--modal-bg, rgba(20,30,20,0.88));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            text-align: center;
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes modalPop {
            0% { transform: scale(0.92) translateY(16px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        @media (prefers-color-scheme: light) {
            .rp-modal { --modal-bg: rgba(245, 250, 245, 0.92); border-color: rgba(0,0,0,0.06); }
        }
        @media (prefers-color-scheme: dark) {
            .rp-modal { --modal-bg: rgba(12, 22, 12, 0.92); border-color: rgba(255,255,255,0.06); }
        }

        .rp-modal .modal-icon {
            font-size: 2.8rem;
            margin-bottom: 0.2rem;
        }
        .rp-modal .modal-title {
            font-size: 1.6rem;
            font-weight: 700;
            word-break: break-all;
            margin-bottom: 0.2rem;
        }
        .rp-modal .modal-sub {
            font-size: 0.9rem;
            opacity: 0.5;
            margin-bottom: 0.8rem;
        }
        .rp-modal .modal-warning {
            font-size: 0.95rem;
            padding: 0.5rem 1rem;
            border-radius: 1rem;
            background: rgba(255, 200, 0, 0.10);
            border: 1px solid rgba(255, 200, 0, 0.15);
            margin-bottom: 1.8rem;
            display: inline-block;
        }
        .rp-modal .modal-warning strong {
            font-weight: 700;
        }

        .rp-modal .modal-actions {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .rp-modal .modal-actions button {
            padding: 0.55rem 2rem;
            border-radius: 3rem;
            border: 2px solid transparent;
            font-weight: 600;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
            min-width: 100px;
        }
        .rp-modal .modal-actions .btn-cancel {
            background: transparent;
            border-color: currentColor;
            opacity: 0.5;
        }
        .rp-modal .modal-actions .btn-cancel:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .rp-modal .modal-actions .btn-confirm {
            background: #c0392b;
            border-color: #c0392b;
            color: #fff;
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }
        .rp-modal .modal-actions .btn-confirm.ready {
            opacity: 1;
            cursor: pointer;
            background: #e74c3c;
            border-color: #e74c3c;
        }
        .rp-modal .modal-actions .btn-confirm.ready:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.3);
        }

        .rp-modal .countdown-ring {
            display: inline-block;
            width: 1.8rem;
            height: 1.8rem;
            line-height: 1.8rem;
            border-radius: 50%;
            border: 2px solid currentColor;
            font-size: 0.85rem;
            font-weight: 700;
            margin-left: 0.4rem;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .rp-modal .btn-confirm.ready .countdown-ring {
            opacity: 0.3;
        }
        body.modal-open {
            overflow: hidden;
        }

        /* ===== 反馈链接 ===== */
        .feedback-link {
            display: block;
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.85rem;
            opacity: 0.5;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
            text-decoration: underline dotted;
            text-underline-offset: 4px;
        }
        .feedback-link:hover {
            opacity: 1;
            transform: translateY(-1px);
        }

        #feedbackModal .modal-icon { font-size: 2.4rem; }
        #feedbackModal .modal-title { font-size: 1.5rem; }
        #feedbackModal .modal-sub {
            font-size: 0.95rem;
            opacity: 0.7;
            line-height: 1.6;
            text-align: left;
            padding: 0 0.5rem;
        }
        #feedbackModal .modal-sub a {
            color: inherit;
            text-decoration: underline;
            font-weight: 600;
        }
        #feedbackModal .modal-sub .highlight {
            color: #f5a623;
            font-weight: 700;
        }
        #feedbackModal .modal-actions .btn-confirm {
            background: #4a90d9;
            border-color: #4a90d9;
            opacity: 1;
            cursor: pointer;
            color: #fff;
        }
        #feedbackModal .modal-actions .btn-confirm:hover {
            background: #5a9ee9;
            border-color: #5a9ee9;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(74, 144, 217, 0.3);
        }
        @media (prefers-color-scheme: dark) {
            #feedbackModal .modal-actions .btn-confirm {
                background: #66bb6a;
                border-color: #66bb6a;
                color: #1a2e1a;
            }
            #feedbackModal .modal-actions .btn-confirm:hover {
                background: #81c784;
                border-color: #81c784;
            }
        }
    </style>
</head>
<body>
    <div class="card card-3d">
        <h1 class="typing-title">📦 资源分类</h1>
        <div class="sub fade-in-up delay-2">— 我整理的一些好东西 —</div>
        <div class="divider fade-in-up delay-3"></div>

        <div class="nav-menu fade-in-up delay-4">
            <a href="index.html" class="nav-link">🏠 首页</a>
            <a href="#" class="nav-link active">📦 资源</a>
            <a href="#" class="nav-link">🎮 玩点游戏？</a>
        </div>

        <div class="resource-stats fade-in-up delay-5" id="stats"></div>

        <!-- ===== 搜索栏 + 收藏切换 ===== -->
        <div class="search-bar fade-in-up delay-5">
            <input type="text" id="searchInput" placeholder="🔍 搜索资源..." autocomplete="off">
            <span class="clear-btn" id="clearSearch" style="display:none;">✕</span>
            <button class="fav-toggle" id="favToggle">⭐ 收藏</button>
        </div>

        <div class="rp-layout fade-in-up delay-6">
            <div class="rp-sidebar">
                <div class="rp-sidebar-title">📂 分类</div>
                <div id="categoryList">
                    <div class="rp-empty" style="padding:0.5rem 0;font-size:0.85rem;">⬅️ 点击右侧拉取</div>
                </div>
            </div>

            <div class="rp-content">
                <div id="resourceArea">
                    <div class="rp-fetch-area" id="fetchArea">
                        <button class="rp-fetch-btn" id="fetchBtn">
                            📂 拉取分类
                        </button>
                        <div class="rp-fetch-hint">点击后加载 category.txt</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="feedback-link fade-in-up delay-7" id="feedbackTrigger">
            💬 无法“拉取分类”或资源等存在问题？点击告知站主。
        </div>

        <div class="footer fade-in-up delay-7">
            📂 资源持续更新中 · 欢迎收藏
        </div>
    </div>

    <!-- ===== 跳转确认弹窗 ===== -->
    <div class="rp-overlay" id="modalOverlay">
        <div class="rp-modal">
            <div class="modal-icon" id="modalIcon">🔗</div>
            <div class="modal-title" id="modalTitle">资源名</div>
            <div class="modal-sub" id="modalDesc">资源描述</div>
            <div class="modal-warning" id="modalWarning">
                ⚠️ 即将跳转到 <strong id="modalTypeLabel">GitHub</strong> 页面，请确认安全。
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancel">取消</button>
                <button class="btn-confirm" id="modalConfirm">
                    确认跳转
                    <span class="countdown-ring" id="countdownRing">3</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ===== 反馈弹窗 ===== -->
    <div class="rp-overlay" id="feedbackOverlay">
        <div class="rp-modal" id="feedbackModal">
            <div class="modal-icon">📢</div>
            <div class="modal-title">反馈问题</div>
            <div class="modal-sub" style="text-align:left; line-height:1.8;">
                <p>通过以下方式反馈：</p>
                <p>1. 写邮件：<a href="mailto:3074341324@qq.com">3074341324@qq.com</a></p>
                <p>2. 在B站私信/评论我：<a href="https://space.bilibili.com/搜索KU_134" target="_blank">KU_134</a> <span style="color:#f5a623; font-weight:700;">（推荐）</span></p>
                <p style="opacity:0.6; font-size:0.85rem; margin-top:0.3rem;">提示：加QQ好友的话，大概通会不通过。所以推荐在B站评论。</p>
            </div>
            <div class="modal-actions">
                <button class="btn-confirm" id="feedbackConfirm" style="opacity:1; cursor:pointer;">确认</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- 核心数据 ----------
            let allCategories = [];
            let currentCategory = null;
            let currentView = 'all'; // 'all' 或 'favorites'
            let searchQuery = '';
            let favorites = [];

            // ---------- DOM 引用 ----------
            const categoryListEl = document.getElementById('categoryList');
            const resourceAreaEl = document.getElementById('resourceArea');
            const statsEl = document.getElementById('stats');
            const fetchBtn = document.getElementById('fetchBtn');
            const searchInput = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearSearch');
            const favToggle = document.getElementById('favToggle');

            // ---------- 收藏管理 ----------
            function loadFavorites() {
                try {
                    const data = localStorage.getItem('favorites');
                    favorites = data ? JSON.parse(data) : [];
                } catch { favorites = []; }
            }
            function saveFavorites() {
                localStorage.setItem('favorites', JSON.stringify(favorites));
            }
            function isFavorited(name) {
                return favorites.includes(name);
            }
            function toggleFavorite(name) {
                const idx = favorites.indexOf(name);
                if (idx > -1) {
                    favorites.splice(idx, 1);
                } else {
                    favorites.push(name);
                }
                saveFavorites();
                // 重新渲染当前视图
                renderCurrentView();
            }

            // ---------- 弹窗相关 ----------
            const overlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalDesc = document.getElementById('modalDesc');
            const modalIcon = document.getElementById('modalIcon');
            const modalTypeLabel = document.getElementById('modalTypeLabel');
            const modalWarning = document.getElementById('modalWarning');
            const btnCancel = document.getElementById('modalCancel');
            const btnConfirm = document.getElementById('modalConfirm');
            const countdownRing = document.getElementById('countdownRing');
            let pendingLink = null;
            let countdownTimer = null;
            let countdownValue = 3;

            function openModal(name, desc, link, type) {
                if (!link) return;
                pendingLink = link;
                const typeLabel = getTypeLabel(type);
                const icon = getTypeIcon(type);
                modalTitle.textContent = name;
                modalDesc.textContent = desc || '没有更多描述';
                modalIcon.textContent = icon;
                modalTypeLabel.textContent = typeLabel;
                modalWarning.innerHTML = `⚠️ 即将跳转到 <strong>${typeLabel}</strong> 页面，请确认安全。`;
                btnConfirm.classList.remove('ready');
                btnConfirm.disabled = true;
                countdownValue = 3;
                countdownRing.textContent = '3';
                overlay.classList.add('active');
                document.body.classList.add('modal-open');
                if (countdownTimer) clearInterval(countdownTimer);
                countdownTimer = setInterval(function() {
                    countdownValue -= 1;
                    countdownRing.textContent = countdownValue;
                    if (countdownValue <= 0) {
                        clearInterval(countdownTimer);
                        countdownTimer = null;
                        btnConfirm.classList.add('ready');
                        btnConfirm.disabled = false;
                        countdownRing.textContent = '✓';
                    }
                }, 1000);
            }
            function closeModal() {
                overlay.classList.remove('active');
                document.body.classList.remove('modal-open');
                if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
                pendingLink = null;
                btnConfirm.classList.remove('ready');
                btnConfirm.disabled = true;
                countdownRing.textContent = '3';
            }
            function confirmJump() {
                if (!pendingLink || btnConfirm.disabled) return;
                window.open(pendingLink, '_blank', 'noopener,noreferrer');
                closeModal();
            }
            btnCancel.addEventListener('click', closeModal);
            btnConfirm.addEventListener('click', confirmJump);
            overlay.addEventListener('click', function(e) { if (e.target === overlay) closeModal(); });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && overlay.classList.contains('active')) closeModal();
            });

            // ---------- 反馈弹窗 ----------
            const feedbackTrigger = document.getElementById('feedbackTrigger');
            const feedbackOverlay = document.getElementById('feedbackOverlay');
            const feedbackConfirm = document.getElementById('feedbackConfirm');
            feedbackTrigger.addEventListener('click', function() {
                feedbackOverlay.classList.add('active');
                document.body.classList.add('modal-open');
            });
            feedbackConfirm.addEventListener('click', function() {
                feedbackOverlay.classList.remove('active');
                document.body.classList.remove('modal-open');
            });
            feedbackOverlay.addEventListener('click', function(e) {
                if (e.target === feedbackOverlay) {
                    feedbackOverlay.classList.remove('active');
                    document.body.classList.remove('modal-open');
                }
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && feedbackOverlay.classList.contains('active')) {
                    feedbackOverlay.classList.remove('active');
                    document.body.classList.remove('modal-open');
                }
            });

            // ---------- 解析 category.txt ----------
            function parseCategoryTxt(text) {
                const lines = text.split('\n');
                const categories = [];
                let current = null;
                for (let raw of lines) {
                    let line = raw.trim();
                    if (!line) continue;
                    if (line.startsWith('##')) {
                        const name = line.replace(/^##\s*/, '').trim();
                        current = { name, items: [] };
                        categories.push(current);
                        continue;
                    }
                    if (line.startsWith('- ') && current) {
                        const content = line.replace(/^-\s*/, '').trim();
                        const parts = content.split('|').map(s => s.trim());
                        let item = { name: '', desc: '', link: '', type: 'other' };
                        if (parts.length >= 4) {
                            item.name = parts[0] || '';
                            item.desc = parts[1] || '';
                            item.link = parts[2] || '';
                            item.type = parts[3] || 'other';
                        } else if (parts.length === 3) {
                            item.name = parts[0] || '';
                            item.desc = parts[1] || '';
                            item.link = parts[2] || '';
                            item.type = detectType(item.link);
                        } else if (parts.length === 2) {
                            item.name = parts[0] || '';
                            item.desc = '';
                            item.link = parts[1] || '';
                            item.type = detectType(item.link);
                        } else if (parts.length === 1) {
                            item.name = parts[0] || '';
                            item.desc = '';
                            item.link = '';
                            item.type = 'placeholder';
                        }
                        if (!item.link) item.type = 'placeholder';
                        if (item.name) current.items.push(item);
                    }
                }
                return categories;
            }

            function detectType(link) {
                if (!link) return 'placeholder';
                const l = link.toLowerCase();
                if (l.includes('github.com')) return 'github';
                if (l.includes('pan.baidu.com') || l.includes('yunpan') || l.includes('netdisk') || l.includes('网盘')) return 'pan';
                if (l.startsWith('/') || l.startsWith('./') || l.startsWith('../')) return 'local';
                return 'other';
            }

            function getTypeLabel(type) {
                const map = { 'github': 'GitHub', 'pan': '网盘', 'local': '站内', 'other': '外部', 'placeholder': '占位' };
                return map[type] || '外部';
            }
            function getTypeIcon(type) {
                const map = { 'github': '🐙', 'pan': '☁️', 'local': '📁', 'other': '🔗', 'placeholder': '⏳' };
                return map[type] || '🔗';
            }

            // ---------- 渲染逻辑 ----------
            function getFilteredItems() {
                // 先根据当前视图（全部/收藏）过滤分类
                let categories = allCategories;
                if (currentView === 'favorites') {
                    // 只保留包含收藏资源的分类（但我们要展示所有收藏资源，跨分类）
                    // 这里我们直接返回收藏的资源列表（平铺）
                    const allItems = [];
                    for (const cat of allCategories) {
                        for (const item of cat.items) {
                            if (isFavorited(item.name)) {
                                allItems.push({ ...item, category: cat.name });
                            }
                        }
                    }
                    return allItems;
                } else {
                    // 全部视图：返回所有资源（带分类名）
                    const allItems = [];
                    for (const cat of allCategories) {
                        for (const item of cat.items) {
                            allItems.push({ ...item, category: cat.name });
                        }
                    }
                    return allItems;
                }
            }

            function renderCurrentView() {
                const items = getFilteredItems();
                // 应用搜索过滤
                let filtered = items;
                if (searchQuery.trim() !== '') {
                    const q = searchQuery.trim().toLowerCase();
                    filtered = items.filter(item =>
                        item.name.toLowerCase().includes(q) ||
                        (item.desc && item.desc.toLowerCase().includes(q))
                    );
                }

                // 如果没有资源，显示空状态
                if (filtered.length === 0) {
                    let msg = '📭 没有找到资源';
                    if (currentView === 'favorites') msg = '⭐ 还没有收藏任何资源，快去收藏吧！';
                    if (searchQuery.trim() !== '') msg = '🔍 没有找到匹配的资源';
                    resourceAreaEl.innerHTML = `
                        <div class="rp-content-header">
                            <span class="cat-name">${currentView === 'favorites' ? '⭐ 我的收藏' : '全部资源'}</span>
                            <span class="cat-count">0 个</span>
                        </div>
                        <div class="rp-empty">${msg}</div>
                    `;
                    updateStats();
                    return;
                }

                // 渲染资源列表
                let html = `
                    <div class="rp-content-header">
                        <span class="cat-name">${currentView === 'favorites' ? '⭐ 我的收藏' : '全部资源'}</span>
                        <span class="cat-count">${filtered.length} 个资源</span>
                    </div>
                `;
                for (const item of filtered) {
                    const typeClass = 'type-' + item.type;
                    const typeLabel = getTypeLabel(item.type);
                    const icon = getTypeIcon(item.type);
                    const hasLink = item.link && item.type !== 'placeholder';
                    const linkAttr = hasLink ? `data-link="${item.link}" data-type="${item.type}"` : '';
                    const fav = isFavorited(item.name) ? 'active' : '';
                    const favoritedClass = isFavorited(item.name) ? 'favorited' : '';

                    const nameHtml = hasLink ?
                        `<a href="#" class="rp-resource-link" ${linkAttr}>${item.name}</a>` :
                        `<span class="name placeholder">${item.name}（即将上线）</span>`;

                    html += `
                        <div class="rp-resource-item ${typeClass} ${favoritedClass}">
                            <span class="arrow">${icon}</span>
                            <span class="name">${nameHtml}</span>
                            ${item.desc ? `<span class="desc">${item.desc}</span>` : ''}
                            <span class="type-tag">${typeLabel}</span>
                            <button class="star-btn ${fav}" data-name="${item.name}" title="收藏/取消收藏">${fav ? '★' : '☆'}</button>
                        </div>
                    `;
                }
                resourceAreaEl.innerHTML = html;

                // 绑定资源链接点击
                document.querySelectorAll('.rp-resource-link').forEach(a => {
                    a.addEventListener('click', function(e) {
                        e.preventDefault();
                        const link = this.dataset.link;
                        const type = this.dataset.type || 'other';
                        const name = this.textContent.trim();
                        const parent = this.closest('.rp-resource-item');
                        const descEl = parent ? parent.querySelector('.desc') : null;
                        const desc = descEl ? descEl.textContent.trim() : '';
                        openModal(name, desc, link, type);
                    });
                });

                // 绑定星标按钮
                document.querySelectorAll('.star-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const name = this.dataset.name;
                        toggleFavorite(name);
                    });
                });

                updateStats();
            }

            function updateStats() {
                const items = getFilteredItems();
                const total = items.length;
                const favCount = favorites.length;
                let text = `共 ${allCategories.length} 个分类 · ${total} 个资源`;
                if (favCount > 0) text += ` · ⭐ ${favCount} 个收藏`;
                statsEl.textContent = text;
            }

            // ---------- 切换分类（左侧目录树点击） ----------
            function switchCategory(name) {
                if (name === '__all__') {
                    currentView = 'all';
                    searchQuery = '';
                    searchInput.value = '';
                    clearBtn.style.display = 'none';
                    favToggle.classList.remove('active');
                    renderCurrentView();
                    return;
                }
                if (name === '__favorites__') {
                    currentView = 'favorites';
                    searchQuery = '';
                    searchInput.value = '';
                    clearBtn.style.display = 'none';
                    favToggle.classList.add('active');
                    renderCurrentView();
                    return;
                }
                // 普通分类：切换视图为全部，但只显示该分类
                currentView = 'all';
                // 暂时不支持单分类过滤，目前只在全部中展示
                // 但我们可以在侧边栏高亮
                // 重新渲染全部
                renderCurrentView();
                // 高亮侧边栏
                document.querySelectorAll('.rp-category-item').forEach(b => b.classList.remove('active'));
                const target = document.querySelector(`.rp-category-item[data-category="${name}"]`);
                if (target) target.classList.add('active');
            }

            // ---------- 侧边栏渲染 ----------
            function renderSidebar(categories) {
                if (!categories || categories.length === 0) {
                    categoryListEl.innerHTML = `<div class="rp-empty" style="padding:0.5rem 0;font-size:0.85rem;">暂无分类</div>`;
                    return;
                }
                let html = '';
                // 全部
                html += `<button class="rp-category-item active" data-category="__all__">📂 全部</button>`;
                // 收藏
                const favCount = favorites.length;
                html += `<button class="rp-category-item" data-category="__favorites__">⭐ 我的收藏 <span class="badge">${favCount}</span></button>`;
                // 各分类
                for (const cat of categories) {
                    const count = cat.items.filter(it => it.type !== 'placeholder').length;
                    html += `<button class="rp-category-item" data-category="${cat.name}">${cat.name}<span class="badge">${count}</span></button>`;
                }
                categoryListEl.innerHTML = html;

                // 绑定点击事件
                document.querySelectorAll('.rp-category-item').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('.rp-category-item').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        const name = this.dataset.category;
                        if (name === '__all__') {
                            currentView = 'all';
                            searchQuery = '';
                            searchInput.value = '';
                            clearBtn.style.display = 'none';
                            favToggle.classList.remove('active');
                            renderCurrentView();
                        } else if (name === '__favorites__') {
                            currentView = 'favorites';
                            searchQuery = '';
                            searchInput.value = '';
                            clearBtn.style.display = 'none';
                            favToggle.classList.add('active');
                            renderCurrentView();
                        } else {
                            // 普通分类：只显示该分类的资源
                            // 我们实现一个临时过滤
                            const items = [];
                            const cat = allCategories.find(c => c.name === name);
                            if (cat) {
                                for (const item of cat.items) {
                                    items.push({ ...item, category: cat.name });
                                }
                            }
                            // 直接渲染这些items
                            renderFilteredItems(items, name);
                        }
                    });
                });
            }

            // 辅助：渲染指定的资源列表（用于单分类）
            function renderFilteredItems(items, categoryName) {
                if (items.length === 0) {
                    resourceAreaEl.innerHTML = `
                        <div class="rp-content-header">
                            <span class="cat-name">${categoryName}</span>
                            <span class="cat-count">0 个资源</span>
                        </div>
                        <div class="rp-empty">这个分类暂时是空的</div>
                    `;
                    updateStats();
                    return;
                }
                // 应用搜索过滤
                let filtered = items;
                if (searchQuery.trim() !== '') {
                    const q = searchQuery.trim().toLowerCase();
                    filtered = items.filter(item =>
                        item.name.toLowerCase().includes(q) ||
                        (item.desc && item.desc.toLowerCase().includes(q))
                    );
                }
                let html = `
                    <div class="rp-content-header">
                        <span class="cat-name">${categoryName}</span>
                        <span class="cat-count">${filtered.length} 个资源</span>
                    </div>
                `;
                for (const item of filtered) {
                    const typeClass = 'type-' + item.type;
                    const typeLabel = getTypeLabel(item.type);
                    const icon = getTypeIcon(item.type);
                    const hasLink = item.link && item.type !== 'placeholder';
                    const linkAttr = hasLink ? `data-link="${item.link}" data-type="${item.type}"` : '';
                    const fav = isFavorited(item.name) ? 'active' : '';
                    const favoritedClass = isFavorited(item.name) ? 'favorited' : '';
                    const nameHtml = hasLink ?
                        `<a href="#" class="rp-resource-link" ${linkAttr}>${item.name}</a>` :
                        `<span class="name placeholder">${item.name}（即将上线）</span>`;
                    html += `
                        <div class="rp-resource-item ${typeClass} ${favoritedClass}">
                            <span class="arrow">${icon}</span>
                            <span class="name">${nameHtml}</span>
                            ${item.desc ? `<span class="desc">${item.desc}</span>` : ''}
                            <span class="type-tag">${typeLabel}</span>
                            <button class="star-btn ${fav}" data-name="${item.name}" title="收藏/取消收藏">${fav ? '★' : '☆'}</button>
                        </div>
                    `;
                }
                resourceAreaEl.innerHTML = html;
                // 绑定事件
                document.querySelectorAll('.rp-resource-link').forEach(a => {
                    a.addEventListener('click', function(e) {
                        e.preventDefault();
                        const link = this.dataset.link;
                        const type = this.dataset.type || 'other';
                        const name = this.textContent.trim();
                        const parent = this.closest('.rp-resource-item');
                        const descEl = parent ? parent.querySelector('.desc') : null;
                        const desc = descEl ? descEl.textContent.trim() : '';
                        openModal(name, desc, link, type);
                    });
                });
                document.querySelectorAll('.star-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const name = this.dataset.name;
                        toggleFavorite(name);
                    });
                });
                updateStats();
            }

            // ---------- 拉取数据 ----------
            let isLoading = false;
            function fetchAndRender() {
                if (isLoading) return;
                isLoading = true;
                fetchBtn.classList.add('loading');
                fetchBtn.innerHTML = `<span class="spinner">⟳</span> 加载中...`;
                fetch('category.txt?t=' + Date.now())
                    .then(res => {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.text();
                    })
                    .then(text => {
                        if (!text.trim()) {
                            allCategories = [];
                            renderSidebar([]);
                            resourceAreaEl.innerHTML = `<div class="rp-empty">📭 category.txt 为空</div>`;
                            statsEl.textContent = '';
                            return;
                        }
                        allCategories = parseCategoryTxt(text);
                        loadFavorites();
                        renderSidebar(allCategories);
                        // 默认显示全部
                        currentView = 'all';
                        searchQuery = '';
                        searchInput.value = '';
                        clearBtn.style.display = 'none';
                        favToggle.classList.remove('active');
                        renderCurrentView();
                    })
                    .catch(err => {
                        console.warn('加载失败:', err);
                        resourceAreaEl.innerHTML = `<div class="rp-empty">❌ 加载失败<br><button class="btn btn-secondary" style="margin-top:1rem;" onclick="location.reload()">🔄 重试</button></div>`;
                        statsEl.textContent = '';
                    })
                    .finally(() => {
                        isLoading = false;
                        fetchBtn.classList.remove('loading');
                        fetchBtn.innerHTML = '📂 已加载';
                        fetchBtn.style.opacity = '0.4';
                        fetchBtn.style.cursor = 'default';
                        fetchBtn.disabled = true;
                    });
            }
            fetchBtn.addEventListener('click', fetchAndRender);

            // ---------- 搜索事件 ----------
            let searchTimer = null;
            searchInput.addEventListener('input', function() {
                const val = this.value.trim();
                searchQuery = val;
                clearBtn.style.display = val.length > 0 ? 'inline' : 'none';
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => {
                    // 如果当前是分类视图，重新渲染该分类；否则渲染全部
                    const activeCat = document.querySelector('.rp-category-item.active');
                    if (activeCat) {
                        const name = activeCat.dataset.category;
                        if (name === '__all__') {
                            currentView = 'all';
                            renderCurrentView();
                        } else if (name === '__favorites__') {
                            currentView = 'favorites';
                            renderCurrentView();
                        } else {
                            // 重新过滤该分类
                            const cat = allCategories.find(c => c.name === name);
                            if (cat) {
                                const items = cat.items.map(item => ({ ...item, category: cat.name }));
                                renderFilteredItems(items, cat.name);
                            }
                        }
                    } else {
                        renderCurrentView();
                    }
                }, 200);
            });
            clearBtn.addEventListener('click', function() {
                searchInput.value = '';
                searchQuery = '';
                this.style.display = 'none';
                // 重新渲染当前视图
                const activeCat = document.querySelector('.rp-category-item.active');
                if (activeCat) {
                    const name = activeCat.dataset.category;
                    if (name === '__all__' || name === '__favorites__') {
                        renderCurrentView();
                    } else {
                        const cat = allCategories.find(c => c.name === name);
                        if (cat) {
                            const items = cat.items.map(item => ({ ...item, category: cat.name }));
                            renderFilteredItems(items, cat.name);
                        }
                    }
                } else {
                    renderCurrentView();
                }
            });

            // ---------- 收藏切换按钮 ----------
            favToggle.addEventListener('click', function() {
                const isActive = this.classList.contains('active');
                if (isActive) {
                    // 切换到全部
                    this.classList.remove('active');
                    currentView = 'all';
                    searchQuery = '';
                    searchInput.value = '';
                    clearBtn.style.display = 'none';
                    // 高亮“全部”分类
                    document.querySelectorAll('.rp-category-item').forEach(b => b.classList.remove('active'));
                    const allBtn = document.querySelector('.rp-category-item[data-category="__all__"]');
                    if (allBtn) allBtn.classList.add('active');
                    renderCurrentView();
                } else {
                    // 切换到收藏
                    this.classList.add('active');
                    currentView = 'favorites';
                    searchQuery = '';
                    searchInput.value = '';
                    clearBtn.style.display = 'none';
                    document.querySelectorAll('.rp-category-item').forEach(b => b.classList.remove('active'));
                    const favBtn = document.querySelector('.rp-category-item[data-category="__favorites__"]');
                    if (favBtn) favBtn.classList.add('active');
                    renderCurrentView();
                }
            });

            // ---------- 初始化时加载收藏状态 ----------
            loadFavorites();

        })();
    </script>

    <script src="script.js"></script>
</body>
</html>
